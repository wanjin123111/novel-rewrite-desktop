        return;
      }
      await sleep(1500);
      render();
      const groups = readyEpisodeGroups();
      if (!groups.length && !activeDownloadedEpisodes.size) {
        const reason = batchOptions.noVideoReason || '自动获取全集后仍没有抓到可保存的整集资源；可能是锁集、站点限制，或需要人工播放解锁。';
        recordBatchFailure({ url: originalInputUrl || startUrl, title: activeSeriesTitle || lastState.title || titleFromUrl(startUrl) }, reason, {
          type: isNoVideoReason(reason) ? 'no-video' : 'download-failed',
          notice: isNoVideoReason(reason),
        });
        logTask(reason);
        setStatus(isNoVideoReason(reason) ? '已跳过：这条链接没有视频内容' : '没有抓到可保存整集资源', 'error');
        if (!activeDownloadedEpisodes.size) await cleanupEmptyLinkDir(activeLinkDownloadDir, downloadDir, activeSeriesTitle || titleFromUrl(startUrl));
        return;
      }

      logTask(`等待所有后台下载任务完成... 共 ${backgroundPromises.length} 个任务`);
      await Promise.all(backgroundPromises);
      if (scanAbort) {
        logTask('已停止，跳过补漏下载');
        setStatus('已停止自动保存', 'error');
        if (!activeDownloadedEpisodes.size) await cleanupEmptyLinkDir(activeLinkDownloadDir, downloadDir, activeSeriesTitle || titleFromUrl(startUrl));
        return;
      }

      if (shouldForceFirstEpisodeRetry()) {
        await retryFirstEpisodeUntilSaved(startUrl, activeLinkDownloadDir, '补漏前检测到首集缺失');
        if (scanAbort) {
          setStatus('已停止自动保存', 'error');
          return;
        }
      }

      const allEpisodes = currentEpisodeGroups().filter(g => g.episodeNo && g.main && !g.incomplete).map(g => g.episodeNo);
      const missingEpisodes = allEpisodes.filter(ep => !activeDownloadedEpisodes.has(ep));
      if (missingEpisodes.length) {
        logTask(`发现 ${missingEpisodes.length} 集未成功下载，将重新补漏`);
        const result = await downloadListedEpisodes(activeLinkDownloadDir, {
          keepUiRunning: true,
          skipEpisodes: activeDownloadedEpisodes,
          appendLog: true,
        });
        if (result.ok) {
          logTask(`补漏下载完成，成功 ${result.ok} 集，失败 ${result.failed} 集`);
          for (const ep of result.successEpisodes) {
            activeDownloadedEpisodes.add(ep);
          }
        }
      }

      const savedTotal = activeDownloadedEpisodes.size;
      if (scanAbort) {

      } else if (savedTotal) {

        startAutoAnalyzeForDir(activeLinkDownloadDir, activeSeriesTitle || lastState.title || titleFromUrl(startUrl));
        setStatus(`已自动保存 ${savedTotal} 集到：${activeLinkDownloadDir}`);
      } else {
        setStatus('自动保存未成功，请查看日志里的失败原因', 'error');
        await cleanupEmptyLinkDir(activeLinkDownloadDir, downloadDir, activeSeriesTitle || titleFromUrl(startUrl));
      }
    } finally {
      scanAbort = false;
      setScanUi(false);
    }

  function buildUrlTemplate(url, ep) {
    try {
      const u = new URL(url);
      const segs = u.pathname.split('/');
      const file = decodeURIComponent(segs[segs.length - 1]);
      let m = file.match(/^(\d{1,4})([_-]*\.(?:m3u8|m3u|mpd|mp4|m4v))$/i);
      if (m && Number(m[1]) === ep && !RESOLUTION_NUMBERS.has(ep)) {
        const pad = m[1].length, tail = m[2];
        return { form: 'file', make: (n) => { const s = u.pathname.split('/'); s[s.length - 1] = encodeURIComponent(String(n).padStart(pad, '0') + tail); const uu = new URL(url); uu.pathname = s.join('/'); return uu.toString(); } };
      }
      m = file.match(/^((?:manifest|index|playlist|chunklist|media)[_-]?)(\d{1,4})(\.(?:m3u8|m3u))$/i);
      if (m && Number(m[2]) === ep && !RESOLUTION_NUMBERS.has(ep)) {
        const pre = m[1], pad = m[2].length, suf = m[3];
        return { form: 'manifest', make: (n) => { const s = u.pathname.split('/'); s[s.length - 1] = encodeURIComponent(pre + String(n).padStart(pad, '0') + suf); const uu = new URL(url); uu.pathname = s.join('/'); return uu.toString(); } };
      }
      for (let i = segs.length - 2; i >= 0; i--) {
        const sm = decodeURIComponent(segs[i]).match(/^(ep|episode|e)?[_-]?(\d{1,4})$/i);
        if (sm && Number(sm[2]) === ep && !RESOLUTION_NUMBERS.has(ep)) {
          const pre = sm[1] || '', pad = sm[2].length;
          return { form: 'path', make: (n) => { const s = u.pathname.split('/'); s[i] = pre + String(n).padStart(pad, '0'); const uu = new URL(url); uu.pathname = s.join('/'); return uu.toString(); } };
        }
      }
    } catch {}
    return null;
  }

  function deriveEpisodeTemplate() {
    const cands = [];
    Array.from(resources.values()).filter(isWholeMedia).forEach((it) => {
      const ep = extractResourceEpisodeNo(it.filename) || extractResourceEpisodeNo(it.url);
      if (ep) cands.push({ it, ep });
    });
    cands.sort((a, b) => (typeOf(a.it) === 'm3u8' ? 0 : 1) - (typeOf(b.it) === 'm3u8' ? 0 : 1));
    for (const { it, ep } of cands) {
      const tpl = buildUrlTemplate(it.url, ep);
      if (tpl) return { make: tpl.make, form: tpl.form, sampleEp: ep, referer: it.referer || '', userAgent: it.userAgent || '' };
    }
    return null;
  }

  // 规律下载复用 mergeEpisodeToDir 的重试逻辑
  async function downloadAllByTemplate(tpl, start, end, dir) {
    scanAbort = false;
    setScanUi(true);
    let ok = 0, failed = 0;
    const successEpisodes = [];
    logTask(`按文件名规律下载第 ${start}-${end} 集（不翻页，逐集合成，顺序固定）`, 'replace');
    try {
      for (let ep = start; ep <= end; ep++) {
        if (scanAbort) break;
        const url = tpl.make(ep);
        const name = cleanOutputName(String(ep).padStart(3, '0') + '-第' + ep + '集', '第' + ep + '集') + '.mp4';
        logTask(`第 ${ep} 集 · ${ep - start + 1}/${end - start + 1} · 合成 ${name}`);
        // 构造一个临时的 group 对象，以便复用 mergeEpisodeToDir
        const tempGroup = {
          main: { url: url, referer: tpl.referer, userAgent: tpl.userAgent },
          title: '第' + ep + '集',
          incomplete: false,
          episodeNo: ep
        };
        try {
          await mergeEpisodeToDir(tempGroup, dir, ep, 3);
          ok++;
          successEpisodes.push(ep);
          activeDownloadedEpisodes.add(ep);
          logTask(`第 ${ep} 集已保存 · 累计成功 ${ok} 集`);
          await saveDramaSourceDocument(dir, { note: `第 ${ep} 集保存成功后自动更新` });
        } catch (err) {
          failed++;
          logTask(`第 ${ep} 集失败：${err && err.message ? err.message : err}`);
        }
      }
      logTask(scanAbort ? `已停止 · 成功 ${ok} 集 · 失败 ${failed} 集` : `规律下载完成 · 成功 ${ok} 集 · 失败 ${failed} 集`);
      return { ok, failed, total: end - start + 1, successEpisodes };
    } finally {
      scanAbort = false;
      setScanUi(false);
    }
  }

  async function downloadEpisodeRange() {

    const tpl = deriveEpisodeTemplate();

      setStatus('正在识别网页总集数…');
      const inferred = await inferEpisodeRange();
      let start = inferred.start;
      let end = inferred.end;
      if (!inferred.inferred) {
        const rangeText = await askInput('已检测到可按文件名规律下载（样本第 ' + tpl.sampleEp + ' 集）。\n请输入要下载的范围，例如 1-80；只填 80 代表 1-80。', `1-${end}`);
        if (rangeText == null) { logTask('已取消下载全集'); return; }
        ({ start, end } = parseRange(rangeText, inferred.current));
      }
      if (!start || !end || end < start) { setStatus('集数范围不正确', 'error'); return; }
      if (end - start + 1 > 300 && !window.confirm('范围超过 300 集，会很久，确定继续吗？')) return;
      const go = window.confirm(
        '将按文件名规律下载第 ' + start + '–' + end + ' 集到本剧独立文件夹：\n' + dir +
        '\n\n样本（第 ' + tpl.sampleEp + ' 集）地址：\n' + decodeURIComponent(tpl.make(tpl.sampleEp)) +
        '\n\n确定开始？\n（点“取消”则改为下载列表里已抓到的集）'
      );
      if (go) {
        const result = await downloadAllByTemplate(tpl, start, end, dir);
        if (result && result.ok) {

          startAutoAnalyzeForDir(dir, activeSeriesTitle || lastState.title || titleFromUrl(currentUrl));
        }
        return;
      }
    }

    const result = await downloadListedEpisodes(dir);
    if (result && result.ok) {
      await saveDramaSourceDocument(dir, { savedTotal: result.ok, note: '下载全集完成后自动更新' });
      startAutoAnalyzeForDir(dir, activeSeriesTitle || lastState.title || titleFromUrl(currentUrl));
    }
  }

  function parseCustomHeaders(inputText) {
    const headers = {};
    const lines = inputText.split(/\r?\n/);
    for (const line of lines) {
      const idx = line.indexOf(':');
      if (idx > 0) {
        const key = line.slice(0, idx).trim();
        const val = line.slice(idx + 1).trim();
        if (key && val) headers[key] = val;
      }
    }
    return headers;
  }

    if (directEl) directEl.checked = localStorage.getItem(EVOLINK_DIRECT_MODE_KEY) === '1';
    keyEl.value = localStorage.getItem('evolink_key') || '';
    if (promptEl) promptEl.value = localStorage.getItem('evolink_video_prompt') || '';
    if (modelEl) modelEl.value = localStorage.getItem('evolink_model') || '';
    refresh();
    if (directEl) directEl.addEventListener('change', () => {
      localStorage.setItem(EVOLINK_DIRECT_MODE_KEY, directEl.checked ? '1' : '0');
      refresh();
      setStatus(directEl.checked ? '已打开直连模式：解析会使用 EvoLink Key' : '已关闭直连模式：解析会走后端模型');
    });
    saveBtn.addEventListener('click', () => {
      const k = (keyEl.value || '').trim();
      if (k) localStorage.setItem('evolink_key', k); else localStorage.removeItem('evolink_key');
      if (promptEl) localStorage.setItem('evolink_video_prompt', promptEl.value || '');
      if (modelEl) {
        const m = (modelEl.value || '').trim();
        if (m) localStorage.setItem('evolink_model', m); else localStorage.removeItem('evolink_model');
      }
      refresh();
      setStatus(isEvolinkDirectEnabled()
        ? (k ? '已保存 EvoLink 配置，本次解析将直连' : '已保存，但直连模式还缺 EvoLink Key')
        : '已保存配置，当前解析路线仍为后端模型');
    });
    if (clearBtn) clearBtn.addEventListener('click', () => {
      localStorage.removeItem('evolink_key');
      keyEl.value = '';
      if (directEl) {
        directEl.checked = false;
        localStorage.setItem(EVOLINK_DIRECT_MODE_KEY, '0');
      }
      refresh();
      setStatus('已清除 EvoLink Key，并切回后端模型');
    });
  }

  api.getItems().then((items) => {
    (items || []).forEach(item => resources.set(item.id, item));
    render();
  });
  restoreDownloadDir();
  setAnalysisDir(analysisDir);
  setupBackButton();
  setupEvolinkConfig();
  initAnalysisEnabledMode();
  initAutoAnalyzeMode();
  updateAnalysisUi(false);
  updateRetryUi();
  renderSkipNotices();
})();
</script>
</body>
</html>
