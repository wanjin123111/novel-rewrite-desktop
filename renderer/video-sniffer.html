<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>改文 · 视频抓取</title>
<style>
  /* 样式保持不变（与上一版完全相同，为节省篇幅省略） */
  :root {
    --paper: #f4efe4;
    --paper-deep: #ebe2d1;
    --paper-soft: #fbf7eb;
    --ink: #211b16;
    --ink-soft: #5e5146;
    --ink-faint: #9d8f82;
    --rule: #d8cbb6;
    --vermillion: #a93434;
    --vermillion-d: #8f2929;
    --ok: #168b52;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  button, input { font: inherit; }
  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-width: 980px;
  }
  .topbar {
    display: grid;
    grid-template-columns: auto auto 1fr auto auto auto auto;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule);
    background: rgba(244, 239, 228, .96);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    white-space: nowrap;
  }
  .brand-mark {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    background: var(--vermillion);
    color: #fff8ec;
    font-weight: 800;
  }
  .address {
    width: 100%;
    height: 36px;
    border: 1px solid var(--rule);
    background: var(--paper-soft);
    color: var(--ink);
    padding: 0 12px;
    outline: none;
  }
  .address:focus { border-color: var(--vermillion); }
  .btn {
    height: 36px;
    min-width: 42px;
    border: 1px solid var(--rule);
    background: var(--paper-soft);
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0 12px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--paper-deep); color: var(--ink); }
  .btn.primary {
    min-width: 72px;
    background: var(--vermillion);
    color: #fff8ec;
    border-color: var(--vermillion);
    font-weight: 700;
  }
  .btn.primary:hover { background: var(--vermillion-d); }
  .btn:disabled { opacity: .45; cursor: default; }
  .main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(520px, 1fr) 420px;
    border-bottom: 1px solid var(--rule);
  }
  .browser-shell {
    min-width: 0;
    min-height: 0;
    border-right: 1px solid var(--rule);
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .browser-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    background: #f0e8da;
    min-height: 41px;
  }
  .page-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink-soft);
  }
  .loading-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    flex: 0 0 auto;
  }
  .loading .loading-dot { background: var(--ok); }
  .browser-slot {
    min-height: 0;
    position: relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,0)),
      var(--paper-soft);
  }
  .browser-placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .capture {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #f8f2e7;
  }
  .capture-head {
    display: grid;
    grid-template-rows: auto auto;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid var(--rule);
  }
  .capture-meta {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .capture-title {
    font-weight: 700;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .count {
    min-width: 0;
    margin-left: auto;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: var(--ink-faint);
    font-size: 12px;
    text-align: right;
    white-space: normal;
  }
  /* —— 主操作：四个动词按钮，两行两列 —— */
  .primary-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .primary-actions .btn { width: 100%; min-width: 0; padding: 0 8px; }

  /* —— 常驻次要操作：导入 / 重试 / 清空（不收进抽屉，方便随手点）—— */
  .secondary-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .secondary-actions .btn { width: 100%; min-width: 0; padding: 0 8px; }

  .auto-mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 34px;
    margin-top: 8px;
    padding: 0 8px;
    border: 1px solid var(--line);
    color: var(--ink);
    background: rgba(255, 255, 255, .24);
    font-size: 14px;
  }
  .auto-mode-row input {
    width: 16px;
    height: 16px;
    accent-color: var(--red);
  }
  .auto-mode-note {
    min-width: 0;
    color: var(--ink-faint);
    font-size: 12px;
    text-align: right;
  }
  .skip-notice-stack {
    position: fixed;
    right: 16px;
    bottom: 42px;
    z-index: 50;
    display: grid;
    gap: 10px;
    width: min(420px, calc(100vw - 32px));
    pointer-events: none;
  }
  .skip-notice {
    pointer-events: auto;
    border: 1px solid var(--vermillion);
    background: #fff7e8;
    box-shadow: 0 10px 30px rgba(33, 27, 22, .18);
    padding: 12px;
    color: var(--ink);
  }
  .skip-notice-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .skip-notice-close {
    width: 28px;
    height: 28px;
    border: 1px solid var(--rule);
    background: var(--paper-soft);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .skip-notice-body {
    color: var(--ink-soft);
    font-size: 13px;
    word-break: break-all;
  }

  /* —— 保存目录行 —— */
  .dir-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px;
    padding: 10px 12px;
  }
  .dir-row .btn { min-width: 0; padding: 0 12px; }
  .analysis-dir-row { grid-template-columns: minmax(0, 1fr) auto auto; padding-top: 0; }

  /* —— 导出解析合集行 —— */
  .export-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    gap: 6px;
    padding: 0 12px 10px;
  }
  .export-row .btn { min-width: 0; padding: 0 14px; white-space: nowrap; }
  .export-row select.download-path {
    height: 32px;
    cursor: pointer;
    appearance: auto;
  }

  /* —— 折叠抽屉（与下方“直连设置”同款卡片）—— */
  .drawer {
    margin: 0 12px 8px;
    border: 1px solid #e3dbca;
    border-radius: 8px;
    background: #fbf8f0;
  }
  .drawer > summary {
    cursor: pointer;
    padding: 9px 12px;
    font-size: 13px;
    color: var(--ink-soft);
    user-select: none;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .drawer > summary::-webkit-details-marker { display: none; }
  .drawer > summary::before {
    content: '▸';
    font-size: 11px;
    color: var(--ink-faint);
    transition: transform .15s ease;
  }
  .drawer[open] > summary::before { transform: rotate(90deg); }
  .drawer[open] > summary { border-bottom: 1px solid #ece3cf; }
  .drawer-body {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-row .btn { flex: 1 1 auto; min-width: 72px; }
  .input-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px;
  }
  .input-row .btn { min-width: 0; padding: 0 12px; white-space: nowrap; }

  .download-path {
    min-width: 0;
    height: 32px;
    border: 1px solid var(--rule);
    background: var(--paper-soft);
    color: var(--ink-soft);
    padding: 0 9px;
    outline: none;
  }
  .download-path:focus { border-color: var(--vermillion); }

  /* —— 运行日志（抓取/下载 + 解析，收进一个抽屉）—— */
  .logs { gap: 12px; }
  .log-block { display: flex; flex-direction: column; gap: 5px; }
  .log-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .task-log, .analysis-log {
    max-height: 110px;
    overflow: auto;
    padding: 7px 9px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: rgba(255, 255, 255, .45);
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
  .task-log { color: var(--ink-faint); }
  .analysis-log { color: var(--ink-soft); }
  .analysis-hint {
    color: var(--ink-faint);
    font-size: 12px;
  }
  .filters {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
  }
  .filter {
    border: 1px solid var(--rule);
    background: var(--paper-soft);
    color: var(--ink-soft);
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter.active {
    background: var(--ink-soft);
    color: #fff8ec;
    border-color: var(--ink-soft);
  }
  .list {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 8px 10px 14px;
  }
  .empty {
    margin: 28px 10px;
    color: var(--ink-faint);
    text-align: center;
  }
  .item {
    border-bottom: 1px solid var(--rule);
    padding: 10px 2px 12px;
  }
  .episode {
    background: rgba(255, 255, 255, .22);
    border: 1px solid var(--rule);
    margin: 0 0 10px;
    padding: 10px 10px 12px;
  }
  .episode .badge {
    min-width: 58px;
    background: var(--vermillion);
    color: #fff8ec;
  }
  .episode .name {
    font-size: 15px;
  }
  .episode-note {
    margin-top: 6px;
    color: var(--ink-faint);
    font-size: 12px;
  }
  .item:last-child { border-bottom: none; }
  .item-top {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .badge {
    min-width: 44px;
    text-align: center;
    padding: 2px 6px;
    background: var(--paper-deep);
    color: var(--vermillion);
    font: 700 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    text-transform: uppercase;
  }
  .name {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }
  .meta {
    margin-top: 4px;
    color: var(--ink-faint);
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
  }
  .url {
    margin-top: 5px;
    color: var(--ink-soft);
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .action {
    border: 1px solid var(--rule);
    background: var(--paper-soft);
    color: var(--ink-soft);
    padding: 4px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .action:hover { background: var(--paper-deep); color: var(--ink); }
  .status {
    height: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    color: var(--ink-faint);
    font-size: 12px;
    background: #e8dfcf;
  }
  .status-ok { color: var(--ok); }
  .status-error { color: var(--vermillion); }
</style>
<style>
  .evolink-config { margin: 0 12px 8px; border: 1px solid #e3dbca; border-radius: 8px; background: #fbf8f0; }
  .evolink-config > summary { cursor: pointer; padding: 8px 12px; font-size: 13px; color: #7a6f57; user-select: none; list-style: none; }
  .evolink-config > summary::-webkit-details-marker { display: none; }
  .evolink-config > summary::before { content: '⚙ '; }
  .evolink-config[open] > summary { border-bottom: 1px solid #ece3cf; }
  .evolink-fields { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .evolink-fields textarea { width: 100%; box-sizing: border-box; resize: vertical; min-height: 70px; padding: 8px 10px; border: 1px solid #d9cfb8; border-radius: 6px; font: inherit; background: #fff; }
  .evolink-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .evolink-status { font-size: 12px; color: #8a7f66; }
  .evolink-status.ok { color: #2e7d32; }
  .evolink-route { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #e8deca; border-radius: 6px; background: #fffaf0; font-size: 13px; color: #6f6049; }
  .evolink-route input { width: 16px; height: 16px; accent-color: var(--vermillion); }
  .evolink-route strong { color: var(--ink); }
  .evolink-route em { margin-left: auto; font-style: normal; color: #9a8d73; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <form class="topbar" id="navForm">
    <button class="btn" id="backToAppBtn" type="button" title="返回改文主界面">← 返回</button>
    <div class="brand"><span class="brand-mark">抓</span><span>视频抓取</span></div>
    <input class="address" id="addressInput" autocomplete="off" spellcheck="false" placeholder="输入网址" />
    <button class="btn" id="backBtn" type="button" title="后退">←</button>
    <button class="btn" id="forwardBtn" type="button" title="前进">→</button>
    <button class="btn" id="reloadBtn" type="button" title="刷新">↻</button>
    <button class="btn primary" type="submit">访问</button>
  </form>

  <main class="main">
    <section class="browser-shell" id="browserShell">
      <div class="browser-head" id="browserHead">
        <span class="loading-dot"></span>
        <span class="page-title" id="pageTitle">about:blank</span>
      </div>
      <div class="browser-slot" id="browserSlot">
        <div class="browser-placeholder">浏览器区域</div>
      </div>
    </section>

    <aside class="capture">
      <div class="capture-head">
        <div class="capture-meta">
          <div class="capture-title">整集资源</div>
          <div class="count" id="resourceCount">0 条</div>
        </div>
        <div class="primary-actions">
          <button class="btn primary" id="scanAllBtn" type="button">获取全集</button>
          <button class="btn primary" id="downloadAllBtn" type="button">下载全集</button>
          <button class="btn primary" id="analyzeVideosBtn" type="button">解析视频</button>
          <button class="btn" id="stopAnalysisBtn" type="button" disabled>停止解析</button>
        </div>
        <div class="secondary-actions">
          <button class="btn" id="importLinksBtn" type="button">导入文件</button>
          <button class="btn" id="retryFailedBtn" type="button" disabled>重试失败</button>
          <button class="btn" id="clearBtn" type="button">清空</button>
        </div>
        <label class="auto-mode-row" title="关闭后，自动解析和手动解析都会被拦截，不会调用任何视频解析模型">
          <span><input id="analysisEnabledInput" type="checkbox" checked /> 启用解析</span>
          <span class="auto-mode-note">关闭后不调用视频解析模型</span>
        </label>
        <label class="auto-mode-row" title="开启后，每部剧下载完成会自动在后台并发解析，不等待解析完成就继续下一部">
          <span><input id="autoAnalyzeModeInput" type="checkbox" checked /> 自动模式</span>
          <span class="auto-mode-note">下载完本剧后自动解析</span>
        </label>
      </div>

  <div class="dir-row">
    <input class="download-path" id="downloadDirInput" placeholder="保存目录（按剧名自动建子文件夹）" />
    <button class="btn" id="chooseDirBtn" type="button">选目录</button>
  </div>

  <div class="dir-row analysis-dir-row">
    <input class="download-path" id="analysisDirInput" placeholder="解析目录（选择已有视频文件夹，可手动修改）" />
    <button class="btn" id="chooseAnalysisDirBtn" type="button">解析目录</button>
    <button class="btn" id="chooseAnalysisFilesBtn" type="button">选视频</button>
  </div>

  <div class="export-row">
        <select class="download-path" id="exportFormatSelect" title="选择导出格式">
          <option value="docx">Word（.docx）</option>
          <option value="xlsx">Excel（.xlsx）</option>
          <option value="txt">纯文本（.txt）</option>
          <option value="md">Markdown（.md）</option>
          <option value="csv">CSV（.csv）</option>
          <option value="html">网页（.html）</option>
          <option value="json">JSON（.json）</option>
        </select>
        <button class="btn" id="retryMissingAnalysisBtn" type="button">补漏解析</button>
        <button class="btn primary" id="exportAnalysesBtn" type="button">导出解析</button>
      </div>

      <details class="drawer" id="toolsDrawer">
        <summary>高级 · 自定义请求头 / 手动 m3u8 下载</summary>
        <div class="drawer-body">
          <div class="input-row">
            <input class="download-path" id="customHeadersInput" placeholder="可选：粘贴 Cookie 或 Authorization（例如：Cookie: session=xxx）" />
            <button class="btn" id="setHeadersBtn" type="button">应用请求头</button>
          </div>
          <div class="input-row">
            <input class="download-path" id="manualM3u8Input" placeholder="手动粘贴付费集的 m3u8 链接（可从浏览器开发者工具获取）" />
            <button class="btn primary" id="manualDownloadBtn" type="button">下载该集</button>
          </div>
        </div>
      </details>

      <details class="evolink-config" id="evolinkConfig">
        <summary>解析路线设置（直连 EvoLink / 后端模型）</summary>
        <div class="evolink-fields">
          <label class="evolink-route" title="打开后使用本机填写的 EvoLink Key 直连解析；关闭后统一走后端模型">
            <input id="evolinkDirectModeInput" type="checkbox" />
            <strong>直连模式</strong>
            <em>打开=直连，关闭=后端</em>
          </label>
          <input class="download-path" id="evolinkKeyInput" type="text" autocomplete="off" spellcheck="false" placeholder="EvoLink API Key（sk-...）" />
          <textarea id="evolinkPromptInput" placeholder="视频解析系统提示词（直连时由本地发出；留空则不带提示词）"></textarea>
          <input class="download-path" id="evolinkModelInput" type="text" autocomplete="off" spellcheck="false" placeholder="模型名（留空默认 gemini-3-pro-preview）" />
          <div class="evolink-actions">
            <button class="btn primary" id="evolinkSaveBtn" type="button">保存</button>
            <button class="btn" id="evolinkClearBtn" type="button">清除（切回后端）</button>
            <span class="evolink-status" id="evolinkStatus"></span>
          </div>
        </div>
      </details>

      <details class="drawer" id="logDrawer" open>
        <summary>运行日志</summary>
        <div class="drawer-body logs">
          <div class="log-block">
            <div class="log-label">抓取 / 下载</div>
            <div class="task-log" id="taskLog">等待任务</div>
          </div>
          <div class="log-block">
            <div class="log-label">视频解析</div>
            <div class="analysis-hint" id="analysisHint">解析会读取当前本剧文件夹里的 MP4</div>
            <div class="analysis-log" id="analysisLog">单集解析会写入内部缓存，最终导出为整部剧合集文档。</div>
          </div>
        </div>
      </details>

      <div class="filters">
        <button class="filter active" type="button" data-filter="episode">整集</button>
        <button class="filter" type="button" data-filter="all">全部</button>
        <button class="filter" type="button" data-filter="m3u8">m3u8</button>
        <button class="filter" type="button" data-filter="mpd">mpd</button>
        <button class="filter" type="button" data-filter="video">视频</button>
        <button class="filter" type="button" data-filter="audio">音频</button>
      </div>
      <div class="list" id="resourceList">
        <div class="empty">打开网页后，会自动把视频整理成整集显示</div>
      </div>
    </aside>
  </main>

  <footer class="status" id="statusBar">
    <span class="status-ok">●</span>
    <span id="statusText">就绪</span>
  </footer>
  <div class="skip-notice-stack" id="skipNoticeStack"></div>
</div>

<script>
(() => {
  console.log('%c[视频抓取] 布局 v4 已加载 · 顶部三按钮 + 导出解析合集(txt/md/html/csv/json/xlsx/docx)', 'color:#a93434;font-weight:700');
  const api = window.videoSniffer;
  const $ = (id) => document.getElementById(id);

  function renderSkipNotices() {
    const stack = $('skipNoticeStack');
    if (!stack) return;
    stack.innerHTML = '';
    skipNotices.slice(-5).reverse().forEach((notice) => {
      const node = document.createElement('div');
      node.className = 'skip-notice';
      node.dataset.id = notice.id;

      const head = document.createElement('div');
      head.className = 'skip-notice-head';
      const title = document.createElement('div');
      title.textContent = '已跳过无视频链接';
      const close = document.createElement('button');
      close.className = 'skip-notice-close';
      close.type = 'button';
      close.textContent = '×';
      close.title = '关闭这条提醒';
      head.append(title, close);

      const body = document.createElement('div');
      body.className = 'skip-notice-body';
      const name = notice.title || '未命名剧';
      const reason = notice.reason || NO_VIDEO_SKIP_REASON;
      body.textContent = `${name}：${reason}。链接：${notice.url || ''}`;

      close.addEventListener('click', () => {
        skipNotices = skipNotices.filter(item => item.id !== notice.id);
        saveSkipNotices();
        renderSkipNotices();
      });

      node.append(head, body);
      stack.append(node);
    });
  }

  function pushSkipNotice(item, reason) {
    if (!item || !item.url) return;
    const url = item.url;
    const existing = skipNotices.find(notice => notice.url === url);
    const data = {
      id: existing ? existing.id : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
      url,
      title: item.title || titleFromUrl(url) || '未命名剧',
      reason: reason || NO_VIDEO_SKIP_REASON,
      createdAt: existing ? existing.createdAt : Date.now(),
      updatedAt: Date.now(),
    };
    if (existing) {
      Object.assign(existing, data);
    } else {
      skipNotices.push(data);
    }
    saveSkipNotices();
    renderSkipNotices();
  }

  function analysisRetryDelay(attempt) {
    return VIDEO_ANALYZE_RETRY_DELAY_MS * Math.max(1, Number(attempt) || 1);
  }

  function isAnalysisAbortMessage(message) {
    return /(停止|取消|abort|aborted|AbortError)/i.test(String(message || ''));
  }

  function waitAnalysisRetry(ms) {
    return new Promise(resolve => {
      if (analysisAbort) { resolve(); return; }
      setTimeout(resolve, Math.max(0, Number(ms) || 0));

  }

  async function analyzeVideoFileWithRetry(file, index, total, config, options) {
    const opts = options || {};
    const label = episodeLabelOfVideo(file, index);
    const routeText = config.evolinkKey ? '直连解析' : '后端解析视频';
    const prefix = opts.prefix ? `${opts.prefix} · ` : '';
    let lastError = '';
    const maxAttempts = VIDEO_ANALYZE_MAX_RETRIES + 1;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      if (analysisAbort) return { ok: false, aborted: true, error: '已停止解析' };
      const retryNo = attempt - 1;
      const retryText = retryNo > 0 ? ` · 第 ${retryNo}/${VIDEO_ANALYZE_MAX_RETRIES} 次重试` : '';
      logAnalysis(`${prefix}${label} · ${index + 1}/${total} · ${routeText}${retryText}：${file.name}`);
      try {
        const result = await api.analyzeVideoFile({
          server: API_SERVER,
          token: config.token,
          modelId: VIDEO_ANALYSIS_MODEL_ID,
          filePath: file.path,
          episodeNo: file.episodeNo,
          content: `${label} 视频解析。请直接按系统提示词解析该视频。文件名：${file.name}`,
          evolinkKey: config.evolinkKey,
          evolinkPrompt: config.evolinkPrompt,
          evolinkModel: config.evolinkModel,
        });
        if (analysisAbort) return { ok: false, aborted: true, error: '已停止解析' };
        if (result && result.ok) {
          logAnalysis(`${prefix}${label} 解析完成，已写入内部缓存`);
          return { ok: true, result };
        }
        lastError = result && result.error ? result.error : '未知错误';
      } catch (err) {
        lastError = err && err.message ? err.message : String(err);
      }
      if (isAnalysisAbortMessage(lastError) || analysisAbort) {
        return { ok: false, aborted: true, error: lastError || '已停止解析' };
      }
      if (attempt < maxAttempts) {
        const waitMs = analysisRetryDelay(attempt);
        logAnalysis(`${prefix}${label} 解析失败：${lastError}；${Math.round(waitMs / 1000)} 秒后自动重试`);
        await waitAnalysisRetry(waitMs);
      }
    }
    logAnalysis(`${prefix}${label} 解析最终失败：${lastError || '未知错误'}（已自动重试 ${VIDEO_ANALYZE_MAX_RETRIES} 次）`);
    return { ok: false, error: lastError || '未知错误' };
  }

  async function runWithConcurrency(items, limit, worker) {
    let cursor = 0;
    const count = Math.max(1, Math.min(Number(limit) || 1, items.length));
    const workers = Array.from({ length: count }, async () => {
      while (cursor < items.length) {
        const index = cursor++;
        await worker(items[index], index);
      }
    });
    await Promise.all(workers);
  }

  function startAutoAnalyzeForDir(rootDir, label) {
    if (!isAnalysisEnabled()) {
      logAnalysis(`自动模式：${label || rootDir || '本剧'} 下载完成，但视频解析总开关已关闭，已跳过解析`);
      return;
    }
    if (!isAutoAnalyzeEnabled() || !rootDir) return;
    if (!api || !api.listVideoFiles || !api.analyzeVideoFile) {
      logAnalysis('自动模式：当前安装包缺少视频解析接口，已跳过后台解析');
      return;
    }
    if (autoAnalysisJobs.has(rootDir)) {
      logAnalysis(`自动模式：${label || rootDir} 已在后台解析队列中，跳过重复任务`);
      return;
    }

    const runJob = async () => {
      const taskName = label || rootDir;
      let ok = 0;
      let failed = 0;
      try {
        const config = await readVideoAnalysisConfig();
        if (config.evolinkDirectEnabled && !config.evolinkKey) {
          logAnalysis(`自动模式：${taskName} 已开启直连模式，但没有填写 EvoLink Key，跳过解析`);
          return;
        }
        if (!config.evolinkDirectEnabled && !config.token) {
          logAnalysis(`自动模式：${taskName} 当前选择后端模型，但缺少登录 token，跳过解析`);
          return;
        }

        logAnalysis(`自动模式：${taskName} 下载完成，后台解析开始 · ${analysisRouteText(config)} · 并发 ${AUTO_ANALYZE_CONCURRENCY}`);
        const listed = await api.listVideoFiles(rootDir);
        if (!listed || !listed.ok) {
          throw new Error(listed && listed.error ? listed.error : '读取视频目录失败');
        }
        const files = Array.isArray(listed.files) ? listed.files : [];
        if (!files.length) {
          logAnalysis(`自动模式：${taskName} 目录里没有找到可解析视频，已跳过`);
          return;
        }

        await runWithConcurrency(files, AUTO_ANALYZE_CONCURRENCY, async (file, index) => {
          const result = await analyzeVideoFileWithRetry(file, index, files.length, config, {
            prefix: `自动模式：${taskName}`,
          });
          if (result.ok) ok++;
          else if (!result.aborted) failed++;
        });

        logAnalysis(`自动模式：${taskName} 后台解析完成 · 成功 ${ok} · 失败 ${failed}`);
        if (ok > 0 && api.exportAnalyses) {
          const format = selectedExportFormat();
          logAnalysis(`自动模式：${taskName} 正在按集数顺序导出整部剧合集（${format}）`);
          const exported = await api.exportAnalyses({
            rootDir,
            format,
            title: taskName,
            silent: true,
          });
          if (exported && exported.ok) {
            logAnalysis(`自动模式：${taskName} 已导出 ${exported.count} 集合集：${exported.outputPath}（缓存目录里的 txt 是内部中间文件）`);
          } else {
            logAnalysis(`自动模式：${taskName} 合集导出失败：${exported && exported.error ? exported.error : '未知错误'}`);
          }
        }
      } catch (err) {
        logAnalysis(`自动模式：${taskName} 后台解析出错：${err && err.message ? err.message : err}`);
      }
    };

    logAnalysis(`自动模式：${label || rootDir} 已加入后台解析队列`);
    const job = autoAnalysisQueue.then(runJob, runJob).finally(() => {
      autoAnalysisJobs.delete(rootDir);
    });
    autoAnalysisQueue = job.catch(() => {});

    autoAnalysisJobs.set(rootDir, job);
  }

  async function analyzeSavedVideos(options) {
    const opts = options || {};
    if (analysisRunning) return;
    if (!isAnalysisEnabled()) {
      setStatus('视频解析已关闭，不会调用解析模型', 'error');
      logAnalysis('视频解析总开关已关闭：本次手动解析/补漏解析已拦截，不会调用模型。', 'replace');
      return;
    }
    if (!api || !api.listVideoFiles || !api.analyzeVideoFile) {
      setStatus('当前安装包缺少视频解析接口，请重新打包安装', 'error');
      return;
    }
    const config = await readVideoAnalysisConfig();
    if (config.evolinkDirectEnabled && !config.evolinkKey) {
      setStatus('已开启直连模式，请先填写并保存 EvoLink Key', 'error');
      logAnalysis('已开启直连模式，但没有填写 EvoLink Key；请在「解析路线设置」里填 Key，或关闭直连模式走后端。', 'replace');
      return;
    }
    if (!config.evolinkDirectEnabled && !config.token) {
      setStatus('当前选择后端模型，请先在改文主界面登录', 'error');
      logAnalysis('当前解析路线是【后端模型】，但未找到登录 token；请先登录主界面，或打开直连模式并填写 EvoLink Key。', 'replace');
      return;
    }
    if (config.evolinkKey) {
      logAnalysis('✔ 已开启直连模式，本次【直连 Gemini】（绕过后端）· 模型 ' + (config.evolinkModel || 'gemini-3-pro-preview'));
    } else {
      logAnalysis('本次走【后端模型 ' + VIDEO_ANALYSIS_MODEL_ID + '】解析视频（后端已支持直接读取视频文件）');
    }
    const rootDir = await analysisRootDir();
    if (!rootDir) return;

    analysisAbort = false;
    updateAnalysisUi(true);
    logAnalysis(`${opts.missingOnly ? '开始扫描缺失解析的视频' : '开始扫描视频目录'}：${rootDir}`, 'replace');

    try {
      let files = analysisSelectedFiles.length ? analysisSelectedFiles.slice() : [];
      if (!files.length) {
        const listed = await api.listVideoFiles(rootDir);
        if (!listed || !listed.ok) {
          throw new Error(listed && listed.error ? listed.error : '读取视频目录失败');
        }
        files = Array.isArray(listed.files) ? listed.files : [];
      }
      const totalFiles = files.length;
      if (opts.missingOnly) {
        files = files.filter(file => !file.analysisDone);
      }
      if (!files.length) {
        if (opts.missingOnly && totalFiles > 0) {
          logAnalysis(`没有发现缺失解析的集数：${totalFiles} 个视频都已有解析缓存，可以直接导出合集`);
          setStatus('没有缺失解析，可直接导出合集');
        } else {

  function normalizeUrl(raw) {
    let text = String(raw || '').trim();
    if (!text) return '';
    const found = text.match(/https?:\/\/[^\s"'<>]+/i);
    if (found) text = found[0].replace(/[，。；;、]+$/g, '');
    return /^https?:\/\//i.test(text) ? text : 'https://' + text;
  }

  function sleep(ms) {
    return new Promise(resolve => {
      if (scanAbort) { resolve(); return; }
      const timer = setTimeout(done, ms);
      function done() {
        clearTimeout(timer);
        stopWaiters = stopWaiters.filter(fn => fn !== done);
        resolve();
      }
      stopWaiters.push(done);
    });
  }

  function withTimeout(promise, ms, fallback) {
    return new Promise(resolve => {
      let done = false;
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        resolve(fallback);
      }, ms);
      Promise.resolve(promise).then(
        value => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(value);
        },
        () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(fallback);
        }
      );
    });
  }

  async function askInput(message, defaultValue) {
    inputModalOpen = true;
    document.querySelectorAll('.input-modal-overlay').forEach(node => node.remove());
    await parkBrowserViewForModal();
    const result = await new Promise((resolve) => {
      let settled = false;
      const overlay = document.createElement('div');
      overlay.className = 'input-modal-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(33,27,22,.55);display:grid;place-items:center;z-index:2147483647;pointer-events:auto;';
      const box = document.createElement('div');
      box.style.cssText = 'background:var(--paper-soft);border:1px solid var(--rule);border-radius:10px;min-width:360px;max-width:90vw;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.35);pointer-events:auto;';
      const msg = document.createElement('div');
      msg.style.cssText = 'white-space:pre-wrap;color:var(--ink);margin-bottom:14px;line-height:1.6;font-size:14px;';
      msg.textContent = message;
      const input = document.createElement('input');
      input.value = defaultValue == null ? '' : String(defaultValue);
      input.style.cssText = 'width:100%;height:38px;border:1px solid var(--rule);border-radius:7px;background:#fff;color:var(--ink);padding:0 12px;outline:none;margin-bottom:16px;font-size:15px;';
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;';
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = '取消';
      cancelBtn.className = 'btn';
      const okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.textContent = '确定';
      okBtn.className = 'btn primary';
      row.append(cancelBtn, okBtn);
      box.append(msg, input, row);
      overlay.append(box);
      document.body.append(overlay);
      const keepHidden = setInterval(() => { if (inputModalOpen) parkBrowserViewForModal(); }, 500);
      setTimeout(() => {
        try {
          input.focus();
          input.select();
        } catch (e) {}
      }, 0);
      const done = (val) => {
        if (settled) return;
        settled = true;
        clearInterval(keepHidden);
        overlay.remove();
        inputModalOpen = false;
        resolve(val);
      };
      const stop = (e) => {
        if (!e) return;
        e.preventDefault();
        e.stopPropagation();
      };
      cancelBtn.addEventListener('pointerdown', (e) => { stop(e); done(null); });
      cancelBtn.addEventListener('click', (e) => { stop(e); done(null); });
      okBtn.addEventListener('pointerdown', (e) => { stop(e); done(input.value); });
      okBtn.addEventListener('click', (e) => { stop(e); done(input.value); });
      box.addEventListener('pointerdown', (e) => e.stopPropagation());
      box.addEventListener('click', (e) => e.stopPropagation());
      input.onkeydown = (e) => { if (e.key === 'Enter') done(input.value); else if (e.key === 'Escape') done(null); };
      overlay.addEventListener('pointerdown', (e) => { if (e.target === overlay) done(null); });
    });
    inputModalOpen = false;
    try { await syncBounds(); } catch (e) {}
    return result;
  }

  function linkFolderKey(rawUrl) {
    const target = normalizeUrl(rawUrl);
    if (!target) return '';
    try {
      const u = new URL(target);
      u.protocol = u.protocol.toLowerCase();
      u.hostname = u.hostname.toLowerCase().replace(/^www\./, '');
      for (const key of Array.from(u.searchParams.keys())) {
        const lower = String(key || '').toLowerCase();
        const value = u.searchParams.get(key) || '';
        if (EPISODE_QUERY_KEYS.includes(lower) && /^\d{1,4}$/.test(value)) u.searchParams.delete(key);
        if (['from', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].includes(lower)) u.searchParams.delete(key);
      }
      u.pathname = u.pathname
        .replace(/(\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-)\d{1,4}(\.html)$/i, '$1EP$2')
        .replace(/(^|[\/_-])(?:episode|ep)([\/_-]?)\d{1,4}(?=$|[\/_-])/i, '$1ep$2EP')
        .replace(/-ep-\d{1,4}(?=$|[\/?#_-])/i, '-ep-EP');
      if (!/^#\/player\?/i.test(u.hash || '')) u.hash = '';
      return u.toString().replace(/[?#]$/, '');
    } catch {
      return target
        .replace(/([?&])(?:episode|ep|eps|e|chapter|chapter_id)=\d{1,4}\b/ig, '$1')
        .replace(/(\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-)\d{1,4}(\.html)/i, '$1EP$2')
        .replace(/(^|[\/_-])(?:episode|ep)([\/_-]?)\d{1,4}(?=$|[\/?#_-])/i, '$1ep$2EP')
        .replace(/-ep-\d{1,4}(?=$|[\/?#_-])/i, '-ep-EP');
    }
  }

  function linkRunDownloadDir(rootDir, rawUrl, title) {
    const key = linkFolderKey(rawUrl) || normalizeUrl(rawUrl) || String(rawUrl || '');
    if (key && activeLinkFolderMap.has(key)) return activeLinkFolderMap.get(key);
    const baseTitle = cleanSeriesTitle(title) || cleanSeriesTitle(titleFromUrl(rawUrl)) || '未命名剧';
    let linkId = '';
    try {
      const u = new URL(rawUrl);
      const pathId = u.pathname.replace(/[^a-z0-9]/gi, '').slice(-12);
      const host = u.hostname.replace(/^www\./, '').split('.')[0];
      linkId = host + '-' + pathId;
    } catch {
      linkId = 'link-' + Date.now();
    }
    const timeStamp = activeBatchFolderStamp || stampForFolder();
    const baseFolderName = cleanOutputName(
      [baseTitle, linkId, timeStamp].filter(Boolean).join('-'),
      '视频任务-' + timeStamp
    ).slice(0, 120);
    let folderName = baseFolderName;
    let dir = joinPath(rootDir, folderName);
    let suffix = 2;
    while (activeLinkFolderPaths.has(dir) && (!key || activeLinkFolderMap.get(key) !== dir)) {
      folderName = cleanOutputName(`${baseFolderName}-${suffix}`, baseFolderName).slice(0, 120);
      dir = joinPath(rootDir, folderName);
      suffix++;
    }
    if (key) activeLinkFolderMap.set(key, dir);
    activeLinkFolderPaths.add(dir);
    return dir;
  }

  function titleFromUrl(rawUrl) {
    try {
      const u = new URL(normalizeUrl(rawUrl));
      const parts = u.pathname.split('/').map(x => {
        try { return decodeURIComponent(x); } catch { return x; }
      }).filter(Boolean);
      const useful = parts
        .filter(x => !/^\d+$/.test(x))
        .filter(x => !/^(video|shorts?|watch|episode|episodes?)$/i.test(x))
        .sort((a, b) => b.length - a.length)[0];
      return (useful || u.hostname.replace(/^www\./, '')).replace(/[-_]+/g, ' ');
    } catch {
      return '';
    }
  }

  function cleanSeriesTitle(text) {
    let name = String(text || '').replace(/\s+/g, ' ').trim();
    if (!name) return '';
    name = name.split(/\s*[|｜]\s*/)[0].trim();
    name = name
      .replace(/\s*[-–—]\s*Episode\s*\d{1,4}\b.*$/i, '')
      .replace(/\s*[-–—]?\s*\bEP\s*\d{1,4}\b.*$/i, '')
      .replace(/\s*[-–—]\s*第\s*\d{1,4}\s*集.*$/i, '')
      .replace(/\bEpisode\s*\d{1,4}\b.*$/i, '')
      .replace(/\bEP\s*\d{1,4}\b.*$/i, '')
      .replace(/第\s*\d{1,4}\s*集.*$/i, '')
      .replace(/\s+\d{8,}\b.*$/i, '')
      .replace(/\s*[-–—]\s*full movie\b.*$/i, '')
      .replace(/\s*[-–—]\s*watch\b.*$/i, '')
      .replace(/\s*[-–—]\s*online\b.*$/i, '')
      .trim();
    return name ? cleanOutputName(name, '') : '';
  }

  function currentSeriesFolderName() {
    const groups = currentEpisodeGroups();
    const firstMain = groups.map(g => g.main || (g.items && g.items[0])).find(Boolean) || null;
    const candidates = [
      activeSeriesTitle,
      lastState.title,
      firstMain && firstMain.pageTitle,
      $('addressInput').value,
      lastState.url,
      firstMain && firstMain.referer,
      firstMain && firstMain.url,
    ];
    const isUseful = (name) => name && !/^https?_?/i.test(name) && !/^(about_blank|about|blank|episode|video|watch)$/i.test(name);
    for (const candidate of candidates) {
      const fromTitle = cleanSeriesTitle(candidate);
      if (isUseful(fromTitle)) return fromTitle;
      const fromUrl = titleFromUrl(candidate);
      const cleanedUrlTitle = cleanSeriesTitle(fromUrl);
      if (isUseful(cleanedUrlTitle)) return cleanedUrlTitle;
    }
    return '未命名剧';
  }
