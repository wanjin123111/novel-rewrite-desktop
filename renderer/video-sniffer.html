  const EPISODE_QUERY_KEYS = ['episode', 'ep', 'eps', 'e', 'chapter', 'chapter_id'];

  function episodeQueryKey(urlObj) {
    for (const [key, value] of urlObj.searchParams.entries()) {
      if (EPISODE_QUERY_KEYS.includes(String(key || '').toLowerCase()) && value && /^\d{1,4}$/.test(value)) return key;
    }
    return '';
  }

  function isMalformedDramaShortsEpisodeUrl(rawUrl) {
    return false;
  }

  function isOpaqueHashPlayerUrl(rawUrl) {
    const target = normalizeUrl(rawUrl);
    if (!target) return false;
    try {
      const u = new URL(target);
      return /#\/player/i.test(u.hash) && /(?:[?&])k=/.test(u.hash);
    } catch {
      return /#\/player[^#]*[?&]k=/i.test(target);
    }
  }

  // 像 ReelShort 这类站点：URL 里的 episode-N 只是给人看的，真正定位某一集靠它后面那串"每集唯一"的
  // 不透明 id（例 /episodes/episode-1-the-luna-s-second-choice-6a0ac84fb7d7d2bfe20421a5-d4dz9noypp）。
  // 这种链接不能靠"把数字 +1"推算下一集——换出来的链接里 id 还是第 1 集的，结果整剧都抓成第 1 集。
  // 命中后改走"页面选集列表 / 下一集控件"，而不是 URL 改号。
  function hasPerEpisodeOpaqueId(rawUrl) {
    const target = normalizeUrl(rawUrl);
    if (!target) return false;
    let path = target;
    try { path = decodeURIComponent(new URL(target).pathname); } catch {}
    // 只看"包含 episode-<N> 的那个路径段"，避免误伤 /series/<id>/episode-1 这种 id 与集号分段的情况
    const epSeg = path.split('/').filter(Boolean)
      .find(s => /(?:^|[_-])(?:episode|ep)[_-]?\d{1,4}(?=$|[_-])/i.test(s));
    if (!epSeg) return false;
    // 1) 段里有 24 位及以上十六进制串（MongoDB ObjectId 之类）→ 每集唯一 id 的强信号
    if (/[0-9a-f]{24,}/i.test(epSeg)) return true;
    // 2) episode-<N> 之后还跟着随机不透明 token（字母+数字混合、>=10 位）
    const m = epSeg.match(/(?:^|[_-])(?:episode|ep)[_-]?\d{1,4}[_-].*?[_-]([a-z0-9]{10,})$/i);
    if (m && /[a-z]/i.test(m[1]) && /\d/.test(m[1])) return true;
    return false;
  }

  function vodplayEpisodeMatch(pathOrUrl) {
    const path = String(pathOrUrl || '').split(/[?#]/)[0];
    return path.match(/\/(?:vodplay|play)\/([^\/?#]+?-\d{1,4}-)(\d{1,4})(\.html)$/i);
  }

  function buildVodplayEpisodePath(path, episodeNo) {
    const next = String(episodeNo);
    return String(path || '').replace(/(\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-)\d{1,4}(\.html)$/i, '$1' + next + '$2');
  }

  function urlLooksEpisode(rawUrl) {
    const target = normalizeUrl(rawUrl);
    if (!target) return false;
    if (isMalformedDramaShortsEpisodeUrl(target)) return false;
    if (isOpaqueHashPlayerUrl(target)) return false;
    try {
      const u = new URL(target);
      if (episodeQueryKey(u)) return true;
      if (vodplayEpisodeMatch(u.pathname)) return true;
      if (hasPerEpisodeOpaqueId(target)) return false;
      return /(^|[\/_-])(?:episode|ep)([\/_-]?)(\d{1,4})(?=$|[\/?#_-])/i.test(u.pathname);
    } catch {
      if (hasPerEpisodeOpaqueId(target)) return false;
      return /[?&](?:episode|ep|eps|e|chapter|chapter_id)=\d{1,4}\b|\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-\d{1,4}\.html(?:[?#]|$)|(^|[\/_-])(?:episode|ep)([\/_-]?)(\d{1,4})(?=$|[\/?#_-])/i.test(target);
    }
  }

  function buildEpisodeUrl(baseUrl, episodeNo) {
    const target = normalizeUrl(baseUrl || lastState.url || $('addressInput').value);
    if (!target) return '';
    if (isMalformedDramaShortsEpisodeUrl(target)) return '';
    if (isOpaqueHashPlayerUrl(target)) return '';
    try {
      const u = new URL(target);
      const queryKey = episodeQueryKey(u);
      if (queryKey) {
        u.searchParams.set(queryKey, String(episodeNo));
        return u.toString();
      }
      const path = u.pathname;
      if (vodplayEpisodeMatch(path)) {
        u.pathname = buildVodplayEpisodePath(path, episodeNo);
        return u.toString();
      }
      if (hasPerEpisodeOpaqueId(target)) return '';
      if (/(^|[\/_-])(?:episode|ep)([\/_-]?)(\d{1,4})(?=$|[\/_-])/i.test(path)) {
        u.pathname = path.replace(/(^|[\/_-])(episode|ep)([\/_-]?)(\d{1,4})(?=$|[\/_-])/i, (_m, lead, word, sep) => {
          return lead + word + sep + String(episodeNo);
        });
        return u.toString();
      }
      u.searchParams.set('episode', String(episodeNo));
      return u.toString();
    } catch {
      if (/[?&](?:episode|ep|eps|e|chapter|chapter_id)=\d{1,4}\b/i.test(target)) {
        return target.replace(/([?&](?:episode|ep|eps|e|chapter|chapter_id)=)\d{1,4}\b/i, '$1' + episodeNo);
      }
      if (/\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-\d{1,4}\.html(?:[?#]|$)/i.test(target)) {
        return target.replace(/(\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-)\d{1,4}(\.html)/i, '$1' + episodeNo + '$2');
      }
      if (hasPerEpisodeOpaqueId(target)) return '';
      if (/(^|[\/_-])(?:episode|ep)([\/_-]?)(\d{1,4})(?=$|[/?#_-])/i.test(target)) {
        return target.replace(/(^|[\/_-])(episode|ep)([\/_-]?)(\d{1,4})(?=$|[/?#_-])/i, (_m, lead, word, sep) => {
          return lead + word + sep + String(episodeNo);
        });
      }
      return target + (target.includes('?') ? '&' : '?') + 'episode=' + episodeNo;
    }
  }

  function firstEpisodeUrlInfo(rawUrl) {
    const inputUrl = normalizeUrl(rawUrl);
    if (!inputUrl) return { inputUrl: '', firstUrl: '', inputEpisode: 0, changed: false };
    const inputEpisode = extractEpisodeNo(inputUrl);
    const firstUrl = urlLooksEpisode(inputUrl) ? buildEpisodeUrl(inputUrl, 1) : inputUrl;
    return {
      inputUrl,
      firstUrl: firstUrl || inputUrl,
      inputEpisode,
      changed: !!(firstUrl && normalizeUrl(firstUrl) !== inputUrl),
    };
  }

  function parseRange(text, currentEpisode) {
    const raw = String(text || '').trim();
    const m = raw.match(/^(\d+)\s*[-~到,，]\s*(\d+)$/);
    if (m) {
      const start = Number(m[1]);
      const end = Number(m[2]);
      if (start > 0 && end >= start) return { start, end };
    }
    const n = Number(raw);
    if (Number.isFinite(n) && n > 0) return { start: 1, end: n };
    const cur = Number(currentEpisode) || 1;
    return { start: 1, end: Math.max(cur, 20) };
  }

  function parseEpisodeInfo(text) {
    const raw = String(text || '').replace(/\s+/g, ' ');
    const patterns = [
      /集\s*(\d{1,4})\s*\/\s*(\d{1,4})/i,
      /第\s*(\d{1,4})\s*集\s*[\/／]\s*(?:共\s*)?(\d{1,4})\s*集?/i,
      /episode\s*(\d{1,4})\s*(?:\/|of)\s*(\d{1,4})/i,
      /\b(\d{1,4})\s*\/\s*(\d{1,4})\s*(?:episodes?|eps?|集)\b/i,
      /共\s*(\d{1,4})\s*集/i,
    ];
    for (const pattern of patterns) {
      const m = raw.match(pattern);
      if (!m) continue;
      if (m.length === 2) {
        const total = Number(m[1]);
        if (total > 0) return { current: 1, total };
      }
      const current = Number(m[1]);
      const total = Number(m[2]);
      if (current > 0 && total >= current) return { current, total };
    }
    return { current: 0, total: 0 };
  }

  async function inferEpisodeRange() {
    const fallbackCurrent = extractEpisodeNo(lastState.url) || extractEpisodeNo($('addressInput').value) || 1;
    let pageText = [lastState.title, lastState.url, $('addressInput').value].filter(Boolean).join(' ');
    try {
      if (api.pageInfo) {
        const info = await api.pageInfo();
        if (info && info.ok) {
          pageText = [info.title, info.url, info.text, pageText].filter(Boolean).join(' ');
        }
      }
    } catch {}
    const parsed = parseEpisodeInfo(pageText);
    if (parsed.total) {
      return {
        start: 1,
        end: parsed.total,
        current: parsed.current || fallbackCurrent,
        inferred: true,
      };
    }
    return {
      start: 1,
      end: Math.max(fallbackCurrent, 20),
      current: fallbackCurrent,
      inferred: false,
    };
  }

  function waitForPageIdle(timeoutMs) {
    return new Promise(resolve => {
      if (scanAbort) { resolve(); return; }
      const timer = setTimeout(done, timeoutMs);
      let finished = false;
      function done() {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        loadingWaiters = loadingWaiters.filter(fn => fn !== done);
        stopWaiters = stopWaiters.filter(fn => fn !== done);
        resolve();
      }
      loadingWaiters.push(done);
      stopWaiters.push(done);
    });
  }

  function formatSize(size) {
    const n = Number(size) || 0;
    if (!n) return '未知大小';
    if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  function typeOf(item) {
    const ext = (item.ext || '').toLowerCase();
    const mime = (item.mime || '').toLowerCase();
    if (ext === 'm3u8' || ext === 'm3u') return 'm3u8';
    if (ext === 'mpd') return 'mpd';
    if (mime.startsWith('audio/') || ['mp3', 'm4a', 'aac', 'ogg', 'wav', 'opus', 'weba'].includes(ext)) return 'audio';
    return 'video';
  }

  function passesFilter(item) {
    if (activeFilter === 'episode') return false;
    if (activeFilter === 'all') return true;
    return typeOf(item) === activeFilter;
  }

  function escapeAttr(text) {
    return String(text || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }

  function curlFor(item) {
    const parts = ['curl', '-L', JSON.stringify(item.url)];
    if (item.referer) parts.push('-H', JSON.stringify('Referer: ' + item.referer));
    if (item.userAgent) parts.push('-H', JSON.stringify('User-Agent: ' + item.userAgent));
    return parts.join(' ');
  }

  function isSegment(item) {
    const ext = (item.ext || '').toLowerCase();
    return ext === 'ts' || ext === 'm4s' || /[_-]\d{3,}\.(ts|m4s)(?:[?#]|$)/i.test(item.url || '');
  }

  function isWholeMedia(item) {
    const kind = typeOf(item);
    const ext = (item.ext || '').toLowerCase();
    return kind === 'm3u8' || kind === 'mpd' || (kind === 'video' && !isSegment(item) && ext !== 'ts' && ext !== 'm4s');
  }

  function isYoutubePlaybackUrl(rawUrl) {
    try {
      const u = new URL(String(rawUrl || ''));
      return /(^|\.)googlevideo\.com$/i.test(u.hostname) && /\/videoplayback\b/i.test(u.pathname);
    } catch {
      return false;
    }
  }

  function isYoutubePageUrl(rawUrl) {
    try {
      const u = new URL(String(rawUrl || ''));
      return /(^|\.)youtube\.com$/i.test(u.hostname) || /(^|\.)youtu\.be$/i.test(u.hostname);
    } catch {
      return false;
    }
  }

  function normalizeYoutubePlaybackUrl(rawUrl) {
    try {
      const u = new URL(String(rawUrl || ''));
      // 浏览器有时只请求某个 byte range；交给 ffmpeg 时去掉这些分片参数，让它自己拉完整流。
      ['range', 'rn', 'rbuf', 'ump'].forEach(key => u.searchParams.delete(key));
      return u.toString();
    } catch {
      return String(rawUrl || '');
    }
  }

  function youtubeStreamInfo(item) {
    try {
      const u = new URL(String(item && item.url || ''));
      const mime = decodeURIComponent(u.searchParams.get('mime') || item.mime || '').split(';')[0].trim().toLowerCase();
      const type = mime.startsWith('audio/') ? 'audio' : mime.startsWith('video/') ? 'video' : typeOf(item);
      const qualityLabel = u.searchParams.get('quality_label') || '';
      const sizeText = u.searchParams.get('size') || '';
      const heightFromLabel = Number((qualityLabel.match(/(\d{3,4})p/i) || [])[1]) || 0;
      const heightFromSize = Number((sizeText.match(/x(\d{3,4})/i) || [])[1]) || 0;
      const bitrate = Number(u.searchParams.get('bitrate')) || 0;
      const clen = Number(u.searchParams.get('clen')) || Number(item.size) || 0;
      const itag = Number(u.searchParams.get('itag')) || 0;
      const mp4Bonus = /mp4/i.test(mime) ? 100000000 : 0;
      return {
        item,
        type,
        mime,
        itag,
        height: Math.max(heightFromLabel, heightFromSize),
        bitrate,
        size: clen,
        score: mp4Bonus + Math.max(heightFromLabel, heightFromSize) * 100000 + bitrate + Math.min(clen, 99999999) / 1000,
      };
    } catch {
      return { item, type: typeOf(item), mime: item && item.mime || '', itag: 0, height: 0, bitrate: 0, size: Number(item && item.size) || 0, score: 0 };
    }
  }

  function buildYoutubeGroups(list) {
    const ytItems = list.filter(item => isYoutubePlaybackUrl(item.url));
    if (!ytItems.length) return [];
    const streams = ytItems.map(youtubeStreamInfo);
    const videos = streams.filter(x => x.type === 'video').sort((a, b) => b.score - a.score);
    const audios = streams.filter(x => x.type === 'audio').sort((a, b) => b.score - a.score);
    const video = videos[0] || null;
    const audio = audios[0] || null;
    if (!video && !audio) return [];
    const title = (lastState.title || (video && video.item.pageTitle) || (audio && audio.item.pageTitle) || 'YouTube 视频')
      .replace(/\s*-\s*YouTube\s*$/i, '')
      .trim() || 'YouTube 视频';
    const items = [video && video.item, audio && audio.item].filter(Boolean);
    const quality = video && video.height ? `${video.height}p` : '';
    return [{
      id: 'youtube:' + cryptoLike([video && video.item.url, audio && audio.item.url].filter(Boolean).join('|')),
      kind: 'youtube',
      episodeNo: 1,
      label: 'YouTube',
      title: `YouTube整集 · ${title}${quality ? ' · ' + quality : ''}`,
      items,
      main: video ? video.item : audio.item,
      youtubePair: {
        video: video && video.item,
        audio: audio && audio.item,
      },
      size: items.reduce((sum, item) => sum + (Number(item.size) || 0), 0),
      count: items.length,
      capturedAt: Math.max(...items.map(item => item.capturedAt || 0)),
      note: audio
        ? 'YouTube 通常是视频流和音频流分离；这里会用双路合成保存成一个 MP4。'
        : '只抓到 YouTube 视频流，暂时没有抓到音频流；请播放几秒后再试。',
      incomplete: !video,
    }];
  }

  function cryptoLike(text) {
    let hash = 0;
    const raw = String(text || '');
    for (let i = 0; i < raw.length; i++) hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
    return Math.abs(hash).toString(36);
  }

  function parseSegment(item) {
    try {
      const u = new URL(item.url);
      const parts = u.pathname.split('/');
      const rawName = decodeURIComponent(parts.pop() || item.filename || 'segment.ts');
      const dir = parts.join('/') + '/';
      const match = rawName.match(/^(.*?)(\d+)(\.[a-z0-9]+)$/i);
      const prefix = match ? match[1] : rawName.replace(/\.[^.]+$/, '');
      const number = match ? Number(match[2]) : 0;
      const suffix = match ? match[3].toLowerCase() : '.' + (item.ext || 'ts');
      return {
        key: u.origin + dir + prefix + '*' + suffix,
        dirUrl: u.origin + dir,
        prefix,
        suffix,
        number,
        name: rawName,
      };
    } catch {
      return {
        key: 'segment:' + (item.url || item.id),
        dirUrl: '',
        prefix: '',
        suffix: '.' + (item.ext || 'ts'),
        number: 0,
        name: item.filename || 'segment',
      };
    }
  }

  function cleanOutputName(name, fallback) {
    const text = String(name || fallback || 'episode').replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_').trim();
    return text || 'episode';
  }

  const RESOLUTION_NUMBERS = new Set([144, 240, 360, 480, 540, 576, 720, 1080, 1440, 2160, 4320]);

  function dirKeyOf(url) {
    try {
      const u = new URL(url);
      const parts = u.pathname.split('/');
      parts.pop();
      return u.origin + parts.join('/') + '/';
    } catch {
      return String(url || '').split(/[?#]/)[0].replace(/[^/\\]*$/, '');
    }
  }

  function extractResourceEpisodeNo(text) {
    const raw = String(text || '');
    let name = raw;
    try {
      const seg = raw.split(/[?#]/)[0].split(/[\/\\]/).pop();
      if (seg) name = seg;
    } catch {}

    const fileNamePatterns = [
      /^(?:ep|episode|e)?[_-]?(\d{1,4})[_-]*\.(?:m3u8|m3u|mpd|mp4|m4v)$/i,
      /^0*(\d{1,4})[_\-\s.]{1,3}\d{2,}\.(?:ts|m4s|mp4)$/i,
      /^(?:manifest|index|playlist|chunklist|media)[_-]?(\d{1,4})\.(?:m3u8|m3u)$/i,
    ];
    for (const pattern of fileNamePatterns) {
      const m = name.match(pattern);
      if (m) {
        const n = Number(m[1]);
        if (n > 0 && !RESOLUTION_NUMBERS.has(n)) return n;
      }
    }
    const dirMatch = raw.match(/[\/\\](?:ep|episode|e)?[_-]?(\d{1,4})[\/\\](?:manifest|index|playlist|chunklist|media)\.(?:m3u8|m3u)(?:[?#]|$)/i);
    if (dirMatch) {
      const n = Number(dirMatch[1]);
      if (n > 0 && !RESOLUTION_NUMBERS.has(n)) return n;
    }
    return 0;
  }

  function extractEpisodeNo(text) {
    const raw = String(text || '');
    if (isOpaqueHashPlayerUrl(raw)) return 0;
    const fromResource = extractResourceEpisodeNo(raw);
    if (fromResource) return fromResource;
    try {
      const u = new URL(normalizeUrl(raw));
      const key = episodeQueryKey(u);
      if (key) return Number(u.searchParams.get(key)) || 0;
      const vodplay = vodplayEpisodeMatch(u.pathname);
      if (vodplay) return Number(vodplay[2]) || 0;
    } catch {}
    const patterns = [
      /[?&](?:episode|ep|eps|e|chapter|chapter_id)=(\d{1,4})\b/i,
      /\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-(\d{1,4})\.html(?:[?#]|$)/i,
      /(?:^|[\/_-])(?:episode|ep)[\/\s_-]?(\d{1,4})(?=$|[/?#_-])/i,
      /\bepisode\s*(\d+)\b/i,
      /\bep\s*(\d+)\b/i,
      /第\s*(\d+)\s*集/,
    ];
    for (const pattern of patterns) {
      const m = raw.match(pattern);
      if (m) return Number(m[1]);
    }
    return 0;
  }

  // ReelShort 这类站点：资源 URL 里的数字（CDN id / 分片序号 / 清晰度）不是集号，
  // 却会盖过正确的 scanEpisodeNo，导致整集存错位置。命中后只信扫描锁定的集号 + 页面 URL 里的 episode-N。
  // item.fromOpaqueSite 在资源到达时(onItem)就盖好章了，所以这里不依赖逐个解析 pageUrl。
  function resourceIsFromOpaqueEpisodeSite(item) {
    if (!item) return false;
    if (item.fromOpaqueSite) return true;
    return hasPerEpisodeOpaqueId(item.pageUrl) || hasPerEpisodeOpaqueId(item.referer);
  }

  function episodeNoOf(item) {
    const opaque = resourceIsFromOpaqueEpisodeSite(item);
    if (!opaque) {
      const fromName = extractResourceEpisodeNo(item.filename) || extractResourceEpisodeNo(item.url);
      if (fromName) return fromName;
    }
    if (item.scanEpisodeNo) return item.scanEpisodeNo;
    return extractEpisodeNo(item.pageUrl) || extractEpisodeNo(item.referer);
  }

  function tagCapturedResourcesForEpisode(episodeNo, sinceTs, token) {
    const ep = Number(episodeNo) || 0;
    if (!ep) return 0;
    let changed = 0;
    for (const item of resources.values()) {
      if ((item.capturedAt || 0) < sinceTs - 300) continue;
      if (item.scanEpisodeNo) continue;
      const opaque = resourceIsFromOpaqueEpisodeSite(item);
      if (opaque) item.fromOpaqueSite = true;
      // 普通站点：URL 自带集号的资源让它自报，不强行打标；不透明站点：URL 数字不可信，一律按扫描集号打标
      if (!opaque && (extractResourceEpisodeNo(item.filename) || extractResourceEpisodeNo(item.url))) continue;
      if (!isWholeMedia(item) && !isSegment(item)) continue;
      item.scanEpisodeNo = ep;
      if (token) item.scanToken = token;
      changed++;
    }
    if (changed) render();
    return changed;
  }

  function seriesKeyOf(item) {
    const source = item.pageUrl || item.referer || item.url || '';
    try {
      const u = new URL(source);
      for (const key of EPISODE_QUERY_KEYS) u.searchParams.delete(key);
      u.pathname = u.pathname
        .replace(/(\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-)\d{1,4}(\.html)$/i, '$1EP$2')
        .replace(/(^|[\/_-])(?:episode|ep)([\/_-]?)(\d{1,4})(?=$|[\/_-])/i, '$1ep');
      u.hash = '';
      return u.origin + u.pathname;
    } catch {
      return String(source)
        .replace(/([?&])(?:episode|ep|eps|e|chapter|chapter_id)=\d{1,4}\b/ig, '$1')
        .replace(/(\/(?:vodplay|play)\/[^\/?#]+?-\d{1,4}-)\d{1,4}(\.html)/i, '$1EP$2')
        .replace(/(^|[\/_-])(?:episode|ep)([\/_-]?)(\d{1,4})(?=$|[/?#_-])/i, '$1ep');
    }
  }

  function shortEpisodeTitle(item, episodeNo) {
    const title = String(item.pageTitle || '').replace(/\s*\|\s*.*$/, '').trim();
    if (!title) return `第${episodeNo}集`;
    return title.replace(new RegExp(`\\bEpisode\\s*${episodeNo}\\b`, 'i'), `第${episodeNo}集`);
  }

  function chooseMainResource(group) {
    const items = group.items.slice();
    const score = (item) => {
      const name = String(item.filename || item.url || '').toLowerCase();
      const kind = typeOf(item);
      if (name.includes('manifest') && kind === 'm3u8') return 0;
      if (kind === 'mpd') return 1;
      if (kind === 'm3u8' && !name.includes('audio')) return 2;
      if (kind === 'video' && !isSegment(item)) return 3;
      if (kind === 'm3u8') return 4;
      return 9;
    };
    return items.sort((a, b) => score(a) - score(b) || (b.size || 0) - (a.size || 0))[0] || null;
  }

  function buildTrueEpisodeGroups(list) {
    const groups = new Map();
    const candidates = list.filter(item => isWholeMedia(item) || isSegment(item));

    const dirEpisode = new Map();
    candidates.forEach((item) => {
      if (!isWholeMedia(item)) return;
      if (resourceIsFromOpaqueEpisodeSite(item)) return; // 不透明站点：URL 数字不可信，不参与目录集号推断
      const n = extractResourceEpisodeNo(item.filename) || extractResourceEpisodeNo(item.url);
      if (n && !dirEpisode.has(dirKeyOf(item.url))) dirEpisode.set(dirKeyOf(item.url), n);
    });

    const resolveEpisodeNo = (item) => {
      // ReelShort 这类站点：忽略资源 URL 里的数字，只用扫描锁定的集号 + 页面 URL 里的 episode-N
      if (resourceIsFromOpaqueEpisodeSite(item)) {
        return Number(item.scanEpisodeNo || 0) || extractEpisodeNo(item.pageUrl) || extractEpisodeNo(item.referer);
      }
      const own = extractResourceEpisodeNo(item.filename) || extractResourceEpisodeNo(item.url);
      if (own) return own;
      const inherited = dirEpisode.get(dirKeyOf(item.url));
      if (inherited) return inherited;
      return Number(item.scanEpisodeNo || 0) || extractEpisodeNo(item.pageUrl) || extractEpisodeNo(item.referer);
    };

    candidates.forEach((item) => {
      const episodeNo = resolveEpisodeNo(item);
      if (!episodeNo) return;
      const key = seriesKeyOf(item) + '#episode=' + episodeNo;
      if (!groups.has(key)) {
        groups.set(key, {
          id: 'episode:' + key,
          kind: 'episode',
          episodeNo,
          label: `第${episodeNo}集`,
          title: shortEpisodeTitle(item, episodeNo),
          items: [],
          size: 0,
          count: 0,
          capturedAt: 0,
          note: '这是按真实资源文件名识别出的整集；优先复制 manifest/m3u8 或合并命令。',
        });
      }
      const group = groups.get(key);
      group.items.push(item);
      group.size += Number(item.size) || 0;
      group.count += 1;
      group.capturedAt = Math.max(group.capturedAt, item.capturedAt || 0);
    });

    return Array.from(groups.values()).map((group) => {
      group.main = chooseMainResource(group);
      const mainKind = group.main ? typeOf(group.main) : '';
      if (group.main) {
        group.kind = mainKind === 'audio' ? 'episode' : mainKind;
        group.title = `${group.label} · ${group.main.filename || group.title}`;
      }
      const segments = group.items.filter(isSegment);
      if (!group.main && segments.length >= 2) {
        group.kind = 'segments';
        group.items = segments;
        const numbers = segments.map(item => item.segmentNumber).filter(n => Number.isFinite(n));
        const min = numbers.length ? Math.min(...numbers) : 0;
        const max = numbers.length ? Math.max(...numbers) : 0;
        group.incomplete = min > 1 || (numbers.length && (max - min + 1 !== numbers.length));
      }
      return group;
    }).sort((a, b) => a.episodeNo - b.episodeNo);
  }

  function buildEpisodes(list) {
    const youtubeEpisodes = buildYoutubeGroups(list);
    const trueEpisodes = buildTrueEpisodeGroups(list);
    if (youtubeEpisodes.length || trueEpisodes.length) {
      return youtubeEpisodes.concat(trueEpisodes).sort((a, b) => {
        if (a.kind === 'youtube' && b.kind !== 'youtube') return -1;
        if (b.kind === 'youtube' && a.kind !== 'youtube') return 1;
        return (a.episodeNo || 0) - (b.episodeNo || 0);
      });
    }

    const groups = new Map();
    const hasManifest = list.some(item => typeOf(item) === 'm3u8' || typeOf(item) === 'mpd');

    list.filter(isWholeMedia).forEach((item) => {
      const kind = typeOf(item);
      groups.set('whole:' + item.id, {
        id: 'whole:' + item.id,
        kind,
        label: kind === 'm3u8' ? '清单' : kind === 'mpd' ? 'DASH' : '视频',
        title: (kind === 'm3u8' ? '整集清单 · ' : kind === 'mpd' ? 'DASH 清单 · ' : '完整视频 · ') + (item.filename || item.ext || 'media'),
        items: [item],
        main: item,
        size: item.size || 0,
        count: 1,
        capturedAt: item.capturedAt || 0,
        note: kind === 'm3u8' || kind === 'mpd'
          ? '这是整集播放清单，合成 MP4 时会按完整清单读取，优先使用它。'
          : '这是一个完整媒体直链，可直接下载。',
      });
    });

    list.filter(item => !hasManifest && isSegment(item)).forEach((item) => {
      const seg = parseSegment(item);
      if (!groups.has('seg:' + seg.key)) {
        groups.set('seg:' + seg.key, {
          id: 'seg:' + seg.key,
          kind: 'segments',
          label: '分片组',
          title: '分片整集 · ' + (seg.prefix || 'episode') + '*' + seg.suffix,
          items: [],
          size: 0,
          count: 0,
          capturedAt: 0,
          dirUrl: seg.dirUrl,
          prefix: seg.prefix,
          suffix: seg.suffix,
          min: null,
          max: null,
          note: '未捕获到整集清单时，会把同一目录下连续 ts/m4s 分片整理成一集。',
        });
      }
      const group = groups.get('seg:' + seg.key);
      group.items.push({ ...item, segmentNumber: seg.number, segmentName: seg.name });
      group.size += Number(item.size) || 0;
      group.count += 1;
      group.capturedAt = Math.max(group.capturedAt, item.capturedAt || 0);
      if (seg.number) {
        group.min = group.min == null ? seg.number : Math.min(group.min, seg.number);
        group.max = group.max == null ? seg.number : Math.max(group.max, seg.number);
      }
    });

    return Array.from(groups.values())
      .filter(group => group.kind !== 'segments' || group.count >= 2)
      .map(group => {
      if (group.kind === 'segments') {
        group.items.sort((a, b) => (a.segmentNumber || 0) - (b.segmentNumber || 0));
        const range = group.min != null && group.max != null ? `#${group.min}-${group.max}` : `${group.count} 段`;
        group.title = `分片整集 · ${group.prefix || 'episode'} ${range}`;
        if (group.min > 1 || (group.max && group.min && group.max - group.min + 1 !== group.count)) {
          group.incomplete = true;
          group.note = '只抓到部分分片，不能保证完整内容；请等待整集 m3u8 出现，或点“获取全集”重新抓。';
        }
      }
        return group;
      })
      .sort((a, b) => {
        const rank = { m3u8: 0, mpd: 1, video: 2, segments: 3, audio: 4 };
        return (rank[a.kind] ?? 9) - (rank[b.kind] ?? 9) || (b.capturedAt || 0) - (a.capturedAt || 0);
      });
  }

  function episodeFfmpeg(group) {
    if (group.youtubePair) {
      const video = group.youtubePair.video || null;
      const audio = group.youtubePair.audio || null;
      const output = cleanOutputName((group.title || 'youtube-video').replace(/^YouTube整集\s*[·.-]?\s*/i, ''), 'youtube-video') + '.mp4';
      const headers = [];
      const ref = (video && video.referer) || (audio && audio.referer) || '';
      const ua = (video && video.userAgent) || (audio && audio.userAgent) || '';
      if (ref) headers.push('Referer: ' + ref);
      if (ua) headers.push('User-Agent: ' + ua);
      const headerPart = headers.length ? `-headers ${JSON.stringify(headers.join('\\r\\n') + '\\r\\n')} ` : '';
      const inputs = [
        video && `-i ${JSON.stringify(normalizeYoutubePlaybackUrl(video.url))}`,
        audio && `-i ${JSON.stringify(normalizeYoutubePlaybackUrl(audio.url))}`,
      ].filter(Boolean).join(' ');
      const maps = [
        video && '-map 0:v:0?',
        audio && (video ? '-map 1:a:0?' : '-map 0:a:0?'),
      ].filter(Boolean).join(' ');
      return `ffmpeg ${headerPart}${inputs} ${maps} -c copy ${JSON.stringify(output)}`;
    }
    if (group.main) {
      const item = group.main;
      const output = cleanOutputName((item.filename || 'episode').replace(/\.(m3u8|m3u|mpd)$/i, ''), 'episode') + '.mp4';
      const headers = [];
      if (item.referer) headers.push('Referer: ' + item.referer);
      if (item.userAgent) headers.push('User-Agent: ' + item.userAgent);
      const headerPart = headers.length ? `-headers ${JSON.stringify(headers.join('\\r\\n') + '\\r\\n')} ` : '';
      return `ffmpeg ${headerPart}-i ${JSON.stringify(item.url)} -c copy ${JSON.stringify(output)}`;
    }

    const output = cleanOutputName((group.prefix || 'episode').replace(/[_-]$/, ''), 'episode') + '.mp4';
    const lines = group.items.map(item => `file '${String(item.url).replace(/'/g, "'\\''")}'`).join('\n');
    return [
      '# 1. 把下面这些内容保存为 segments.txt',
      lines,
      '',
      '# 2. 在 segments.txt 所在目录执行',
      `ffmpeg -protocol_whitelist "file,http,https,tcp,tls,crypto" -f concat -safe 0 -i segments.txt -c copy ${JSON.stringify(output)}`,
    ].join('\n');
  }

  function episodeLinkList(group) {
    if (group.youtubePair) {
      return [
        group.youtubePair.video && ('视频流: ' + normalizeYoutubePlaybackUrl(group.youtubePair.video.url)),
        group.youtubePair.audio && ('音频流: ' + normalizeYoutubePlaybackUrl(group.youtubePair.audio.url)),
      ].filter(Boolean).join('\n');
    }
    return (group.main ? [group.main.url] : group.items.map(item => item.url)).join('\n');
  }

  // ========== 修改：mergePayloadFor 加入 customHeaders ==========
  function mergePayloadFor(group) {
    if (group.youtubePair) {
      const video = group.youtubePair.video || null;
      const audio = group.youtubePair.audio || null;
      const ref = (video && video.referer) || (audio && audio.referer) || '';
      const ua = (video && video.userAgent) || (audio && audio.userAgent) || '';
      const baseName = cleanOutputName((group.title || 'youtube-video').replace(/^YouTube整集\s*[·.-]?\s*/i, ''), 'youtube-video');
      return {
        mode: 'dual',
        filename: baseName + '.mp4',
        title: group.title || baseName,
        url: video ? normalizeYoutubePlaybackUrl(video.url) : '',
        videoUrl: video ? normalizeYoutubePlaybackUrl(video.url) : '',
        audioUrl: audio ? normalizeYoutubePlaybackUrl(audio.url) : '',
        referer: ref,
        userAgent: ua,
        headers: customHeaders,
      };
    }
    const main = group.main || null;
    const baseName = cleanOutputName(
      (group.label || group.title || (main && main.filename) || 'episode')
        .replace(/\.(m3u8|m3u|mpd|ts|m4s|mp4)$/i, ''),
      'episode'
    );
    const payload = {
      mode: 'manifest',
      filename: baseName + '.mp4',
      title: group.title || baseName,
      referer: main ? main.referer : '',
      userAgent: main ? main.userAgent : '',
      headers: customHeaders   // 增加自定义请求头
    };
    if (main) {
      payload.url = main.url;
    } else {
      payload.mode = 'segments';
      payload.urls = (group.items || []).map(item => item.url).filter(Boolean);
      payload.incomplete = !!group.incomplete;
      const first = group.items && group.items[0] ? group.items[0] : {};
      payload.referer = first.referer || '';
      payload.userAgent = first.userAgent || '';
    }
    return payload;
  }

  function outputFileForEpisode(group, episodeNo) {
    const prefix = String(episodeNo).padStart(3, '0') + '-第' + episodeNo + '集';
    let suffix = '';
    const main = group.main || {};
    const source = (group.title || main.filename || 'episode')
      .replace(/^第\d+集\s*[·.-]?\s*/i, '')
      .replace(/\.(m3u8|m3u|mpd|ts|m4s|mp4)$/i, '');
    if (source && source !== 'episode') suffix = '-' + source;
    const resMatch = source.match(/\b(1080p?|720p?|4k|2160p?)\b/i);
    if (resMatch) suffix = '-' + resMatch[0].toLowerCase();
    const final = prefix + suffix;
    return cleanOutputName(final, prefix) + '.mp4';
  }

  function currentEpisodeGroups() {
    return buildEpisodes(Array.from(resources.values()));
  }

  function findEpisodeGroup(episodeNo) {
    const groups = currentEpisodeGroups();
    return groups.find(group => group.episodeNo === episodeNo && group.main && !group.incomplete) ||
           groups.find(group => group.episodeNo === episodeNo && !group.incomplete) ||
           groups.find(group => group.episodeNo === episodeNo) ||
           null;
  }

  function findEpisodeGroupByToken(episodeNo, token) {
    if (!token) return findEpisodeGroup(episodeNo);
    const groups = currentEpisodeGroups();
    return groups.find(g =>
      g.episodeNo === episodeNo &&
      g.main &&
      g.main.scanToken === token &&
      !g.incomplete
    ) || null;
  }

  async function waitForEpisodeGroup(episodeNo, timeoutMs) {
    const started = Date.now();
    while (!scanAbort && Date.now() - started < timeoutMs) {
      render();
      const group = findEpisodeGroup(episodeNo);
      if (group && group.main && !group.incomplete) return group;
      await sleep(700);
    }
    render();
    if (scanAbort) return null;
    return findEpisodeGroup(episodeNo);
  }

  function markNewResourcesForEpisode(episodeNo, sinceTs, token, beforeIds) {
    tagCapturedResourcesForEpisode(episodeNo, sinceTs, token);
    for (const item of resources.values()) {
      if (beforeIds && beforeIds.has(item.id)) continue;
      if (!item.scanEpisodeNo && !episodeNoOf(item) && (isWholeMedia(item) || isSegment(item))) {
        item.scanEpisodeNo = episodeNo;
        if (token) item.scanToken = token;
      }
    }
    render();
  }

  function hasCapturedEpisodeResource(episodeNo, token) {
    const exact = token ? findEpisodeGroupByToken(episodeNo, token) : null;
    if (exact && exact.main && !exact.incomplete) return true;
    const group = findEpisodeGroup(episodeNo);
    return !!(group && group.main && !group.incomplete);
  }

  async function waitForEpisodeCapture(episodeNo, startedAt, token, beforeIds, timeoutMs) {
    const ep = Number(episodeNo) || 0;
    if (!ep) return false;
    const limit = Number(timeoutMs) || EPISODE_CAPTURE_TIMEOUT_MS;
    const started = Date.now();
    let lastPlayAt = 0;
    let lastLogAt = 0;

    while (!scanAbort && Date.now() - started < limit) {
      if (Date.now() - lastPlayAt > 4500) {
        await safePlayerAction('play', 2200);
        lastPlayAt = Date.now();
      }
      markNewResourcesForEpisode(ep, startedAt, token, beforeIds);
      if (hasCapturedEpisodeResource(ep, token) || activeDownloadedEpisodes.has(ep)) return true;

      if (Date.now() - lastLogAt > 10000) {
        const left = Math.max(0, Math.ceil((limit - (Date.now() - started)) / 1000));
        logTask(`第 ${ep} 集还没抓到整集资源，继续播放等待（最多再等 ${left} 秒）`);
        lastLogAt = Date.now();
      }
      await sleep(1000);
    }

    markNewResourcesForEpisode(ep, startedAt, token, beforeIds);
    return hasCapturedEpisodeResource(ep, token) || activeDownloadedEpisodes.has(ep);
  }

  // 两段式抓取：先用很短的窗口快速播放抓取，抓到就立刻返回；只有没抓到、且允许兜底时，
  // 才延长播放继续等。两段共用同一个 startedAt / beforeIds，所以慢速段不会漏掉快速段里
  // 已经冒出来的资源。options.quickOnly=true 时只做快速探测、不做长等待（用于“这条链接到底有没有视频”的试探）。
  async function captureEpisodeSmart(episodeNo, startedAt, token, beforeIds, options) {
    const ep = Number(episodeNo) || 0;
    if (!ep) return false;
    const quickMs = (options && options.quickMs) || QUICK_CAPTURE_TIMEOUT_MS;
    const extendedMs = (options && options.extendedMs) || EXTENDED_CAPTURE_TIMEOUT_MS;
    const allowExtended = !(options && options.quickOnly);

    // 第一段：只播前几秒，抓到整集资源就收手
    let captured = await waitForEpisodeCapture(ep, startedAt, token, beforeIds, quickMs);
    if (captured || scanAbort || !allowExtended) return captured;

    // 第二段：前几秒没抓到，延长播放继续等
    logTask(`第 ${ep} 集前 ${Math.round(quickMs / 1000)} 秒没抓到，延长播放继续等（最多再等 ${Math.round(extendedMs / 1000)} 秒）`);
    return await waitForEpisodeCapture(ep, startedAt, token, beforeIds, extendedMs);
  }

  async function openEpisodeForScan(episodeNo, baseUrl) {
    const originalUrl = normalizeUrl(baseUrl || lastState.url || $('addressInput').value);
    const urlHasEpisode = urlLooksEpisode(originalUrl);

    if (urlHasEpisode) {
      const url = buildEpisodeUrl(baseUrl, episodeNo);
      if (url) {
        const result = await api.navigate(url);
        if (result && result.ok) return { ok: true, method: 'url' };
      }
    }

    if (api.openEpisode) {
      const opened = await api.openEpisode(episodeNo);
      if (opened && opened.ok) {
        if (opened.current && opened.current !== episodeNo) {
          return { ok: false, error: `网页显示当前是第 ${opened.current} 集，不是第 ${episodeNo} 集` };
        }
        return opened;
      }
      if (!urlHasEpisode) {
        return { ok: false, error: opened && opened.error ? opened.error : '网页控件切集失败，且当前网址没有可替换的集数参数' };
      }
      setStatus(`网页控件切到第 ${episodeNo} 集失败，尝试备用链接方式…`, 'error');
    }
    const url = buildEpisodeUrl(baseUrl, episodeNo);
    if (!url) return { ok: false, error: '无法生成第 ' + episodeNo + ' 集链接' };
    const result = await api.navigate(url);
    return result && result.ok ? { ok: true, method: 'url' } : (result || { ok: false, error: '访问失败' });
  }

  function waitForMerge(jobId) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        mergeWaiters.delete(jobId);
        reject(new Error('合成超时'));
      }, 1000 * 60 * 90);
      mergeWaiters.set(jobId, {
        resolve: (info) => { clearTimeout(timer); resolve(info); },
        reject: (err) => { clearTimeout(timer); reject(err); },
      });
    });
  }

  async function deleteIncompleteOutput(filePath) {
    if (!filePath || !api.deleteFile) return;
    try { await api.deleteFile(filePath); } catch (e) {}
  }

  // ========== 修改：带重试的合成函数，每次重试前检查 scanAbort ==========
  async function mergeEpisodeToDir(group, dir, episodeNo, retries = 3) {
    if (!group || group.incomplete) throw new Error('第 ' + episodeNo + ' 集资源不完整，已跳过');
    const payload = mergePayloadFor(group);
    payload.outputPath = joinPath(dir, outputFileForEpisode(group, episodeNo));
    
    let lastError = null;
    for (let attempt = 1; attempt <= retries; attempt++) {
      if (scanAbort) throw new Error('任务已停止');
      try {
        const started = await api.mergeMp4(payload);
        if (!started || !started.ok) throw new Error(started && started.error ? started.error : '合成任务启动失败');
        await waitForMerge(started.jobId);
        return payload.outputPath;
      } catch (err) {
        lastError = err;
        logTask(`第 ${episodeNo} 集合成失败 (尝试 ${attempt}/${retries})：${err.message}`);
        if (attempt < retries) await sleep(3000);
      }
    }
    throw new Error(`第 ${episodeNo} 集合成失败，已重试 ${retries} 次：${lastError?.message || '未知错误'}`);
  }

  function renderEpisodeGroups(list) {
    const episodes = buildEpisodes(list);
    episodeGroups.clear();
    episodes.forEach(group => episodeGroups.set(group.id, group));
    const realEpisodeCount = episodes.filter(group => group.episodeNo).length;
    $('resourceCount').textContent = realEpisodeCount
      ? `${realEpisodeCount} 集 / ${episodes.length} 组 / ${list.length} 条`
      : `${episodes.length} 组 / ${list.length} 条`;

    if (!episodes.length) {
      $('resourceList').innerHTML = '<div class="empty">还没整理出整集资源。先播放视频几秒，或切到“全部”查看原始请求。</div>';
      return;
    }

    const epNos = episodes.map(g => g.episodeNo).filter(Boolean).sort((a, b) => a - b);
    let banner = '';
    if (epNos.length) {
      const min = epNos[0];
      const max = epNos[epNos.length - 1];
      const missing = [];
      for (let i = min; i <= max; i++) if (!epNos.includes(i)) missing.push(i);
      const incompleteNos = episodes.filter(g => g.episodeNo && g.incomplete).map(g => g.episodeNo);
      const parts = [`已整理第 ${min}–${max} 集`];
      if (missing.length) parts.push(`缺第 ${missing.join('、')} 集（去网页把这些集播一下，或点“获取全集”）`);
      if (incompleteNos.length) parts.push(`第 ${incompleteNos.join('、')} 集只抓到部分分片，时长可能缺，先别合成`);
      banner = `<div class="episode-note" style="margin:2px 0 8px;color:var(--vermillion-d);font-weight:600">${escapeAttr(parts.join('；'))}</div>`;
    }

    $('resourceList').innerHTML = banner + episodes.map((group, index) => {
      const title = escapeAttr(group.title || '整集资源');
      const kind = escapeAttr(group.kind === 'segments' ? '分片' : group.kind);
      const primary = group.main ? group.main : group.items[0];
      const url = escapeAttr(group.main ? group.main.url : (group.dirUrl || primary.url || ''));
      const meta = group.kind === 'segments'
        ? `${group.count} 个分片 · 合计 ${formatSize(group.size)}`
        : `${group.count || 1} 条资源 · ${formatSize(group.size)} · ${(primary.mime || primary.ext || 'media')}`;
      const canDownload = !!group.main && group.kind !== 'youtube' && typeOf(group.main) !== 'm3u8' && typeOf(group.main) !== 'mpd';
      const label = escapeAttr(group.label || (group.episodeNo ? `第${group.episodeNo}集` : '资源组'));
      return `
        <div class="episode" data-episode-id="${escapeAttr(group.id)}">
          <div class="item-top">
            <span class="badge">${label}</span>
            <span class="name" title="${title}">${title}</span>
          </div>
          <div class="meta">${kind} · ${escapeAttr(meta)}</div>
          <div class="url">${url}</div>
          <div class="episode-note">${escapeAttr(group.note || '')}</div>
          <div class="actions">
            <button class="action" type="button" data-act="copy-episode">复制整集链接</button>
            <button class="action" type="button" data-act="merge-mp4">${group.incomplete ? '分片不完整' : '合成MP4'}</button>
            <button class="action" type="button" data-act="ffmpeg">复制合并命令</button>
            ${group.main ? '<button class="action" type="button" data-act="open-episode">打开</button>' : ''}
            ${canDownload ? '<button class="action" type="button" data-act="download-episode">下载文件</button>' : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function render() {
    const list = Array.from(resources.values())
      .sort((a, b) => (b.capturedAt || 0) - (a.capturedAt || 0));

    if (activeFilter === 'episode') {
      renderEpisodeGroups(list);
      return;
    }

    const filtered = list.filter(passesFilter);
    $('resourceCount').textContent = list.length + ' 条';

    if (!filtered.length) {
      $('resourceList').innerHTML = '<div class="empty">暂无匹配资源</div>';
      return;
    }

    $('resourceList').innerHTML = filtered.map((item) => {
      const ext = escapeAttr(item.ext || typeOf(item));
      const name = escapeAttr(item.filename || item.url);
      const mime = escapeAttr(item.mime || item.resourceType || 'media');
      const url = escapeAttr(item.url);
      const status = item.statusCode ? 'HTTP ' + item.statusCode + ' · ' : '';
      return `
        <div class="item" data-id="${escapeAttr(item.id)}">
          <div class="item-top">
            <span class="badge">${ext}</span>
            <span class="name" title="${name}">${name}</span>
          </div>
          <div class="meta">${status}${formatSize(item.size)} · ${mime}</div>
          <div class="url">${url}</div>
          <div class="actions">
            <button class="action" type="button" data-act="copy">复制链接</button>
            <button class="action" type="button" data-act="curl">复制 curl</button>
            <button class="action" type="button" data-act="open">打开</button>
            <button class="action" type="button" data-act="download">下载文件</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function generateEpisodesFromTemplate(tpl, start, end) {
    const existingUrls = new Set(Array.from(resources.values()).map(it => it.url));
    let added = 0;
    for (let ep = start; ep <= end; ep++) {
      const url = tpl.make(ep);
      if (existingUrls.has(url)) continue;
      let file;
      try { file = decodeURIComponent(url.split('?')[0].split('/').pop()); } catch { file = ep + '_.m3u8'; }
      resources.set('tpl:' + url, {
        id: 'tpl:' + url,
        url,
        ext: 'm3u8',
        mime: 'application/vnd.apple.mpegurl',
        filename: file || (ep + '_.m3u8'),
        size: 0,
        referer: tpl.referer || '',
        userAgent: tpl.userAgent || '',
        capturedAt: Date.now() + ep,
        synthetic: true,
      });
      existingUrls.add(url);
      added++;
    }
    render();
    return added;
  }

  async function extractFromPageHtml() {
    if (!api || !api.extractPageMedia) return 0;
    const pageUrl = normalizeUrl(lastState.url || $('addressInput').value);
    if (!pageUrl) return 0;
    setStatus('正在从页面源码里抠全集地址…');
    let res = null;
    try { res = await withTimeout(api.extractPageMedia(pageUrl), 12000, null); } catch (e) { return 0; }
    if (!res || !res.ok || !Array.isArray(res.urls) || !res.urls.length) return 0;

    const byEpisode = new Map();
    for (const url of res.urls) {
      const ep = extractResourceEpisodeNo(url);
      if (!ep || byEpisode.has(ep)) continue;
      byEpisode.set(ep, url);
    }
    if (byEpisode.size < 2 && !(Number(res.total) >= 2 && byEpisode.size >= 1)) return 0;

    const existingUrls = new Set(Array.from(resources.values()).map(it => it.url));
    for (const [ep, url] of Array.from(byEpisode.entries()).sort((a, b) => a[0] - b[0])) {
      if (existingUrls.has(url)) continue;
      let file;
      try { file = decodeURIComponent(url.split('?')[0].split('/').pop()); } catch { file = ep + '_.m3u8'; }
      resources.set('page:' + url, {
        id: 'page:' + url,
        url,
        ext: 'm3u8',
        mime: 'application/vnd.apple.mpegurl',
        filename: file || (ep + '_.m3u8'),
        size: 0,
        referer: pageUrl,
        userAgent: '',
        capturedAt: Date.now() + ep,
        synthetic: true,
        scanEpisodeNo: ep,
      });
      existingUrls.add(url);
    }
    render();
    return byEpisode.size;
  }

  async function scanEpisodeRange() {
    if (scanRunning) {
      await requestStop('正在停止扫描和合成任务…');
      return;
    }

    const grabbed = await extractFromPageHtml();
    if (grabbed >= 2) {
      logTask(`已直接从页面抠出 ${grabbed} 集地址，无需播放/翻页。可直接点「下载全集」`, 'replace');
      setStatus(`已列出 ${grabbed} 集，可点「下载全集」`);
      return;
    }

    const tpl = deriveEpisodeTemplate();
    if (tpl) {
      const inferred = await inferEpisodeRange();
      let start = inferred.start;
      let end = inferred.end;
      const rangeText = await askInput(
        '已识别到文件名规律（样本第 ' + tpl.sampleEp + ' 集）。\n' +
        '要一次性列出第几集到第几集？例如 1-71；只填 71 代表 1-71。\n' +
        '（带锁的付费集也会列出来，但下载会失败，建议只列没锁的）',
        `1-${end}`
      );
      if (rangeText == null) { setStatus('已取消'); return; }
      ({ start, end } = parseRange(rangeText, inferred.current));
      if (!start || !end || end < start) { setStatus('集数范围不正确', 'error'); return; }
      const added = generateEpisodesFromTemplate(tpl, start, end);
      logTask(`按文件名规律列出第 ${start}-${end} 集（新增 ${added} 集），无需逐集播放。可直接点「下载全集」`, 'replace');
      setStatus(`已列出第 ${start}-${end} 集，可点「下载全集」或逐集合成`);
      return;
    }

    await autoAdvanceScan();
  }

  async function autoAdvanceScan() {
    const fastScan = isFastScanEnabled();
    const captureTimeout = fastScan ? FAST_EPISODE_CAPTURE_TIMEOUT_MS : EPISODE_CAPTURE_TIMEOUT_MS;
    const pageIdleMs = fastScan ? FAST_PAGE_IDLE_MS : 9000;
    setStatus('正在读取网页里的集数列表…');
    logTask('读取网页集数列表中…', 'replace');
    let listRes = null;
    try { listRes = await api.episodeList(); } catch (e) {}
    const episodes = (listRes && listRes.ok && Array.isArray(listRes.episodes)) ? listRes.episodes : [];

    if (episodes.length) {
      const first = episodes[0].episode;
      const last = episodes[episodes.length - 1].episode;
      const capText = await askInput(
        `从网页读到 ${episodes.length} 集（第 ${first}-${last} 集）。\n要抓到第几集？（直接确定=抓到第 ${last} 集；带锁的付费集会抓不到然后跳过）`,
        `${last}`
      );
      if (capText == null) { setStatus('已取消'); return; }
      const cap = parseInt(capText, 10) || last;
      const todo = episodes.filter(e => e.episode <= cap);

      scanAbort = false;
      setScanUi(true);
      logTask(`按网页列表抓取，共 ${todo.length} 集`, 'replace');
      if (fastScan) logTask(`快速模式已开启：每集最多等待 ${Math.round(captureTimeout / 1000)} 秒，抓到资源就切下一集`);
      let got = 0, emptyStreak = 0;
      try {
        for (let i = 0; i < todo.length; i++) {
          if (scanAbort) break;
          const { episode, url } = todo[i];
          const beforeIds = new Set(Array.from(resources.keys()));
          const startedAt = Date.now();
          const token = `manual-list-${episode}-${startedAt}`;
          activeScanEpisodeNo = episode;
          activeScanToken = token;
          logTask(`第 ${episode} 集：打开并播放抓取… (${i + 1}/${todo.length})`);
          try {
            if (url) { await api.navigate(url); await waitForPageIdle(QUICK_PAGE_IDLE_MS); }
            const verified = await waitForManualVerificationIfNeeded(`第 ${episode} 集`);
            const captured = verified && await captureEpisodeSmart(episode, startedAt, token, beforeIds);
            if (captured) { got++; emptyStreak = 0; }
            else { emptyStreak++; logTask(`第 ${episode} 集没抓到（多半是付费锁集，跳过）`); }
          } finally {
            activeScanEpisodeNo = 0;
            activeScanToken = '';
          }
          if (emptyStreak >= 3) { logTask('连续三集抓不到资源，停止当前链接'); break; }
        }
        logTask(scanAbort ? `已停止 · 抓到 ${got} 集` : `按列表抓取完成 · 抓到 ${got} 集`);
      } catch (err) {
        logTask('抓取出错：' + (err && err.message ? err.message : err));
      } finally {
        scanAbort = false;
        setScanUi(false);
      }
      const eps = currentEpisodeGroups().filter(g => g.episodeNo).length;
      setStatus(`已整理 ${eps} 集，点「下载全集」逐集合成`);
      return;
    }

    logTask('没从网页读到集数列表，改用逐集切换方式…');
    const baseUrl = lastState.url || $('addressInput').value;
    const urlHasEpisode = urlLooksEpisode(baseUrl);

    const capText = await askInput(
      (fastScan
        ? '快速巡航抓全集：从第 1 集开始，每集只短暂播放等待，抓到整集资源就切下一集。\n'
        : '自动巡航抓全集：从第 1 集开始，每集会持续播放等待，抓到整集资源后再切下一集。\n') +
      '最多抓到第几集？（不确定就填大点，比如 200；到结尾会自动停）',
      '200'
    );
    if (capText == null) { setStatus('已取消'); return; }
    const cap = Math.min(Math.max(parseInt(capText, 10) || 0, 1), 1000);
    if (!cap) { setStatus('数量不正确', 'error'); return; }

    scanAbort = false;
    setScanUi(true);
    logTask('自动巡航开始…', 'replace');
    if (fastScan) logTask(`快速模式已开启：每集最多等待 ${Math.round(captureTimeout / 1000)} 秒`);
    await safePlayerAction('open-panel', 1800);
    if (urlHasEpisode) {
      await api.navigate(buildEpisodeUrl(baseUrl, 1));
      await waitForPageIdle(QUICK_PAGE_IDLE_MS);
    }

    let emptyStreak = 0;
    try {
      for (let ep = 1; ep <= cap; ep++) {
        if (scanAbort) break;
        const beforeIds = new Set(Array.from(resources.keys()));
        const startedAt = Date.now();
        const token = `manual-cruise-${ep}-${startedAt}`;
        activeScanEpisodeNo = ep;
        activeScanToken = token;
        logTask(`第 ${ep} 集：播放抓取中… (${ep}/${cap})`);
        let captured = false;
        try {
          const verified = await waitForManualVerificationIfNeeded(`第 ${ep} 集`);
          captured = verified && await captureEpisodeSmart(ep, startedAt, token, beforeIds);
        } finally {
          activeScanEpisodeNo = 0;
          activeScanToken = '';
        }

        if (captured) emptyStreak = 0;
        else { emptyStreak++; logTask(`第 ${ep} 集没抓到新地址`); }
        if (emptyStreak >= 3) { logTask('连续三集没抓到资源，停止当前链接'); break; }
        if (ep >= cap) break;

        if (urlHasEpisode) {
          await api.navigate(buildEpisodeUrl(baseUrl, ep + 1));
          await waitForPageIdle(QUICK_PAGE_IDLE_MS);
        } else {
          let r = {};
          r = await safePlayerAction('next', 2200) || {};
          await sleep(fastScan ? 1200 : 2500);
          if (!r.ok) { logTask('找不到“下一集”控件，停止'); break; }
        }
      }
    } catch (err) {
      logTask('自动巡航出错：' + (err && err.message ? err.message : err));
    } finally {
      scanAbort = false;
      setScanUi(false);
    }
    const eps2 = currentEpisodeGroups().filter(g => g.episodeNo).length;
    logTask(`自动巡航结束 · 已整理 ${eps2} 集。点「下载全集」逐集合成`);
    setStatus(`自动巡航结束，已整理 ${eps2} 集`);
  }

  function readyEpisodeGroups() {
    return currentEpisodeGroups()
      .filter(g => g.episodeNo && g.main && !g.incomplete)
      .sort((a, b) => a.episodeNo - b.episodeNo);
  }

  async function clearCapturedResources() {
    resources.clear();
    episodeGroups.clear();

  // 公共函数：确保第1集被尝试抓取，并把新资源明确标记为第1集
  async function ensureFirstEpisode(currentUrl, saveDir, options) {
    const fastScan = isFastScanEnabled(options);
    const firstEpisodeGroup = findEpisodeGroup(1);
    if (firstEpisodeGroup && firstEpisodeGroup.main && !firstEpisodeGroup.incomplete) {
      if (saveDir && !activeDownloadedEpisodes.has(1)) {
        downloadEpisodeImmediately(1, saveDir, '').catch(err => {
          logTask(`第 1 集即时保存失败：${err && err.message ? err.message : err}`);
        });
      }
      return true;
    }
    if (scanAbort) return false;

    logTask('第 1 集尚未抓到资源，尝试重新抓取第 1 集...');
    const originalUrl = normalizeUrl(lastState.url || $('addressInput').value);
    const firstSourceUrl = normalizeUrl(currentUrl || originalUrl);
    const firstUrl = buildEpisodeUrl(firstSourceUrl, 1);

    const startedAt = Date.now();
    const token = `ensure-first-${startedAt}`;
    const beforeIds = new Set(Array.from(resources.keys()));
    activeScanEpisodeNo = 1;
    activeScanToken = token;

    try {
      if (firstUrl) {
        await api.navigate(firstUrl);
      } else {
        const opened = await openEpisodeForScan(1, firstSourceUrl || originalUrl);
        if (!opened || !opened.ok) {
          logTask(`第 1 集补抓切集失败：${opened && opened.error ? opened.error : '没有可用切集控件'}`);
          return false;
        }
      }
      await waitForPageIdle(QUICK_PAGE_IDLE_MS);
      const verified = await waitForManualVerificationIfNeeded('第 1 集补抓');
      if (!verified) return false;
      await captureEpisodeSmart(1, startedAt, token, beforeIds);

      const group = findEpisodeGroupByToken(1, token) || findEpisodeGroup(1);
      if (group && group.main && !group.incomplete) {
        logTask('第 1 集补抓成功');
        if (saveDir && !activeDownloadedEpisodes.has(1)) {
          downloadEpisodeImmediately(1, saveDir, token).catch(err => {
            logTask(`第 1 集补抓后即时保存失败：${err && err.message ? err.message : err}`);
          });
        }
        return true;
      }
      logTask('第 1 集补抓后仍未识别到可保存的整集资源');
      return false;
    } finally {
      activeScanEpisodeNo = 0;
      activeScanToken = '';
      if (!scanAbort && firstUrl && originalUrl && normalizeUrl(originalUrl) !== normalizeUrl(firstUrl)) {
        try {
          await api.navigate(originalUrl);
          await waitForPageIdle(fastScan ? 2000 : 5000);
        } catch (e) {}
      }
    }
  }

  function hasReadyEpisode(ep) {
    const group = findEpisodeGroup(ep);
    return !!(group && group.main && !group.incomplete);
  }

  function shouldForceFirstEpisodeRetry() {
    return !activeDownloadedEpisodes.has(1) && hasReadyEpisode(2) && hasReadyEpisode(3);
  }

  async function waitForEpisodeSaved(ep, timeoutMs) {
    const started = Date.now();
    while (!scanAbort && !activeDownloadedEpisodes.has(ep) && Date.now() - started < timeoutMs) {
      const job = backgroundJobs.get(ep);
      if (job && typeof job.then === 'function') {
        await Promise.race([job.catch(() => false), sleep(1000)]);
      } else {
        await sleep(1000);
      }
    }
    return activeDownloadedEpisodes.has(ep);
  }

  async function retryFirstEpisodeUntilSaved(currentUrl, saveDir, reason) {
    if (!saveDir || activeDownloadedEpisodes.has(1)) return true;
    if (!shouldForceFirstEpisodeRetry()) return false;
    if (firstEpisodeRetryPromise) return firstEpisodeRetryPromise;

    firstEpisodeRetryPromise = (async () => {
      let attempt = 0;
      while (!scanAbort && !activeDownloadedEpisodes.has(1)) {
        attempt++;
        const message = `${reason || '检测到首集缺失'}：第 2、3 集已拿到，但第 1 集缺失，强制重试第 1 集（第 ${attempt} 次）`;
        logTask(message);
        setStatus(message);

        await ensureFirstEpisode(currentUrl || lastState.url || $('addressInput').value, saveDir);
        if (await waitForEpisodeSaved(1, 70000)) break;

        const group = findEpisodeGroup(1);
        if (group && group.main && !group.incomplete) {
          logTask('第 1 集资源已识别但未保存成功，重新合成保存第 1 集...');
          await downloadEpisodeImmediately(1, saveDir, '');
          if (await waitForEpisodeSaved(1, 70000)) break;
        }

        if (!scanAbort && !activeDownloadedEpisodes.has(1)) {
          logTask('第 1 集仍未保存成功，继续重试，不跳过首集');
          await sleep(Math.min(15000, 4000 + attempt * 1000));
        }
      }

      if (activeDownloadedEpisodes.has(1)) {
        logTask('第 1 集已补抓并保存成功');
        return true;
      }
      logTask('第 1 集补抓已停止');
      return false;
    })();

    try {
      return await firstEpisodeRetryPromise;
    } finally {
      firstEpisodeRetryPromise = null;
    }
  }

  async function downloadEpisodeImmediately(episodeNo, dir, token) {
    const ep = Number(episodeNo) || 0;
    if (!ep || !dir) return false;
    if (activeDownloadedEpisodes.has(ep)) return true;
    if (backgroundJobs.has(ep)) {
      return backgroundJobs.get(ep);
    }
    if (downloadingEpisodes.has(ep)) return false;

    downloadingEpisodes.add(ep);
    const jobPromise = (async () => {
      try {
        let group = null;
        for (let attempt = 0; attempt < 15; attempt++) {
          group = findEpisodeGroupByToken(ep, token);
          if (group && group.main && !group.incomplete) break;
          await sleep(1000);
        }
        if ((!group || !group.main || group.incomplete) && token) {
          const fallbackGroup = findEpisodeGroup(ep);
          if (fallbackGroup && fallbackGroup.main && !fallbackGroup.incomplete) {
            group = fallbackGroup;
            logTask(`第 ${ep} 集未找到本轮新资源，改用已整理好的第 ${ep} 集资源保存`);
          }
        }
        if (!group || !group.main || group.incomplete) {
          logTask(`第 ${ep} 集资源未在等待时间内出现，跳过`);
          return false;
        }
        await mergeEpisodeToDir(group, dir, ep, 3);
        activeDownloadedEpisodes.add(ep);
        logTask(`第 ${ep} 集即时保存成功`);
        await saveDramaSourceDocument(dir, { note: `第 ${ep} 集保存成功后自动更新` });
        return true;
      } catch (err) {
        logTask(`第 ${ep} 集即时保存失败：${err && err.message ? err.message : err}`);
        return false;
      } finally {
        downloadingEpisodes.delete(ep);
        backgroundJobs.delete(ep);
      }
    })();
    backgroundJobs.set(ep, jobPromise);
    backgroundPromises.push(jobPromise);
    return jobPromise;
  }

  async function collectEpisodeListForBatch(maxEpisodes, options) {
    if (!api.episodeList) return 0;
    let listRes = null;
    try { listRes = await api.episodeList(); } catch (e) {}
    const limit = Math.max(1, Number(maxEpisodes) || 200);
    const baseEpisodeUrl = normalizeUrl($('addressInput').value || lastState.url);
    let episodes = (listRes && listRes.ok && Array.isArray(listRes.episodes)) ? listRes.episodes : [];
    if (!episodes.length && urlLooksEpisode(baseEpisodeUrl)) {
      episodes = Array.from({ length: limit }, (_v, idx) => {
        const ep = idx + 1;
        return { episode: ep, url: buildEpisodeUrl(baseEpisodeUrl, ep), text: '按链接规律生成' };
      });
      logTask(`网页没有返回选集列表，已按链接规律从第 1 集生成最多 ${limit} 集的抓取队列`);
    }
    if (!episodes.length) {
      const fallbackCount = 3;
      episodes = Array.from({ length: fallbackCount }, (_v, idx) => ({
        episode: idx + 1,
        url: buildEpisodeUrl(baseEpisodeUrl, idx + 1),
        text: '无选集列表，尝试网页控件切集',
        quickProbe: true,
      }));
      logTask(`页面没有返回选集列表，先尝试切第 1-${fallbackCount} 集判断是否有视频内容`);
    }

    const downloadAsReady = !!(options && options.downloadAsReady);
    const streamDir = options && options.downloadDir ? options.downloadDir : '';
    const fastScan = isFastScanEnabled(options);
    const normalCaptureTimeout = fastScan ? FAST_EPISODE_CAPTURE_TIMEOUT_MS : EPISODE_CAPTURE_TIMEOUT_MS;
    const quickCaptureTimeout = fastScan ? Math.min(QUICK_PROBE_CAPTURE_TIMEOUT_MS, FAST_EPISODE_CAPTURE_TIMEOUT_MS) : QUICK_PROBE_CAPTURE_TIMEOUT_MS;
    const pageIdleMs = fastScan ? FAST_PAGE_IDLE_MS : 10000;
    const noUrlPageIdleMs = fastScan ? FAST_NO_URL_PAGE_IDLE_MS : 8000;
    const byEpisode = new Map();
    episodes.filter(e => e && e.episode).forEach(entry => {
      const entryUrl = isOpaqueHashPlayerUrl(entry.url) ? '' : (entry.url || '');
      const ep = extractEpisodeNo(entryUrl) || Number(entry.episode);
      if (!ep) return;
      const fixedUrl = urlLooksEpisode(baseEpisodeUrl) ? buildEpisodeUrl(baseEpisodeUrl, ep) : entryUrl;
      byEpisode.set(ep, { ...entry, episode: ep, url: fixedUrl });
    });
    if (urlLooksEpisode(baseEpisodeUrl) && !byEpisode.has(1)) {
      byEpisode.set(1, {
        episode: 1,
        url: buildEpisodeUrl(baseEpisodeUrl, 1),
        text: '自动补入第1集',
      });
      logTask('网页选集列表没有返回第 1 集，已按当前链接规则自动补入第 1 集');
    } else if (isOpaqueHashPlayerUrl(baseEpisodeUrl) && !byEpisode.has(1)) {
      byEpisode.set(1, {
        episode: 1,
        url: '',
        text: 'hash播放器自动补入第1集',
      });
      logTask('hash 播放器选集列表没有返回第 1 集，已改用网页按钮自动补入第 1 集');
    }
    const todo = Array.from(byEpisode.values())
      .filter(e => e && e.episode)
      .sort((a, b) => Number(a.episode) - Number(b.episode))
      .slice(0, limit);
    let got = 0;
    if (fastScan) {
      logTask(`快速模式已开启：每集最多等待 ${Math.round(normalCaptureTimeout / 1000)} 秒，抓到资源就切下一集，下载合成在后台继续`);
    }

    async function captureOne(entry, indexLabel) {
      if (scanAbort) return false;
      const url = isOpaqueHashPlayerUrl(entry.url) ? '' : (entry.url || '');
      const episode = extractEpisodeNo(url) || Number(entry.episode);
      if (!episode) return false;
      const beforeReady = readyEpisodeGroups().length;
      const startedAt = Date.now();
      const beforeIds = new Set(Array.from(resources.keys()));
      const scanToken = `${episode}-${Date.now()}`;
      let captured = false;
      activeScanEpisodeNo = episode;
      activeScanToken = scanToken;
      logTask(`批量抓取 · 第 ${episode} 集：打开并播放 (${indexLabel}) token=${scanToken}`);
      try {
        if (url) {
          await api.navigate(url);
          await waitForPageIdle(QUICK_PAGE_IDLE_MS);
          const verified = await waitForManualVerificationIfNeeded(`第 ${episode} 集`);
          if (!verified) return false;
        } else {
          const opened = await openEpisodeForScan(episode, lastState.url || $('addressInput').value);
          if (!opened || !opened.ok) {
              logTask(`批量抓取 · 第 ${episode} 集切集失败：${opened && opened.error ? opened.error : '没有可用切集控件'}`);
            }
          await waitForPageIdle(QUICK_PAGE_IDLE_MS);
          const verified = await waitForManualVerificationIfNeeded(`第 ${episode} 集`);
          if (!verified) return false;
        }
        captured = await captureEpisodeSmart(episode, startedAt, scanToken, beforeIds, {
          quickOnly: !!entry.quickProbe,
        });
        if (!captured) logTask(`批量抓取 · 第 ${episode} 集在等待时间内没有出现整集资源`);
      } finally {
        activeScanEpisodeNo = 0;
        activeScanToken = '';
      }
      const changed = captured || readyEpisodeGroups().length > beforeReady;
      if (downloadAsReady) {
        if (!changed) return false;
        const saveTask = downloadEpisodeImmediately(episode, streamDir, scanToken);
        if (fastScan) {
          logTask(`第 ${episode} 集已进入后台保存，快速切下一集`);
          saveTask.catch(err => {
            logTask(`第 ${episode} 集后台保存异常：${err && err.message ? err.message : err}`);
          });
          return true;
        }
        const saved = await saveTask;
        if (!saved) {
          logTask(`第 ${episode} 集保存失败，不切下一集`);
          if (options) options.haltOnIncompleteEpisode = episode;
        }
        return !!saved || activeDownloadedEpisodes.has(episode);
      }
      return changed || activeDownloadedEpisodes.has(episode);
    }

    let emptyStreak = 0;
    for (let i = 0; i < todo.length; i++) {
      if (scanAbort) break;

      const entry = todo[i];
      const changed = await captureOne(entry, `${i + 1}/${todo.length}`);
      const entryEpisode = Number(entry.episode) || extractEpisodeNo(entry.url) || 0;
      if (scanAbort) break;
      if (options && options.haltOnIncompleteEpisode) {
        logTask(`第 ${options.haltOnIncompleteEpisode} 集保存失败，已停止继续切集`);
        break;
      }
      if (changed) {
        got++;
        emptyStreak = 0;
        if (downloadAsReady && entryEpisode >= 3 && shouldForceFirstEpisodeRetry()) {
          const retryTask = retryFirstEpisodeUntilSaved(baseEpisodeUrl || entry.url, streamDir, '首集补漏触发');
          if (fastScan) {
            retryTask.catch(err => logTask(`首集后台补漏异常：${err && err.message ? err.message : err}`));
          } else {
            await retryTask;
            if (scanAbort) break;
          }
        }
        continue;
      }

      emptyStreak++;
      logTask(`批量抓取 · 第 ${entry.episode} 集没抓到资源，可能是锁集或站点限制`);
      if (emptyStreak >= 3) {
        if (!got && options) options.noVideoReason = NO_VIDEO_SKIP_REASON;
        logTask(`已连续 ${emptyStreak} 集抓不到资源，直接切换下一个链接`);
        break;
      }
    }
    if (!got && emptyStreak >= 3 && options) {
      options.noVideoReason = NO_VIDEO_SKIP_REASON;
      logTask(`无视频内容：${NO_VIDEO_SKIP_REASON}`);
    }
    render();
    return got;
  }

  async function prepareCurrentDramaForBatch(maxEpisodes, options) {
    let grabbed = 0;
    try { grabbed = await extractFromPageHtml(); } catch (e) { grabbed = 0; }
    if (grabbed >= 1 && readyEpisodeGroups().length) return readyEpisodeGroups().length;

    const prePlay = await safePlayerAction('play', 2200);
    await sleep(prePlay && prePlay.playing ? 3500 : 1200);
    render();

    const tpl = deriveEpisodeTemplate();
    if (tpl) {
      const inferred = await inferEpisodeRange();
      const start = 1;
      const end = inferred.inferred
        ? inferred.end
        : Math.max(Number(maxEpisodes) || 200, tpl.sampleEp || 1);
      const added = generateEpisodesFromTemplate(tpl, start, end);
      logTask(`按文件名规律补出第 ${start}-${end} 集，新增 ${added} 集`);
      return readyEpisodeGroups().length;
    }

    const gotByList = await collectEpisodeListForBatch(maxEpisodes, options);
    if (gotByList) return readyEpisodeGroups().length;

    return readyEpisodeGroups().length;
  }

  async function downloadListedEpisodes(dir, options) {
    const keepUiRunning = !!(options && options.keepUiRunning);
    const skipEpisodes = (options && options.skipEpisodes) || new Set();
    const appendLog = !!(options && options.appendLog);
    const groups = readyEpisodeGroups();
    if (!groups.length) {
      logTask('列表里还没有可下载的整集。请先点「获取全集」自动抓一遍，或手动播放几集。');
      setStatus('还没有可下载的整集，请先「获取全集」', 'error');
      return { ok: 0, failed: 0, total: 0, successEpisodes: [] };
    }
    if (!keepUiRunning) scanAbort = false;
    if (!keepUiRunning) setScanUi(true);
    let ok = 0, failed = 0;
    const successEpisodes = [];
    logTask(`开始下载列表里的 ${groups.length} 集到 ${dir}`, appendLog ? undefined : 'replace');
    try {
      for (const g of groups) {
        if (scanAbort) break;
        const ep = g.episodeNo;
        if (skipEpisodes.has(ep)) {
          logTask(`第 ${ep} 集已即时保存，跳过重复下载`);
          continue;
        }
        logTask(`第 ${ep} 集 · ${ok + failed + 1}/${groups.length} · 合成 ${outputFileForEpisode(g, ep)}`);
        try {
          await mergeEpisodeToDir(g, dir, ep, 3);
          ok++;
          successEpisodes.push(ep);
          activeDownloadedEpisodes.add(ep);
          logTask(`第 ${ep} 集已保存 · 累计成功 ${ok} 集`);
          await saveDramaSourceDocument(dir, { note: `第 ${ep} 集保存成功后自动更新` });
        } catch (err) {
          failed++;
          logTask(`第 ${ep} 集失败：${err && err.message ? err.message : err}`);
        }
      }
      logTask(scanAbort ? `已停止 · 成功 ${ok} · 失败 ${failed}` : `下载完成 · 成功 ${ok} 集 · 失败 ${failed} 集`);
      return { ok, failed, total: groups.length, successEpisodes };
    } finally {
      if (!keepUiRunning) setScanUi(false);
    }
  }

  async function downloadImportedLinks(rootDir, items, maxEpisodes) {
    if (!Array.isArray(items) || !items.length) {
      setStatus('导入列表为空', 'error');
      return { success: 0, failed: 0 };
    }

    lastBatchRootDir = rootDir;
    lastBatchMaxEpisodes = maxEpisodes;
    scanAbort = false;
    setScanUi(true);
    beginFolderBatchScope();
    let success = 0;
    let failed = 0;
    logTask(`批量下载开始 · 共 ${items.length} 部 · 总目录：${rootDir}`, 'replace');

    try {
      for (let i = 0; i < items.length; i++) {
        if (scanAbort) break;
        const item = items[i];
        activeSeriesTitle = item.title || '';
        const label = activeSeriesTitle || item.url;
        logTask(`第 ${i + 1}/${items.length} 部：${label}`);

        try {
          await clearCapturedResources();
          activeLinkDownloadDir = linkRunDownloadDir(rootDir, item.url, activeSeriesTitle);
          activeDownloadedEpisodes = new Set();
          backgroundJobs.clear();
          backgroundPromises = [];
          downloadingEpisodes.clear();
          logTask(`本条链接保存文件夹：${activeLinkDownloadDir}`);
          const startInfo = firstEpisodeUrlInfo(item.url);
          const scanStartUrl = startInfo.firstUrl || startInfo.inputUrl || item.url;
          setActiveSourceInfo({
            title: label,
            originalUrl: item.url,
            startUrl: scanStartUrl,
            importFile: importedFilePath || '',
            sheetName: item.source || '',
            row: item.row || '',
            column: item.column || '',
          });
          if (startInfo.changed) {
            logTask(`导入链接是第 ${startInfo.inputEpisode || '?'} 集，已先切到真正第 1 集：${scanStartUrl}`);
          }
          $('addressInput').value = scanStartUrl;
          const nav = await api.navigate(scanStartUrl);
          if (!nav || !nav.ok) throw new Error(nav && nav.error ? nav.error : '访问失败');
          await waitForPageIdle(12000);
          await sleep(1200);

          const batchOptions = {
            downloadAsReady: true,
            downloadDir: activeLinkDownloadDir,
            fastScan: isFastScanEnabled(),
          };
          const readyCount = await prepareCurrentDramaForBatch(maxEpisodes, batchOptions);
          if (batchOptions.haltOnIncompleteEpisode) {
            failed++;
            const reason = `第 ${batchOptions.haltOnIncompleteEpisode} 集保存失败，已停止继续切集`;
            recordBatchFailure(item, reason, { type: 'download-failed' });
            logTask(`第 ${i + 1} 部已暂停：${label} · ${reason}`);
            if (!activeDownloadedEpisodes.size) await cleanupEmptyLinkDir(activeLinkDownloadDir, rootDir, label);
            continue;
          }
          if (!readyCount && !activeDownloadedEpisodes.size) {
            failed++;
            const reason = batchOptions.noVideoReason || '没有抓到可下载的免费整集资源';
            recordBatchFailure(item, reason, { type: isNoVideoReason(reason) ? 'no-video' : 'download-failed', notice: isNoVideoReason(reason) });
            logTask(`第 ${i + 1} 部没有整理出可下载整集，已跳过：${label} · ${reason}`);
            if (!activeDownloadedEpisodes.size) await cleanupEmptyLinkDir(activeLinkDownloadDir, rootDir, label);
            continue;
          }

          logTask(`等待所有后台下载任务完成... 共 ${backgroundPromises.length} 个任务`);
          await Promise.all(backgroundPromises);
          if (scanAbort) {
            logTask('用户已停止，跳过补漏下载');
            if (!activeDownloadedEpisodes.size) await cleanupEmptyLinkDir(activeLinkDownloadDir, rootDir, label);
            break;
          }

          if (shouldForceFirstEpisodeRetry()) {
            await retryFirstEpisodeUntilSaved(scanStartUrl, activeLinkDownloadDir, '补漏前检测到首集缺失');
            if (scanAbort) break;
          }

          const allEpisodes = currentEpisodeGroups().filter(g => g.episodeNo && g.main && !g.incomplete).map(g => g.episodeNo);
          const missingEpisodes = allEpisodes.filter(ep => !activeDownloadedEpisodes.has(ep));
          if (missingEpisodes.length) {
            logTask(`发现 ${missingEpisodes.length} 集未成功下载，将重新补漏`);
            const result = await downloadListedEpisodes(activeLinkDownloadDir, {
              keepUiRunning: true,
              skipEpisodes: activeDownloadedEpisodes,
              appendLog: true,
            });
            if (result.ok) {
              logTask(`补漏下载完成，成功 ${result.ok} 集，失败 ${result.failed} 集`);
              for (const ep of result.successEpisodes) {
                activeDownloadedEpisodes.add(ep);
              }
            }
          }

          const savedTotal = activeDownloadedEpisodes.size;
          if (savedTotal > 0) {
            await saveDramaSourceDocument(activeLinkDownloadDir, { savedTotal, note: '本剧批量保存完成后自动更新' });
            success++;
            startAutoAnalyzeForDir(activeLinkDownloadDir, label);
            if (missingEpisodes.length) {
              logTask(`提醒：${label} 有 ${missingEpisodes.length} 集最终仍然失败，但已有 ${savedTotal} 集成功保存`);
            }
          } else {
            failed++;
            recordBatchFailure(item, '已识别到整集资源，但没有任何一集成功保存');
            await cleanupEmptyLinkDir(activeLinkDownloadDir, rootDir, label);
          }
        } catch (err) {
          failed++;
          const message = err && err.message ? err.message : String(err);
          recordBatchFailure(item, message);
          logTask(`第 ${i + 1} 部失败：${message}`);
          if (!activeDownloadedEpisodes.size) await cleanupEmptyLinkDir(activeLinkDownloadDir, rootDir, label);
        }
      }
    } finally {
      activeScanEpisodeNo = 0;
      scanAbort = false;
      setScanUi(false);
      logTask(`批量下载结束 · 成功处理 ${success} 部 · 失败 ${failed} 部`);
      if (failedBatchItems.length) {
        logTask(`失败清单已记录 ${failedBatchItems.length} 个链接，可点击「重试失败」重新处理`);
      }
      activeBatchFolderStamp = '';
      activeLinkFolderMap = new Map();
      activeLinkFolderPaths = new Set();
    }
    return { success, failed };
  }

  async function importLinksFile() {
    if (scanRunning) {
      await requestStop('正在停止当前批量任务…');
      return;
    }
    if (!api.selectLinkFile) {
      setStatus('当前版本不支持导入链接文件', 'error');
      return;
    }

    const res = await api.selectLinkFile();
    if (!res || !res.ok) {
      if (!res || !res.canceled) setStatus(res && res.error ? res.error : '导入失败', 'error');
      return;
    }
    importedLinks = Array.isArray(res.items) ? res.items : [];
    importedFilePath = res.filePath || '';
    clearBatchFailures();
    if (!importedLinks.length) {
      logTask('文件里没有识别到 http/https 链接', 'replace');
      setStatus('文件里没有识别到链接', 'error');
      return;
    }

    logTask(`已导入 ${importedLinks.length} 条剧集链接：${res.fileName || importedFilePath}`, 'replace');
    importedLinks.slice(0, 5).forEach((item, idx) => {
      logTask(`${idx + 1}. ${item.title || '未命名剧'} · ${item.url}`);
    });
    if (importedLinks.length > 5) logTask(`还有 ${importedLinks.length - 5} 条未展示，将按顺序处理`);

    const rootDir = await ensureDownloadDir();
    if (!rootDir) {
      setStatus('已取消：没有选择总保存目录', 'error');
      return;
    }

    const maxText = await askInput(
      '批量导入会按文件里的链接逐部访问并下载。\n' +
      '如果某个网页识别不到总集数，最多尝试多少集？\n' +
      '建议填 200；能识别总集数的站点会自动按真实总集数处理。',
      '200'
    );
    if (maxText == null) {
      setStatus('已取消批量下载');
      return;
    }
    const maxEpisodes = Math.min(Math.max(parseInt(maxText, 10) || 200, 1), 1000);
    const ok = window.confirm(
      '将开始批量下载：\n' +
      `文件：${res.fileName || importedFilePath}\n` +
      `链接数：${importedLinks.length}\n` +
      `总保存目录：${rootDir}\n\n` +
      '每部剧会自动创建一个剧名文件夹，完整一部剧放进同一个文件夹。确定开始？'
    );
    if (!ok) {
      setStatus('已取消批量下载');
      return;
    }

    await downloadImportedLinks(rootDir, importedLinks, maxEpisodes);
  }

  async function retryFailedLinks() {
    if (scanRunning) {
      await requestStop('正在停止当前批量任务…');
      return;
    }
    if (!failedBatchItems.length) {
      setStatus('没有失败链接可重试');
      return;
    }
    const rootDir = lastBatchRootDir || await ensureDownloadDir();
    if (!rootDir) {
      setStatus('已取消：没有选择总保存目录', 'error');
      return;
    }
    const retryItems = failedBatchItems.map(item => ({ ...item }));
    const detail = retryItems
      .slice(0, 8)
      .map((item, idx) => `${idx + 1}. ${item.title || '未命名剧'}\n   ${item.reason || ''}\n   ${item.url}`)
      .join('\n');
    const ok = window.confirm(
      `准备重试 ${retryItems.length} 个失败链接：\n\n${detail}` +
      (retryItems.length > 8 ? `\n...还有 ${retryItems.length - 8} 个` : '') +
      `\n\n总保存目录：${rootDir}\n确定重试？`
    );
    if (!ok) return;
    clearBatchFailures();
    await downloadImportedLinks(rootDir, retryItems, lastBatchMaxEpisodes || 200);
  }

      setStatus('请先选择总保存目录，之后手动访问链接会自动保存', 'error');
      return;
    }

    setScanUi(true);
    logTask(`手动链接自动保存：${url}`, 'replace');
    try {
      activeLinkDownloadDir = linkRunDownloadDir(downloadDir, url, activeSeriesTitle);
      activeDownloadedEpisodes = new Set();
      backgroundJobs.clear();
      backgroundPromises = [];
      downloadingEpisodes.clear();

      const startInfo = firstEpisodeUrlInfo(url);
      const originalInputUrl = startInfo.inputUrl;
      const startUrl = startInfo.firstUrl || originalInputUrl;

        await clearCapturedResources();
        $('addressInput').value = startUrl;
        const nav = await api.navigate(startUrl);
        if (!nav || !nav.ok) {
          logTask('切到第 1 集失败：' + (nav && nav.error ? nav.error : '访问失败') + '，继续尝试当前页面');
        }
      }

      // 确保第 1 集被尝试抓取
      const fastScan = isFastScanEnabled();
      await ensureFirstEpisode(startUrl, activeLinkDownloadDir, { fastScan });

      logTask('正在自动获取全集资源并准备下载…');
      const batchOptions = {
        downloadAsReady: true,
        downloadDir: activeLinkDownloadDir,
        fastScan,
      };
      const readyCount = await prepareCurrentDramaForBatch(lastBatchMaxEpisodes || 200, batchOptions);
      if (scanAbort) return;
      if (batchOptions.haltOnIncompleteEpisode) {
        const reason = `第 ${batchOptions.haltOnIncompleteEpisode} 集保存失败，已停止继续切集`;

          type: 'download-failed',

        logTask(reason);
        setStatus(reason, 'error');
