/* =====================================================
 *  导入 / 导出
 *  - 导入: .txt / .md / .markdown / .docx  →  原文 textarea
 *  - 导出: .txt / .md / .docx / .html      ←  改后 #outputText
 *
 *  说明:
 *  - JSZip 和 mammoth 都按需从 jsDelivr 加载,首次点击有一两秒延迟
 *  - .docx 是浏览器端手工拼装的 OOXML 包,中文完全没问题
 * ===================================================== */

const IO_CDN = {
  jszip:   'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js',
};

function _loadScriptOnce(url) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-io-src="' + url + '"]');
    if (existing) {
      if (existing.dataset.loaded === '1') return resolve();
      existing.addEventListener('load',  () => resolve(), { once: true });
      existing.addEventListener('error', () => reject(new Error('脚本加载失败: ' + url)), { once: true });
      return;
    }
    const s = document.createElement('script');
    s.src = url;
    s.setAttribute('data-io-src', url);
    s.onload  = () => { s.dataset.loaded = '1'; resolve(); };
    s.onerror = () => reject(new Error('脚本加载失败: ' + url));
    document.head.appendChild(s);
  });
}

async function _ensureJSZip() {
  if (window.JSZip) return window.JSZip;
  await _loadScriptOnce(IO_CDN.jszip);
  for (let i = 0; i < 80 && !window.JSZip; i++) await new Promise(r => setTimeout(r, 40));
  if (!window.JSZip) throw new Error('JSZip 未就绪,请检查网络');
  return window.JSZip;
}

async function _ensureMammoth() {
  if (window.mammoth) return window.mammoth;
  await _loadScriptOnce(IO_CDN.mammoth);
  for (let i = 0; i < 80 && !window.mammoth; i++) await new Promise(r => setTimeout(r, 40));
  if (!window.mammoth) throw new Error('mammoth 未就绪,请检查网络');
  return window.mammoth;
}

function _downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 120);
}

function _ts() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate())
       + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

function _xmlEscape(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

/* 从右侧输出区拿到「干净的纯文本」:剔除思考折叠块/光标/按钮等 UI 节点 */
function _getOutputText() {
  const el = document.getElementById('outputText');
  if (!el) return '';
  const clone = el.cloneNode(true);
  clone.querySelectorAll(
    '.caret, .think, .think-wrap, .think-block, [class*="think"], button, .next-step-action'
  ).forEach(n => n.remove());
  // 输出区本身 white-space:pre-wrap,textContent 已经保留了 \n
  return (clone.textContent || '').replace(/\u00a0/g, ' ');
}

/* 拿用户在「改后」面板里框选的文本(只取与 #outputText 有交集的部分),
 * 并且剔除其中的思考块 / 光标 / 按钮等 UI 节点 —— 与全量导出口径一致 */
function _getSelectionTextInsideOutput() {
  const sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return '';
  const out = document.getElementById('outputText');
  if (!out) return '';

  const parts = [];
  for (let i = 0; i < sel.rangeCount; i++) {
    const range = sel.getRangeAt(i);
    // 选区与 outputText 完全不相交 → 跳过
    // 用 intersectsNode 做粗筛(IE 之后所有浏览器都支持)
    if (range.intersectsNode && !range.intersectsNode(out)) continue;

    // 把选区裁剪到 outputText 范围内
    const clipped = range.cloneRange();
    // 起点若在 out 之外 → 拉到 out 开头
    if (!out.contains(clipped.startContainer)) {
      clipped.setStart(out, 0);
    }
    // 终点若在 out 之外 → 拉到 out 末尾
    if (!out.contains(clipped.endContainer)) {
      clipped.setEnd(out, out.childNodes.length);
    }

    let frag;
    try { frag = clipped.cloneContents(); }
    catch { continue; }
    const wrap = document.createElement('div');
    wrap.appendChild(frag);
    wrap.querySelectorAll(
      '.caret, .think, .think-wrap, .think-block, [class*="think"], button, .next-step-action'
    ).forEach(n => n.remove());
    parts.push((wrap.textContent || '').replace(/\u00a0/g, ' '));
  }
  return parts.join('');
}

/* 导出菜单当前的范围状态:
 *   scope = 'all' | 'selection'
 *   selectionText:   打开菜单时一次性快照的选区文本(避免菜单打开后选区被清掉)
 *   selectionSource: 'output' | 'input' | null —— 选区从哪个面板来
 *   fullText:        打开菜单时一次性快照的全量文本(始终是改后)
 */
const _exportState = { scope: 'all', selectionText: '', selectionSource: null, fullText: '' };

/* 持续追踪的最近一次"有意义"选区(随 selectionchange / 鼠标键盘事件刷新)。
 * 这是兜底:某些浏览器在用户点导出按钮的瞬间会把 window.getSelection() 清空,
 * 这时如果只在 click 里抓就晚了。我们提前一步追踪好,菜单打开时直接读。 */
let _trackedSel = null;  // { text: string, source: 'output'|'input' } 或 null

function _refreshTrackedSelection() {
  // 改后区(div)优先
  const outTxt = _getSelectionTextInsideOutput();
  if (outTxt.trim()) {
    _trackedSel = { text: outTxt, source: 'output' };
    _updateExportBtnIndicator();
    return;
  }
  // 原文区(textarea)
  const inTxt = _getSelectionTextInsideInput();
  if (inTxt.trim()) {
    _trackedSel = { text: inTxt, source: 'input' };
    _updateExportBtnIndicator();
    return;
  }
  // 两边都没选了 —— 默认就该清掉,按钮变回灰色。
  // 唯一例外:导出菜单当前正打开,这时保留 _trackedSel 以免菜单里的
  // "仅导出选中" 行突然消失看起来抖动 —— _exportState 在 mousedown
  // 那一刻已经独立快照过了,所以即便 _trackedSel 被清也不影响功能。
  const menu = document.getElementById('exportMenu');
  if (menu && menu.classList.contains('show')) return;

  _trackedSel = null;
  _updateExportBtnIndicator();
}

function _updateExportBtnIndicator() {
  const btn = document.getElementById('exportBtn');
  if (!btn) return;
  if (_trackedSel && _trackedSel.text.trim()) {
    btn.classList.add('has-selection');
    const src = _trackedSel.source === 'input' ? '原文' : '改后';
    btn.title = `检测到 ${_trackedSel.text.length} 字${src}选区 · 点开可单独导出`;
  } else {
    btn.classList.remove('has-selection');
    btn.title = '把改后的内容导出为文件';
  }
}

/* 抓取「原文」textarea 里的选区(focus 在不在它身上都行,selectionStart/End 会保留) */
function _getSelectionTextInsideInput() {
  const ta = document.getElementById('inputText');
  if (!ta || typeof ta.selectionStart !== 'number') return '';
  if (ta.selectionStart === ta.selectionEnd) return '';
  return ta.value.substring(ta.selectionStart, ta.selectionEnd);
}

/* 打开菜单时调用:抓取一次选区 + 全量文本,刷新菜单上的"导出范围"开关 */
function _prepareExportMenu() {
  const fullText = _getOutputText();

  // 1. 先尝试 live 选区(此刻 window.getSelection / textarea.selectionStart)
  let selText = _getSelectionTextInsideOutput();
  let selSource = selText.trim() ? 'output' : null;
  if (!selSource) {
    const inputSel = _getSelectionTextInsideInput();
    if (inputSel.trim()) {
      selText = inputSel;
      selSource = 'input';
    }
  }
  // 2. live 没抓到 —— 用 selectionchange 追踪过的兜底
  //    (有些浏览器在点 button 那一刻会把 window.getSelection 清掉,这里救回来)
  if (!selSource && _trackedSel && _trackedSel.text.trim()) {
    selText = _trackedSel.text;
    selSource = _trackedSel.source;
  }

  _exportState.selectionText   = selText;
  _exportState.selectionSource = selSource;
  _exportState.fullText        = fullText;

  const section = document.getElementById('exportScopeSection');

  // 选区与全量长度几乎一样,等于 Ctrl+A 选了全部 → 弹这俩开关没意义(只对 output 检查)
  const meaningful =
    selSource &&
    selText.trim().length > 0 &&
    (selSource !== 'output' || selText.length < fullText.length);

  if (meaningful) {
    _exportState.scope = 'selection';
    section.style.display = '';

    // 顶部分节标题 —— 直接把选区字数和来源写清楚,用户不用猜
    const hintEl = document.getElementById('exportScopeHint');
    if (hintEl) {
      hintEl.textContent = selSource === 'input'
        ? `检测到选中 ${selText.length} 字 · 来自原文`
        : `检测到选中 ${selText.length} 字`;
    }

    // 标签和右边的「全部」标签都根据来源做点说明,让用户一眼看清现在要导出的是哪边
    const selLabel = document.getElementById('exportScopeSelLabel');
    const allLabel = document.getElementById('exportScopeAllLabel');
    if (selSource === 'input') {
      selLabel.textContent = '仅导出选中 · 原文';
      allLabel.textContent = '导出全部 · 改后';
    } else {
      selLabel.textContent = '仅导出选中';
      allLabel.textContent = '导出全部';
    }

    document.getElementById('exportScopeSelCount').textContent = selText.length + ' 字';
    document.getElementById('exportScopeAllCount').textContent = fullText.length + ' 字';
  } else {
    _exportState.scope = 'all';
    section.style.display = 'none';
  }
  _updateExportScopeUI();
}

/* 把"哪个 radio 当前选中"反映到菜单 DOM 上(active class) */
function _updateExportScopeUI() {
  const menu = document.getElementById('exportMenu');
  if (!menu) return;
  menu.querySelectorAll('.io-menu-radio').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-scope') === _exportState.scope);
  });
}

/* ---------- 导出 ---------- */

async function exportRevised(fmt) {
  // 用打开菜单时快照的文本,而不是这一刻再去摸 DOM —— 那时选区可能已经被清掉
  const isSel = _exportState.scope === 'selection' && _exportState.selectionText;
  const text = (isSel ? _exportState.selectionText : _exportState.fullText || _getOutputText())
                .replace(/\s+$/,'');
  if (!text.trim()) {
    toast(isSel ? '所选内容是空的,无法导出' : '改后区还没有内容,无法导出', 'error');
    return;
  }
  // 文件名前缀:看是不是选区导出 + 选区来自哪边
  //   全量导出 → 改后-…
  //   选区(改后) → 改后-选中-…
  //   选区(原文) → 原文-选中-…
  let prefix = '改后';
  if (isSel) {
    prefix = (_exportState.selectionSource === 'input' ? '原文-选中' : '改后-选中');
  }
  const base = prefix + '-' + _ts();
  try {
    if (fmt === 'txt') {
      _downloadBlob(new Blob([text], { type: 'text/plain;charset=utf-8' }), base + '.txt');
      toast('已导出 ' + base + '.txt');
    } else if (fmt === 'md') {
      _downloadBlob(new Blob([text], { type: 'text/markdown;charset=utf-8' }), base + '.md');
      toast('已导出 ' + base + '.md');
    } else if (fmt === 'html') {
      _downloadBlob(new Blob([_wrapHtml(text)], { type: 'text/html;charset=utf-8' }), base + '.html');
      toast('已导出 ' + base + '.html');
    } else if (fmt === 'docx') {
      toast('正在生成 Word 文档…');
      const blob = await _buildDocx(text);
      _downloadBlob(blob, base + '.docx');
      toast('已导出 ' + base + '.docx');
    } else {
      toast('未知导出格式: ' + fmt, 'error');
    }
  } catch (err) {
    console.error('[export]', err);
    toast('导出失败: ' + (err && err.message ? err.message : err), 'error');
  }
}

function _wrapHtml(text) {
  // 双换行分段,单换行变 <br>
  const paragraphs = text.split(/\r?\n\r?\n+/).map(p => {
    const inner = _xmlEscape(p).replace(/\r?\n/g, '<br/>');
    return '<p>' + inner + '</p>';
  }).join('\n');
  return '<!doctype html>\n'
       + '<html lang="zh-CN">\n'
       + '<head>\n'
       + '<meta charset="utf-8" />\n'
       + '<title>改后</title>\n'
       + '<style>\n'
       + '  body { max-width: 760px; margin: 48px auto; padding: 0 24px;\n'
       + '         font-family: "Songti SC","Source Han Serif SC","Noto Serif SC","SimSun",serif;\n'
       + '         font-size: 16px; line-height: 1.85; color: #1f1c17; background:#f4efe4; }\n'
       + '  p { margin: 0 0 1em; text-indent: 2em; }\n'
       + '</style>\n'
       + '</head>\n'
       + '<body>\n'
       + paragraphs + '\n'
       + '</body>\n'
       + '</html>';
}

/* 手工拼一个最小但合规的 .docx 包,中文友好(UTF-8 XML),Word/WPS/Pages 都能打开 */
async function _buildDocx(text) {
  const JSZip = await _ensureJSZip();
  const zip = new JSZip();

  const contentTypes =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>';

  const rootRels =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';

  const docRels =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';

  // 默认正文 11pt,行距 1.5,中文用宋体
  const styles =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:docDefaults>' +
        '<w:rPrDefault><w:rPr>' +
          '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="宋体" w:cs="Calibri"/>' +
          '<w:sz w:val="22"/><w:szCs w:val="22"/>' +
          '<w:lang w:val="en-US" w:eastAsia="zh-CN" w:bidi="ar-SA"/>' +
        '</w:rPr></w:rPrDefault>' +
        '<w:pPrDefault><w:pPr>' +
          '<w:spacing w:line="360" w:lineRule="auto"/>' +
        '</w:pPr></w:pPrDefault>' +
      '</w:docDefaults>' +
    '</w:styles>';

  // 文本 → 段落: 按 \n 拆,空行保留为空段
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const paragraphs = lines.map(line => {
    if (line === '') return '<w:p/>';
    return '<w:p><w:r><w:t xml:space="preserve">' + _xmlEscape(line) + '</w:t></w:r></w:p>';
  }).join('');

  const documentXml =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      '<w:body>' +
        paragraphs +
        '<w:sectPr>' +
          '<w:pgSz w:w="11906" w:h="16838"/>' +
          '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="851" w:footer="992" w:gutter="0"/>' +
        '</w:sectPr>' +
      '</w:body>' +
    '</w:document>';

  zip.file('[Content_Types].xml', contentTypes);
  zip.folder('_rels').file('.rels', rootRels);
  const w = zip.folder('word');
  w.file('document.xml', documentXml);
  w.file('styles.xml', styles);
  w.folder('_rels').file('document.xml.rels', docRels);

  return await zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    compression: 'DEFLATE',
  });
}

/* ---------- 导入 ---------- */

async function handleImportFile(file) {
  if (!file) return;
  const name  = file.name || '未命名文件';
  const lower = name.toLowerCase();
  const importBtn = $('importBtn');
  if (importBtn) importBtn.disabled = true;

  try {
    let content = '';

    if (lower.endsWith('.docx')) {
      toast('正在解析 Word 文档…');
      const mammoth = await _ensureMammoth();
      const buf = await file.arrayBuffer();
      const res = await mammoth.extractRawText({ arrayBuffer: buf });
      content = res && res.value ? res.value : '';
    } else if (lower.endsWith('.doc')) {
      toast('老版 .doc 不支持,请在 Word 里另存为 .docx 后再导入', 'error');
      return;
    } else if (
      lower.endsWith('.txt') || lower.endsWith('.md') || lower.endsWith('.markdown') ||
      file.type === 'text/plain' || file.type === 'text/markdown' || file.type === '' ||
      !/\.[a-z0-9]+$/i.test(lower)
    ) {
      content = await file.text();
    } else {
      // 兜底:尽量当文本读
      content = await file.text();
    }

    if (!content || !content.trim()) {
      toast('「' + name + '」里没读到任何文字', 'error');
      return;
    }

    // (已移除:之前会把超过 10 万字符的内容截断,现在前端不再设上限,全量导入。)

    const ta = $('inputText');
    ta.value = content;
    // 触发已有 input 监听器,同步字数 / 风格信息
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    // 滚到顶部,方便用户从头检查
    ta.scrollTop = 0;

    toast('已导入「' + name + '」');
  } catch (err) {
    console.error('[import]', err);
    toast('导入失败: ' + (err && err.message ? err.message : err), 'error');
  } finally {
    if (importBtn) importBtn.disabled = false;
  }
}

/* =====================================================
 *  历史记录 (本地浏览器持久化)
 *  - 每次"开始改文"或"继续"成功完成时,以 session.t0 为主键 upsert 一条
 *  - 存在 localStorage['nr_history'] (数组,新→旧)
 *  - 配额满了自动从最旧的开始挤掉重试
 *  - UI: 历史 modal(列表 + 还原 + 删除 + 导入/导出备份 + 清空)
 * ===================================================== */

const HISTORY_LS_KEY = 'nr_history';
const HISTORY_MAX_ITEMS = 100;     // 软上限,实际由 quota 决定
const HISTORY_TITLE_MAX = 32;

function _historyLoad() {
  try {
    const raw = localStorage.getItem(HISTORY_LS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    console.warn('[history] load failed', e);
    return [];
  }
}

/** 把数组写回 localStorage,Quota 超了就从最旧的开始扔再试 */
function _historyPersist(arr) {
  // 先按软上限截断
  if (arr.length > HISTORY_MAX_ITEMS) arr.length = HISTORY_MAX_ITEMS;
  let evicted = 0;
  for (let attempt = 0; attempt < 20; attempt++) {
    try {
      localStorage.setItem(HISTORY_LS_KEY, JSON.stringify(arr));
      return { ok: true, evicted };
    } catch (e) {
      // 多半是 QuotaExceededError —— 把最旧的踢掉再试
      if (arr.length <= 1) {
        console.warn('[history] quota exceeded even with 1 item');
        return { ok: false, evicted };
      }
      arr.pop();          // 数组是 新→旧,pop 掉最旧的
      evicted++;
    }
  }
  return { ok: false, evicted };
}

function _historyMakeTitle(originalText) {
  const firstLine = (originalText || '').replace(/\r\n/g, '\n').split('\n').find(l => l.trim()) || '';
  const compact = firstLine.replace(/\s+/g, ' ').trim();
  if (!compact) return '(空标题)';
  if (compact.length <= HISTORY_TITLE_MAX) return compact;
  return compact.slice(0, HISTORY_TITLE_MAX) + '…';
}

function _fmtTs(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function _backupHistoryEntryToDisk(entry) {
  try {
    if (window.gaiwenDesktop && window.gaiwenDesktop.backupHistoryEntry) {
      window.gaiwenDesktop.backupHistoryEntry(entry).catch(err => {
        console.warn('[history] disk backup failed', err);
      });
    }
  } catch (err) {
    console.warn('[history] disk backup bridge failed', err);
  }
}

/** 完成一轮后调用:把当前 session + 两个面板的内容存进历史(按 t0 upsert) */
function _saveCurrentSessionToHistory() {
  if (!session || !session.t0) return;        // 没有正在跑的 session,跳过
  const original = (session.baseContent || $('inputText').value || '').trim();
  const revised  = _getOutputText().trim();
  if (!original && !revised) return;          // 两边都空,没意义

  const arr = _historyLoad();
  const id = session.t0;
  const now = Date.now();
  // 看看有没有同 t0 的旧条目
  const idx = arr.findIndex(it => it && it.id === id);
  const prevRounds = idx >= 0 ? (arr[idx].rounds || 1) : 0;

  const entry = {
    id,
    ts: id,                       // 会话创建时间
    updatedTs: now,               // 最近一次完成时间
    rounds: prevRounds + 1,
    title: _historyMakeTitle(original),
    original,
    revised,
    modelName: (typeof ROUTER_MODEL_NAME !== 'undefined' ? ROUTER_MODEL_NAME : ''),
    points: session.totalPointsCost || 0,
    durationMs: now - session.t0,
    phase: session.phase || 'edit',
    scriptSnapshot: session.scriptSnapshot || revised,
    editLog: Array.isArray(session.editLog) ? session.editLog.slice(-30) : [],
    lastRouterOutput: session.lastRouterOutput || revised,
    routerContent: session.routerContent || '',
    userConversation: session.userConversation || '',
  };

  if (idx >= 0) arr.splice(idx, 1);           // 先把旧的拿掉,稍后插到最前
  arr.unshift(entry);                          // 新→旧顺序,刚更新的排最前

  const res = _historyPersist(arr);
  if (!res.ok) {
    console.warn('[history] save failed');
    return;
  }
  if (res.evicted > 0) {
    toast(`本地空间已满,自动清理了 ${res.evicted} 条最旧的历史`);
  }
  _backupHistoryEntryToDisk(entry);
  // 若历史 modal 当前正打开,实时刷新
  const hm = document.getElementById('historyModal');
  if (hm && hm.classList.contains('show')) renderHistoryList();
}

/* ---------- 渲染历史列表 ---------- */

function renderHistoryList() {
  const list = $('historyList');
  const countEl = $('historyCount');
  const arr = _historyLoad();
  countEl.textContent = arr.length + ' 条';

  if (arr.length === 0) {
    list.innerHTML = '<div class="history-list-empty">还没有历史记录<br/>改完文后会自动留底在这里</div>';
    return;
  }

  // 用 DOM 拼,避免 XSS
  list.innerHTML = '';
  arr.forEach(it => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.setAttribute('role', 'button');
    item.tabIndex = 0;
    item.dataset.id = String(it.id);

    const head = document.createElement('div');
    head.className = 'history-item-head';
    const title = document.createElement('div');
    title.className = 'history-item-title';
    title.textContent = it.title || '(无标题)';
    const meta = document.createElement('div');
    meta.className = 'history-item-meta';
    const revLen = (it.revised || '').length;
    const roundTag = (it.rounds && it.rounds > 1) ? ` · ${it.rounds} 轮` : '';
    const pointsTag = it.points ? ` · ${it.points} 分` : '';
    meta.textContent = `${_fmtTs(it.updatedTs || it.ts)} · ${revLen} 字${roundTag}${pointsTag}`;
    head.appendChild(title);
    head.appendChild(meta);

    const preview = document.createElement('div');
    preview.className = 'history-item-preview';
    const previewText = (it.revised || it.original || '').replace(/\s+/g, ' ').slice(0, 160);
    preview.textContent = previewText;

    const actions = document.createElement('div');
    actions.className = 'history-item-actions';

    const restoreBtn = document.createElement('button');
    restoreBtn.type = 'button';
    restoreBtn.className = 'history-action-btn';
    restoreBtn.title = '还原到工作区';
    restoreBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>';

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'history-action-btn';
    delBtn.title = '删除这一条';
    delBtn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

    actions.appendChild(restoreBtn);
    actions.appendChild(delBtn);

    item.appendChild(head);
    item.appendChild(preview);
    item.appendChild(actions);

    // 点条目正文(非按钮区)= 还原
    item.addEventListener('click', e => {
      if (e.target.closest('.history-action-btn')) return;
      restoreHistoryEntry(it.id);
    });
    item.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        restoreHistoryEntry(it.id);
      }
    });
    restoreBtn.addEventListener('click', e => { e.stopPropagation(); restoreHistoryEntry(it.id); });
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('删除这一条历史?\n\n「' + (it.title || '无标题') + '」')) return;
      deleteHistoryEntry(it.id);
    });

    list.appendChild(item);
  });
}

/* ---------- 还原/删除/清空 ---------- */

function restoreHistoryEntry(id) {
  const arr = _historyLoad();
  const it = arr.find(x => x && x.id === id);
  if (!it) { toast('找不到这条历史(可能已被删除)', 'error'); return; }

  // 若正在流式生成,先打断,避免覆盖正在跑的内容
  if (typeof currentAbort !== 'undefined' && currentAbort) {
    if (!confirm('当前还有改写在跑,确定要中止并还原?')) return;
    try { currentAbort.abort(); } catch {}
  }

  // 把面板填回去
  const ta = $('inputText');
  ta.value = it.original || '';
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  ta.scrollTop = 0;

  // 输出区:用纯文本节点呈现,保持原有 white-space:pre-wrap 的渲染逻辑
  const out = $('outputText');
  out.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = it.revised || '';
  out.appendChild(span);
  $('outputCount').textContent = (it.revised || '').length + ' 字';

  // 还原为可继续编辑的 session。旧历史没有 scriptSnapshot 时,用 revised 兜底,
  // 至少能围绕当前改后稿继续提修改要求。
  const restoredScript = it.scriptSnapshot || it.revised || '';
  const restoredEditLog = Array.isArray(it.editLog) ? it.editLog.slice() : [];
  const restoredLast = (it.lastRouterOutput || it.revised || '').trim();
  if (restoredLast && !restoredEditLog.some(x => x && x.role === 'assistant' && x.text === restoredLast)) {
    restoredEditLog.push({ role: 'assistant', text: restoredLast });
  }
  const restoredRouterContent = buildHistoryResumeRequest(it, restoredScript, restoredEditLog);
  session = {
    baseContent: it.original || '',
    routerContent: restoredRouterContent,
    userConversation: it.userConversation || restoredRouterContent,
    loadedIds: new Set(),
    totalLoads: 0,
    lastExecutedId: null,
    t0: it.id || Date.now(),
    totalPointsCost: it.points || 0,
    finalBalance: null,
    lastRouterOutput: it.lastRouterOutput || it.revised || '',
    stallNudges: 0,
    autoSteps: 0,
    lastAutoOutput: '',
    phase: 'edit',
    scriptSnapshot: restoredScript,
    scriptBuf: '',
    capturing: false,
    editLog: restoredEditLog,
    stageIdx: -1,
  };

  if (typeof removeReplyBox === 'function')      removeReplyBox();
  if (typeof removeNextStepPanel === 'function') removeNextStepPanel();
  showReplyBox({ forceVisible: true });
  $('goBtn').disabled = false;
  $('stopBtn').classList.remove('show');

  setStatus('已还原历史', 'done', '共 ' + (it.revised || '').length + ' 字 · 在下方输入修改要求继续,不要点开始改文');
  closeHistoryModal();
  toast('已还原「' + (it.title || '无标题') + '」');
}

function deleteHistoryEntry(id) {
  const arr = _historyLoad();
  const next = arr.filter(x => x && x.id !== id);
  _historyPersist(next);
  renderHistoryList();
  toast('已删除');
}

function clearAllHistory() {
  const arr = _historyLoad();
  if (arr.length === 0) { toast('历史已经是空的'); return; }
  if (!confirm('确定要清空全部 ' + arr.length + ' 条历史吗?\n\n此操作不可恢复(建议先点"导出备份")。')) return;
  localStorage.removeItem(HISTORY_LS_KEY);
  renderHistoryList();
  toast('已清空全部历史');
}

/* ---------- JSON 备份导入/导出 ---------- */

function exportHistoryJson() {
  const arr = _historyLoad();
  if (arr.length === 0) { toast('历史是空的,没东西可导出', 'error'); return; }
  const payload = {
    app: 'gaiwen',
    type: 'history-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    count: arr.length,
    items: arr,
  };
  const json = JSON.stringify(payload, null, 2);
  _downloadBlob(new Blob([json], { type: 'application/json;charset=utf-8' }),
                '改文历史-' + _ts() + '.json');
  toast('已导出 ' + arr.length + ' 条历史');
}

async function importHistoryJsonFromFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    let items = [];
    let shouldRestoreSingle = false;
    if (Array.isArray(data)) {
      // 兜底:有人直接拿数组喂进来
      items = data;
    } else if (data && Array.isArray(data.items)) {
      items = data.items;
    } else if (data && typeof data === 'object' && (data.original || data.revised || data.scriptSnapshot || data.routerContent || data.userConversation)) {
      // 单个历史文件夹里的 history.json
      items = [data];
      shouldRestoreSingle = true;
    } else {
      toast('文件格式不对,请选择 全部历史索引.json 或单条 history.json', 'error');
      return;
    }
    // 基本结构校验,过滤掉脏数据
    items = items.filter(it => it && typeof it === 'object' && (it.original || it.revised || it.scriptSnapshot || it.routerContent || it.userConversation));

    if (items.length === 0) { toast('备份里没有有效条目', 'error'); return; }

    const cur = _historyLoad();
    // 按 id 合并,导入条目的 updatedTs 更新就覆盖
    const map = new Map();
    cur.forEach(it => { if (it && it.id != null) map.set(it.id, it); });
    let added = 0, updated = 0;
    items.forEach(it => {
      // 缺 id 就用 ts/Date.now 顶一个
      if (it.id == null) it.id = it.ts || Date.now() + Math.floor(Math.random()*1000);
      if (it.ts == null) it.ts = it.id;
      if (it.updatedTs == null) it.updatedTs = it.ts || Date.now();
      if (!it.title) it.title = _historyMakeTitle(it.original || it.revised || it.scriptSnapshot || '');
      if (!it.revised && it.scriptSnapshot) it.revised = it.scriptSnapshot;
      if (map.has(it.id)) {
        const old = map.get(it.id);
        if ((it.updatedTs || 0) >= (old.updatedTs || 0)) {
          map.set(it.id, it);
          updated++;
        }
      } else {
        map.set(it.id, it);
        added++;
      }
    });
    // 重新按 updatedTs 倒序
    const merged = Array.from(map.values()).sort((a, b) =>
      (b.updatedTs || b.ts || 0) - (a.updatedTs || a.ts || 0)
    );
    const res = _historyPersist(merged);
    renderHistoryList();
    if (res.ok) {
      if (shouldRestoreSingle && items.length === 1) {
        restoreHistoryEntry(items[0].id);
      } else {
        toast(`已导入 · 新增 ${added} 条 · 更新 ${updated} 条`);
      }
    } else {
      toast('部分导入成功,但本地空间满了,有条目被丢弃', 'error');
    }
  } catch (err) {
    console.error('[history import]', err);
    toast('导入失败: ' + (err && err.message ? err.message : err), 'error');
  }
}

/* ---------- modal 开关 ---------- */

function openHistoryModal() {
  renderHistoryList();
  $('historyModal').classList.add('show');
}
function closeHistoryModal() {
  $('historyModal').classList.remove('show');
}

/* =====================================================
 *  事件绑定
 * ===================================================== */
function bindEvents() {
  // 登录
  $('loginBtn').addEventListener('click', doLogin);
  ['loginUser','loginPass'].forEach(id =>
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
  );

  // 主功能
  $('goBtn').addEventListener('click', startRewrite);
  $('stopBtn').addEventListener('click', stopRewrite);
  $('newSessionBtn').addEventListener('click', newSession);

  // 原大纲保护开关:点哪段切哪个模式;启动时按持久化的选择回显
  syncOutlineToggleUI();
  ['outlineKeepBtn', 'outlineRebuildBtn'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.addEventListener('click', () => setOutlineMode(btn.dataset.mode));
  });

  // 输入字数统计
  $('inputText').addEventListener('input', () => {
    $('inputCount').textContent = $('inputText').value.length + ' 字';
    updateStyleInfo();
  });

  // ---------- 导入 ----------
  const importBtn   = $('importBtn');
  const importInput = $('importFileInput');
  if (importBtn && importInput) {
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      handleImportFile(f);
      // 重置 value,这样同一个文件还能再次导入(否则 change 不会触发)
      e.target.value = '';
    });
  }

  // ---------- 导出 ----------
  const exportBtn  = $('exportBtn');
  const exportMenu = $('exportMenu');
  if (exportBtn && exportMenu) {
    // 关键修复:在 mousedown 这一刻就把选区快照下来。
    // 某些浏览器在点 <button> 的瞬间会把 window.getSelection 清空,
    // 等到 click 事件触发时已经晚了 —— 所以必须用 mousedown 抢一步。
    // 键盘 Enter/Space 激活按钮不会走 mousedown,所以 click 里也保留一道兜底。
    let _preparedByMousedown = false;
    exportBtn.addEventListener('mousedown', () => {
      if (!exportMenu.classList.contains('show')) {
        try { _prepareExportMenu(); _preparedByMousedown = true; }
        catch (err) { console.warn('[export] prepare on mousedown failed', err); }
      }
    });
    exportBtn.addEventListener('click', e => {
      e.stopPropagation();
      const willShow = !exportMenu.classList.contains('show');
      if (willShow && !_preparedByMousedown) {
        // 键盘触发(Tab + Enter) —— mousedown 没跑,这里补一刀
        try { _prepareExportMenu(); }
        catch (err) { console.warn('[export] prepare on click failed', err); }
      }
      _preparedByMousedown = false;
      exportMenu.classList.toggle('show', willShow);
      exportBtn.setAttribute('aria-expanded', willShow ? 'true' : 'false');
    });
    // 范围切换:点击不关菜单,只切换 _exportState.scope
    exportMenu.querySelectorAll('.io-menu-radio').forEach(rb => {
      rb.addEventListener('click', e => {
        e.stopPropagation();
        _exportState.scope = rb.getAttribute('data-scope') || 'all';
        _updateExportScopeUI();
      });
    });
    // 格式按钮:点哪个就按当前 scope 导出对应格式
    exportMenu.querySelectorAll('button[data-fmt]').forEach(btn => {
      btn.addEventListener('click', () => {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
        exportRevised(btn.getAttribute('data-fmt'));
      });
    });
    // 点击外部 / 按 Esc 关闭菜单
    document.addEventListener('click', e => {
      if (!exportMenu.classList.contains('show')) return;
      if (exportMenu.contains(e.target) || exportBtn.contains(e.target)) return;
      exportMenu.classList.remove('show');
      exportBtn.setAttribute('aria-expanded', 'false');
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && exportMenu.classList.contains('show')) {
        exportMenu.classList.remove('show');
        exportBtn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // 选区追踪:任何时候用户在改后区/原文区里拖拽选了内容,导出按钮就变成朱砂红,
  // 提示「可单独导出选中」。同时 _trackedSel 作为 _prepareExportMenu 的兜底,
  // 防止某些浏览器在点按钮时清空 selection。
  document.addEventListener('selectionchange', _refreshTrackedSelection);
  const _ta = $('inputText');
  if (_ta) {
    // textarea 的选区变化在多数浏览器里不会触发 document.selectionchange,
    // 用这几个事件兜住。
    ['select', 'mouseup', 'keyup', 'input', 'blur'].forEach(evt => {
      _ta.addEventListener(evt, _refreshTrackedSelection);
    });
  }

  // ---------- 历史 ----------
  const historyBtn          = $('historyBtn');
  const historyModal        = $('historyModal');
  const historyModalClose   = $('historyModalClose');
  const historyClearBtn     = $('historyClearBtn');
  const historyExportBtn    = $('historyExportBtn');
  const historyOpenFolderBtn = $('historyOpenFolderBtn');
  const historyImportBtn    = $('historyImportBtn');
  const historyImportInput  = $('historyImportInput');
  const videoSnifferBtn     = $('videoSnifferBtn');

  if (historyBtn)        historyBtn.addEventListener('click', openHistoryModal);
  if (videoSnifferBtn)   videoSnifferBtn.addEventListener('click', async () => {
    try {
      if (!window.gaiwenDesktop || !window.gaiwenDesktop.openVideoSniffer) {
        toast('当前环境不支持视频抓取窗口', 'error');
        return;
      }
      await window.gaiwenDesktop.openVideoSniffer();
    } catch (err) {
      toast('视频抓取窗口打开失败: ' + (err && err.message ? err.message : err), 'error');
    }
  });
  if (historyOpenFolderBtn) historyOpenFolderBtn.addEventListener('click', async () => {
    try {
      if (!window.gaiwenDesktop || !window.gaiwenDesktop.openHistoryFolder) {
        toast('当前环境不支持打开历史目录', 'error');
        return;
      }
      const arr = _historyLoad();
      const res = await window.gaiwenDesktop.openHistoryFolder(arr);
      if (res && res.ok) toast('已打开历史目录');
      else toast('打开历史目录失败: ' + (res && res.error ? res.error : '未知错误'), 'error');
    } catch (err) {
      toast('打开历史目录失败: ' + (err && err.message ? err.message : err), 'error');
    }
  });
  if (historyModalClose) historyModalClose.addEventListener('click', closeHistoryModal);
  if (historyClearBtn)   historyClearBtn.addEventListener('click', clearAllHistory);
  if (historyExportBtn)  historyExportBtn.addEventListener('click', exportHistoryJson);
  if (historyImportBtn && historyImportInput) {
    historyImportBtn.addEventListener('click', () => historyImportInput.click());
    historyImportInput.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      importHistoryJsonFromFile(f);
      e.target.value = '';
    });
  }
  if (historyModal) {
    // 点遮罩关闭
    historyModal.addEventListener('click', e => {
      if (e.target === historyModal) closeHistoryModal();
    });
    // 全局 Esc 关闭历史 modal(优先级低于导出菜单,但同一 keydown 这里不会冲突)
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && historyModal.classList.contains('show')) {
        closeHistoryModal();
      }
    });
  }

  // 路由已锁死为 178,不再需要 modelSelect 的 change 监听

  // 风格切换
  $('styleSelect').addEventListener('change', () => {
    LS.styleId = $('styleSelect').value;
    updateStyleInfo();
    // 选了"自定义"且还没填，自动打开编辑窗
    if ($('styleSelect').value === 'custom' && !LS.getStyleOverride('custom')) {
      openPromptModal();
    }
  });

  // 查看/编辑当前提示词
  $('viewPromptBtn').addEventListener('click', openPromptModal);

  // 提示词弹窗
  $('promptModalClose').addEventListener('click', closePromptModal);
  $('promptModal').addEventListener('click', e => {
    if (e.target.id === 'promptModal') closePromptModal();
  });
  $('promptModalText').addEventListener('input', () => {
    $('promptModalCount').textContent = $('promptModalText').value.length + ' 字';
  });
  $('promptModalReset').addEventListener('click', () => {
    const sid = $('styleSelect').value || 'deslop_std';
    if (sid === 'custom') {
      $('promptModalText').value = '';
    } else {
      $('promptModalText').value = STYLE_PRESETS[sid] ? STYLE_PRESETS[sid].prompt : '';
    }
    $('promptModalCount').textContent = $('promptModalText').value.length + ' 字';
  });
  $('promptModalSave').addEventListener('click', () => {
    const sid = $('styleSelect').value || 'deslop_std';
    const text = $('promptModalText').value;
    // 如果和默认一样，删除 override（用默认）
    if (sid !== 'custom' && text === STYLE_PRESETS[sid].prompt) {
      LS.setStyleOverride(sid, '');
      toast('已恢复默认');
    } else {
      LS.setStyleOverride(sid, text);
      toast('已保存');
    }
    updateStyleInfo();
    closePromptModal();
  });

  // 顶栏菜单
  $('menuToggle').addEventListener('click', e => {
    e.stopPropagation();
    $('menuPop').classList.toggle('show');
  });
  document.addEventListener('click', () => $('menuPop').classList.remove('show'));

  $('menuRefresh').addEventListener('click', () => {
    $('menuPop').classList.remove('show');
    loadModels();
    refreshMe();
    toast('已刷新');
  });
  $('menuLogout').addEventListener('click', () => {
    if (confirm('确定退出登录？')) logout();
  });

  // 快捷键：Ctrl/Cmd + Enter 提交；Esc 关闭弹窗
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('promptModal').classList.contains('show')) {
      e.preventDefault();
      closePromptModal();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && $('app').classList.contains('active')) {
      e.preventDefault();
      if (!$('goBtn').disabled) startRewrite();
    }
  });
}

/* =====================================================
 *  启动
 * ===================================================== */
function boot() {
  bindEvents();
  bindOutputScrollWatch();   // 启用输出区"贴底"滚动跟踪

  // 预填登录信息
  $('loginUser').value   = LS.username;

  // 已有 token 直接进入
  if (LS.token && LS.server) {
    enterApp();
  }
}

boot();
</script>
