/** 用模型标识 ROUTER_MODEL_KEY 在后端模型列表里查出当前环境真实的数字 ID。
 *  命中就缓存到 ROUTER_CALL_ID 并返回它;查不到返回 null。
 *  匹配方式:遍历每个模型条目的所有字段值,只要有一个等于模型标识就算命中,
 *  不依赖具体字段名(后端那个字段可能叫 model_id / flag / key 都行)。 */
async function resolveRouterId() {
  let list;
  try { list = await apiFetch('/api/c/scripts/reasoning/models'); }
  catch { list = await apiFetch('/api/c/create/reasoning/models'); }
  const arr = Array.isArray(list) ? list
            : (list && Array.isArray(list.list) ? list.list
            : (list && Array.isArray(list.data) ? list.data : []));
  // 先按模型标识匹配(扫每个条目所有字段值);列表里若没带标识字段,再退而按模型名称匹配
  let router = arr.find(m => m && Object.values(m).some(v => String(v) === ROUTER_MODEL_KEY));
  if (!router) router = arr.find(m => m && String(m.name) === ROUTER_MODEL_NAME);
  if (router && router.id !== undefined && router.id !== null) {
    ROUTER_CALL_ID = router.id;          // 当前环境真实数字 ID
    return { id: router.id, name: router.name, points_cost: router.points_cost };
  }
  return null;
}

async function loadModels() {
  // 启动时把「模型标识」解析成当前环境的数字 ID,并回填徽标名/积分。
  // 解析不到只在徽标上提示(不弹致命错),实际能不能跑由首次调用兜底再解析一次。
  const pill     = $('routerPill');
  const pillName = $('routerPillName');
  pill.classList.remove('miss');
  pillName.textContent = ROUTER_MODEL_NAME;
  try {
    const r = await resolveRouterId();
    if (r) {
      const cost = r.points_cost !== undefined ? ` \u00B7 ${r.points_cost} 积分起` : '';
      pillName.textContent = `${r.name || ROUTER_MODEL_NAME}${cost}`;
      const sel = $('modelSelect');
      if (sel) sel.value = String(ROUTER_CALL_ID);
    } else {
      pill.classList.add('miss');
      pillName.textContent = `${ROUTER_MODEL_NAME} · 列表里没找到此模型标识`;
      toast(`后端模型列表里没有模型标识 ${ROUTER_MODEL_KEY},请确认该模型已启用`, 'error');
    }
  } catch (e) {
    console.warn('[loadModels] 模型列表加载失败:', e && e.message);
  }
}

/* =====================================================
 *  改文核心：router 编排 → 子模型一次一调
 *
 *  整体流：
 *    1. 用下拉里选的 modelId 当 router，喂用户原文(+style prompt)
 *    2. router 流式返回，本轮收完后扫 <load_model>X</load_model>
 *    3. 没有 load_model    → 这一轮就是终稿，停下
 *       有且仅有一个       → 调子模型 X，拿到内容回喂给 router
 *       多于一个           → 告警，只执行第一个
 *       不在白名单         → 报错停止
 *    4. 直到 router 自己开始写正文为止
 *
 *  「一次只能调一个」在三处强制：
 *    - 正则贪婪扫整段
 *    - 多个时挂橙色告警条
 *    - 一轮只取 ids[0]
 * ===================================================== */
let currentAbort = null;  // 当前 AbortController，跨轮共享，中止键能断当前正在跑的轮

/** load_model 标签提取：返回 { ids:[...], cleanedText:去掉标签的文本 } */
function extractLoadModel(text) {
  const re = /<load_model>\s*(\d+)\s*<\/load_model>/g;
  const ids = [];
  let m;
  while ((m = re.exec(text)) !== null) {
    ids.push(parseInt(m[1], 10));
  }
  const cleanedText = text.replace(re, '').trim();
  return { ids, cleanedText };
}

/* 旧数字 ID → 新 key 兼容映射(178 还没全切到 <load_kb> 时也能跑)。
   只覆盖短剧串跑那几个;160-168(去AI味/文风子模型)不在前端知识库里,留空。 */
const LEGACY_ID_MAP = {
  169: 'compliance-checklist',
  170: 'genre-guide',            // 已补回正版短剧题材指南(见 kb-data.js 末尾 window.KB['genre-guide'])
  171: 'hook-design', 172: 'opening-rules', 174: 'paywall-design',
  175: 'rhythm-curve', 176: 'satisfaction-matrix', 177: 'villain-design',
  180: 'state-tracking',
};

const KB_KEY_ALIASES = {
  'genre=guide': 'genre-guide',
  'genre_guide': 'genre-guide',
  'genre.guide': 'genre-guide',
  'episode=detail': 'episode-detail',
  'episode_detail': 'episode-detail',
  'hook=design': 'hook-design',
  'hook_design': 'hook-design',
  'opening=rules': 'opening-rules',
  'opening_rules': 'opening-rules',
  'paywall=design': 'paywall-design',
  'paywall_design': 'paywall-design',
  'rhythm=curve': 'rhythm-curve',
  'rhythm_curve': 'rhythm-curve',
  'satisfaction=matrix': 'satisfaction-matrix',
  'satisfaction_matrix': 'satisfaction-matrix',
  'villain=design': 'villain-design',
  'villain_design': 'villain-design',
  'state=tracking': 'state-tracking',
  'state_tracking': 'state-tracking',
  'compliance=checklist': 'compliance-checklist',
  'compliance_checklist': 'compliance-checklist',
};

function normalizeKbKey(key) {
  const raw = String(key || '').trim();
  if (!raw) return '';
  const lower = raw.toLowerCase();
  return KB_KEY_ALIASES[lower] || lower;
}

/** 抠出要加载的知识库 key 列表。
 *  主协议:<load_kb>key1,key2,…</load_kb>(可逗号分隔多个,支持一轮多库)。
 *  兼容:旧 <load_model>123</load_model> 按 LEGACY_ID_MAP 翻成 key。
 *  返回 { keys, cleanedText };keys 去重保序。 */
function extractLoadKb(text) {
  const keys = [], seen = new Set();
  const push = k => {
    const key = normalizeKbKey(k);
    if (key && !seen.has(key)) { seen.add(key); keys.push(key); }
  };
  const reKb = /<load_kb>\s*([^<]+?)\s*<\/load_kb>/g;
  let m;
  while ((m = reKb.exec(text)) !== null) m[1].split(/[,\uFF0C\s]+/).forEach(seg => push(seg.trim()));
  const reOld = /<load_model>\s*(\d+)\s*<\/load_model>/g;
  while ((m = reOld.exec(text)) !== null) { const k = LEGACY_ID_MAP[parseInt(m[1],10)]; if (k) push(k); }
  const cleanedText = text.replace(reKb, '').replace(reOld, '').trim();
  return { keys: keys, cleanedText: cleanedText };
}

/** 判断 router 这一轮是不是「嘴上说要继续 / 准备资料,却忘了发 <load_model> 标签」。
 *  这种情况若按"没标签=终稿"处理,就会弹回复框把用户晾在那 —— 看着像卡住。
 *  命中这些措辞 → 视为 router 漏发标签的停顿,前端自动催它一轮。
 *
 *  防误伤策略(2026-05 修):
 *  1) 长输出不可能是 stall。真停顿都是「稍等,我马上给您加载 XX」这种短信号,
 *     上千字的实质内容哪怕末尾带点 stall 措辞,也是有用的回答,不能被催。
 *  2) 把「即将进入」从规则里删掉 —— 它在剧本/小说类内容里经常出现
 *     (例「即将进入全剧的高潮」「即将进入第二阶段」),误判率太高。
 *  3) stall 措辞必须出现在文本「末尾段」,前面段落里出现一律不算
 *     —— 真停顿是 router 不知所措在那"我马上给您加载…",
 *     而不是在文中间叙述。 */
function looksLikeStalledRouter(text) {
  if (!text) return false;
  // 1) 长度门槛:超过 400 字的输出基本都是实质内容,不当 stall
  if (text.length > 400) return false;
  // 2) 收窄关键词:删去「即将…进入」
  // 3) 只看末尾 80 字 —— stall 是"我马上加载 XX"这种结句信号
  const tail = text.length > 80 ? text.slice(-80) : text;
  const stallRe = /(请稍候|请稍等|稍候|稍等片刻|马上(为您|给您)?(准备|加载)|正在(为您|给您)?准备|正在加载|即将(为您)?(加载|准备)|接下来(我)?(会|将)?(加载|准备|调用)|让我(先)?(加载|准备|调用))/;
  return stallRe.test(tail);
}

/** 从一个 SSE 事件里尽量挖出"正文增量文本",兼容各种后端返回形状:
 *    "纯字符串"  /  {content}  /  {text}  /  {response}  /  {delta:"…"}
 *    OpenAI: {choices:[{delta:{content}}]} / {choices:[{text}]} / {choices:[{message:{content}}]}
 *    Anthropic: {delta:{text}}
 *  挖不到就返回空串(不会把整个 JSON 当文本喷出来)。*/
function extractDeltaText(ev) {
  const d = ev && ev.data;
  if (d == null) return '';
  if (typeof d === 'string') return d;
  if (typeof d.content  === 'string') return d.content;
  if (typeof d.text     === 'string') return d.text;
  if (typeof d.response === 'string') return d.response;
  if (typeof d.delta    === 'string') return d.delta;
  if (d.choices && d.choices[0]) {
    const ch = d.choices[0];
    if (ch.delta && typeof ch.delta.content === 'string') return ch.delta.content;
    if (typeof ch.text === 'string') return ch.text;
    if (ch.message && typeof ch.message.content === 'string') return ch.message.content;
  }
  if (d.delta && typeof d.delta.text === 'string') return d.delta.text;
  return '';
}

/**
 * 一次 reasoning-stream 调用 + SSE 解析的工具函数,带【自动重试】与【空闲超时检测】。
 *
 * 失败时最多自动重试 2 次(首次 + 重试 ×2 = 总计 3 次尝试)。重试时机:
 *   1) fetch 抛错(网络异常 / 中间网关 5xx)
 *   2) SSE 长连接 20s 内没有任何新数据(就是"卡死在请稍候"那种情况)
 *   3) HTTP 5xx
 * 不重试:
 *   - 用户手动点了"中止"
 *   - HTTP 4xx(鉴权失败 / 余额不足等,重试也不会变好)
 *
 * @param {Object} opts
 *   - modelId:    {string|number} 要调用的模型 id
 *   - content:    {string}        喂给该模型的输入
 *   - renderEl:   {HTMLElement|null} 输出渲染到哪个 DOM(null 则不实时渲染)
 *   - showCaret:  {boolean}       是否在 renderEl 末尾挂闪烁光标
 *   - onDone:     {function|null} done 事件回调,接收 ev.data
 *   - onCount:    {function|null} 实时字数回调(只有正文轮要传)
 *   - typewriter: {boolean|undefined} 是否开打字机
 * @returns {Promise<string>} 累积的正文输出(不含 think 部分)
 */
async function streamOneCall(opts) {
  // 不做隐形自动重试:后端按请求计费时,重试会让用户感觉"报错也一直扣积分"。
  // 真卡住/失败时停下来给用户处理,避免前端私自多发计费请求。
  const MAX_RETRIES      = 0;
  const IDLE_TIMEOUT_MS  = 60 * 1000;  // 1 分钟没收到任何新数据 → 当作卡死,触发重试

  let lastErr = null;
  for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
    // 第二次及之后:把上一次半截渲染的内容清掉,避免重复
    if (attempt > 0) {
      if (opts.renderEl) opts.renderEl.innerHTML = '';
      console.warn(`[streamOneCall] 自动重试 ${attempt}/${MAX_RETRIES} (model=${opts.modelId}) ← ${lastErr && lastErr.message}`);
      // 退避,给后端/网关喘口气
      await new Promise(r => setTimeout(r, 500 * attempt));
      // 退避期间用户点了中止 → 直接放弃
      if (currentAbort && currentAbort.signal.aborted) {
        throw new DOMException('aborted', 'AbortError');
      }
    }

    try {
      return await _streamOneCallOnce(opts, IDLE_TIMEOUT_MS);
    } catch (e) {
      lastErr = e;
      // 1) 用户主动中止 → 不重试,直接抛
      if (e.name === 'AbortError') throw e;
      if (currentAbort && currentAbort.signal.aborted && !e._idleTimeout) throw e;
      // 2) HTTP 4xx(401/403/402…重试也救不了)→ 不重试
      if (/^HTTP 4\d\d/.test(e.message || '')) throw e;
      // 3) 其它(网络异常 / 5xx / 空闲超时)→ 进入重试
      if (attempt === MAX_RETRIES) throw e;
    }
  }
  throw lastErr;  // 理论到不了
}

/** streamOneCall 的"单次尝试"内部实现。
 *  和原版几乎一致,只多了:
 *    1) 用一个 per-attempt 的 AbortController 接管 fetch / reader,
 *       这样空闲超时只会取消当前这次尝试,不牵连整个编排的 currentAbort;
 *       同时把用户的 currentAbort.abort() 转发给 attemptAbort,让用户中止仍然有效。
 *    2) 每次 await reader.read() 之前重置 idle 计时器,
 *       超过 IDLE_TIMEOUT_MS 没收到字节就当卡死,抛出带 _idleTimeout 的错误让外层重试。 */
async function _streamOneCallOnce({ modelId, content, renderEl, showCaret, onDone, onCount, typewriter }, IDLE_TIMEOUT_MS) {
  let outputBuffer = '';
  let thinkBuffer  = '';
  let thinkEl      = null;
  let textNode     = null;     // renderEl 内部的实际文字节点
  let caretEl      = null;

  if (renderEl) {
    textNode = document.createElement('span');
    renderEl.appendChild(textNode);
    if (showCaret) {
      caretEl = document.createElement('span');
      caretEl.className = 'caret';
      renderEl.appendChild(caretEl);
    }
  }
  const out = $('outputText');

  /* ---------- 打字机:让正文一个字一个字从左往右冒出来 ---------- */
  const useTypewriter = (typewriter !== undefined) ? typewriter : !!showCaret;
  let shownLen = 0;
  let twTimer  = null;
  let drainResolve = null;
  let readerDone = false;
  const TICK_NORMAL = 18;
  const TICK_FAST   = 12;
  const TICK_RUSH   = 8;

  function renderShown() {
    if (textNode) textNode.textContent = outputBuffer.slice(0, shownLen);
    if (onCount)  onCount(shownLen);
    maybeScroll();
  }
  function tick() {
    twTimer = null;
    if (currentAbort && currentAbort.signal.aborted) { flushNow(); return; }
    const backlog = outputBuffer.length - shownLen;
    if (backlog <= 0) {
      if (drainResolve) { const r = drainResolve; drainResolve = null; r(); }
      return;
    }
    shownLen += 1;
    renderShown();
    let delay = TICK_NORMAL;
    if (readerDone && backlog > 220) delay = TICK_FAST;
    if (readerDone && backlog > 900) delay = TICK_RUSH;
    twTimer = setTimeout(tick, delay);
  }
  function ensureTyping() {
    if (!twTimer && !(currentAbort && currentAbort.signal.aborted)) twTimer = setTimeout(tick, TICK_NORMAL);
  }
  function flushNow() {
    if (twTimer) { clearTimeout(twTimer); twTimer = null; }
    shownLen = outputBuffer.length;
    renderShown();
    if (drainResolve) { const r = drainResolve; drainResolve = null; r(); }
  }
  function pushPiece(piece) {
    outputBuffer += piece;
    if (!textNode) return;
    if (useTypewriter) ensureTyping();
    else flushNow();
  }
  function waitDrained() {
    if (!useTypewriter || !textNode) { flushNow(); return Promise.resolve(); }
    if (shownLen >= outputBuffer.length) return Promise.resolve();
    return new Promise(res => { drainResolve = res; ensureTyping(); });
  }

  /* ---------- 单次尝试用的 AbortController + 空闲超时 ---------- */
  const attemptAbort = new AbortController();
  let idleTimer = null;
  let idleTimedOut = false;
  const armIdle = () => {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      idleTimedOut = true;
      try { attemptAbort.abort(); } catch {}
    }, IDLE_TIMEOUT_MS);
  };
  // 用户点中止 → 把 currentAbort 转发给 attemptAbort,确保整轮立即停掉
  const onUserAbort = () => { try { attemptAbort.abort(); } catch {} };
  if (currentAbort) currentAbort.signal.addEventListener('abort', onUserAbort);

  try {
    armIdle();  // 在 fetch 之前先武装一次:连接都建不上也要超时

    const res = await fetch(apiUrl('/api/c/scripts/reasoning-stream'), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
        'Authorization': 'Bearer ' + LS.token,
      },
      body: JSON.stringify({ modelId, content }),
      signal: attemptAbort.signal,
    });

    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.message || j.msg || msg; } catch {}
      throw new Error(msg);
    }
    if (!res.body) throw new Error('当前浏览器不支持流式响应');

    const reader  = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let leftover = '';

    // 处理单个 SSE 事件块(delta / think / done / error)
    function handleBlock(block) {
      if (!block.trim()) return;
      const ev = parseSSEBlock(block);
      if (!ev) return;

      if (ev.event === 'delta' || ev.event === 'message') {
        const piece = extractDeltaText(ev);
        if (piece) pushPiece(piece);
      }
      else if (ev.event === 'think') {
        const piece = (ev.data && (ev.data.content || ev.data.text)) || '';
        thinkBuffer += piece;
        if (renderEl && !thinkEl) {
          thinkEl = document.createElement('div');
          thinkEl.className = 'think';
          const lbl = document.createElement('span');
          lbl.className = 'think-label';
          lbl.textContent = '模型思考';
          thinkEl.appendChild(lbl);
          const body = document.createElement('span');
          thinkEl.appendChild(body);
          thinkEl._body = body;
          renderEl.insertBefore(thinkEl, textNode);
        }
        if (thinkEl) thinkEl._body.textContent = thinkBuffer.replace(/<\/?think>/g, '');
      }
      else if (ev.event === 'done') {
        if (onDone) onDone(ev.data || {});
      }
      else if (ev.event === 'error') {
        throw new Error((ev.data && ev.data.message) || '接口返回错误');
      }
    }

    try {
      while (true) {
        armIdle();  // 每读一次前重置空闲计时器:只要后端还在吐字节,就一直续命
        const { done, value } = await reader.read();
        if (done) break;

        const text = leftover + decoder.decode(value, { stream: true });
        const blocks = text.split(/\r?\n\r?\n/);
        leftover = blocks.pop() || '';

        for (const block of blocks) handleBlock(block);
      }
      if (leftover.trim()) handleBlock(leftover);
      readerDone = true;
      await waitDrained();
    } finally {
      if (twTimer) { clearTimeout(twTimer); twTimer = null; }
      if (caretEl) caretEl.remove();
    }

    return outputBuffer;

  } catch (e) {
    // 空闲超时 → 包装成可重试错误抛给外层 streamOneCall
    if (idleTimedOut) {
      const secs = IDLE_TIMEOUT_MS / 1000;
      const human = secs >= 60 ? `${secs / 60} 分钟` : `${secs}s`;
      const err = new Error(`流式响应卡住:${human} 内无新数据`);
      err._idleTimeout = true;
      err.name = 'IdleTimeoutError';
      throw err;
    }
    throw e;
  } finally {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (currentAbort) currentAbort.signal.removeEventListener('abort', onUserAbort);
  }
}

/* ============ 原大纲保护开关 ============
 * preserve    = 保留模式:router 不得重排/删改/合并用户自带的事件顺序与分集结构,
 *               只能在原结构上改写润色;想动结构只能列「⚠️ 优化建议(未应用)」给用户逐条确认。
 * restructure = 重构模式:允许 router 按爆款方法论自由重排节奏与结构。
 * 选择持久化在 LS.outlineMode,默认 preserve —— 直接回应"系统别乱改我大纲"的用户反馈。
 * 设计原则:宁可少改不可乱改;用户没主动放开之前一律按保留执行。 */
function getOutlineMode() {
  return LS.outlineMode === 'restructure' ? 'restructure' : 'preserve';
}

/** 注入给 router 的「大纲模式」指令块。首轮随原文带上(见 startRewrite),
 *  中途切换也会追加一条(见 setOutlineMode)。用方括号包成显式系统指示,
 *  和 expandSlashCommandForRouter 里那批约束同一性质,不会和用户正文混淆。 */
function outlineModeDirective() {
  if (getOutlineMode() === 'preserve') {
    return [
      '【大纲模式：保留原大纲｜本次硬约束，优先级高于任何"优化节奏/提升爽点"的理由】',
      '用户自带了大纲/原文结构。整个流程的任何阶段，都不得重排、删改、合并、新增用户原有的事件顺序与章节/分集结构。',
      '· 进入故事骨架(/plan)：只把三幕、付费卡点、爽点【映射】到原有事件顺序上，不另起一套大纲、不挪动事件先后。',
      '· 进入分集目录(/outline)：沿用原大纲的分集与顺序，只补 🔥/💰 标记和连续性台账；🔥💰 的数量指标降级为"只检查、只提示"，达不到也不准为凑指标改结构。',
      '· 进入人物阶段(/characters)：不擅自改动人物关系、不增删主角。',
      '· 进入写集阶段(/episode)：单集剧情必须落在该集原大纲事件范围内，细节可丰富、事件不可改。',
      '· 凡你认为"应该改"的结构问题，一律写进「⚠️ 优化建议（未应用）」清单：问题 + 理由 + 你的改法，但【不要】直接动正文，等用户逐条点头后才应用；用户没同意的部分原样保留。',
      '（用户若说"第 N 集可以改"，只解锁那一集；说"整体交给你重构"，则切到重构模式；其余仍按保留。）',
    ].join('\n');
  }
  return '【大纲模式：系统重构】用户已授权按爆款短剧方法论自由优化结构与节奏：可重排事件、调整分集、增删卡点与爽点，以最终成片效果为准。';
}

/** 保留模式下,在斜杠命令展开里补一条提醒(防长上下文里把首轮约束忘了)。 */
function outlineReminderLine() {
  return getOutlineMode() === 'preserve'
    ? '【大纲模式=保留】严禁重排/删改/合并原大纲的事件顺序与分集结构；只能在原结构上改写润色，要动结构请改走「⚠️ 优化建议（未应用）」清单交用户确认，未同意的原样保留。'
    : '';
}

/** 把开关的视觉状态同步到当前 LS.outlineMode(启动时 + 每次切换后调用)。 */
function syncOutlineToggleUI() {
  const mode = getOutlineMode();
  const keep    = document.getElementById('outlineKeepBtn');
  const rebuild = document.getElementById('outlineRebuildBtn');
  if (keep)    keep.classList.toggle('active',    mode === 'preserve');
  if (rebuild) rebuild.classList.toggle('active', mode === 'restructure');
}

/** 切换大纲模式。会持久化、刷新 UI;若有进行中的会话,追加一条切换指令,
 *  让下一轮 router 立刻按新模式走(支持随时切换,且不回头重做已确认的产物)。 */
function setOutlineMode(mode) {
  const next = mode === 'restructure' ? 'restructure' : 'preserve';
  const changed = next !== getOutlineMode();
  LS.outlineMode = next;
  syncOutlineToggleUI();
  if (!changed) return;

  if (session) {
    const note = '【用户在流程中途切换了大纲模式】\n' + outlineModeDirective() +
                 '\n（已产出并确认过的内容不必回头重做，从下一步起按新模式执行即可。）';
    session.routerContent    = (session.routerContent    || '') + '\n\n' + note;
    session.userConversation = (session.userConversation || '') + '\n\n' + note;
    toast(next === 'preserve'
      ? '已切到「保留原大纲」—— 后续步骤不再动你的结构'
      : '已切到「系统重构」—— 后续步骤可自由优化结构', 'ok');
  } else {
    toast(next === 'preserve'
      ? '已设为「保留原大纲」:开始改文后不动你的大纲结构'
      : '已设为「系统重构」:开始改文后允许按方法论重排结构', 'ok');
  }
}

/** 当前对话会话的状态（跨调用、跨"继续"按钮持续存在,直到下一次 startRewrite 重置）。
 *  routerContent 是要喂给下一轮 router 的内容 —— 我们把"之前的全部 + 新输入"裸地接起来,
 *  不加任何前端自写的提示词标签,router 的纪律由它自己的系统提示词管。 */
let session = null;

async function startRewrite() {
  const content = $('inputText').value;
  if (!content.trim()) { toast('原文还是空的呢', 'error'); return; }

  // 178 模型在后端「系统提示词」字段里已经存了写作技能 A 段。
  // 这里不在用户原文里掺东西(baseContent 保持纯原文,供历史存档/快照用),
  // 只把「大纲模式」指令作为显式系统指示,拼到喂给 router/子模型的上下文最前面。
  const baseContent = content;
  const outlineDirective = outlineModeDirective();

  // (已移除:原本这里有 baseContent.length > 100000 的硬阻断。)
  // 前端不再设字符上限,真正的天花板在后端模型上下文窗口,由后端报错来兜底。

  // 新会话 —— 清状态,清 UI
  session = {
    baseContent,
    routerContent: outlineDirective + '\n\n' + baseContent,
    // userConversation:干净的「用户视角」对话历史,供子模型(160-168, 169-172, 174-177, 179, 180)使用。
    // 与 routerContent 的区别:不含 <load_model> 标签 / [回喂开始-结束] 标记 / 子模型回喂内容,
    // 只累积「原文 + 历轮终稿 + 用户回复/引导」。
    // 修复 Bug:之前子模型只收 baseContent,中间对话时看不到用户的新要求,导致上下文断裂。
    userConversation: outlineDirective + '\n\n' + baseContent,
    loadedIds: new Set(),
    totalLoads: 0,         // 实际加载次数(包括重复加载) —— 用于状态显示
    lastExecutedId: null,  // 上一次成功加载的子模型 ID
                            // 每次给 router 发请求时,会把它作为 <load_model>X</load_model>
                            // 标签拼到 content 末尾,让 178 一眼能看到「我刚才执行了哪个」
    t0: Date.now(),
    totalPointsCost: 0,
    finalBalance: null,
    lastRouterOutput: '',  // 用于"继续对话"时拼回上下文
    stallNudges: 0,        // router「说要继续却没发 load_model」时,自动催它的次数
    autoSteps: 0,          // 流程启动后,前端自动塞「继续」推进的次数
    lastAutoOutput: '',    // 上一轮自动产出的内容,用于检测路由卡死打转
    phase: 'auto',         // 'auto'=阶段一(反问+全自动跑完) | 'edit'=阶段二(对话修改)
    scriptSnapshot: '',    // 阶段一跑完的全剧本快照;编辑态只带它 + 本次要求,不带历史
    scriptBuf: '',         // 捕获带标记全剧本时的累积缓冲(支持分批输出)
    capturing: false,      // 是否正在捕获 ===全剧本开始===…===全剧本结束===
    editLog: [],           // 编辑轮(阶段二)的滚动对话历史 [{role:'user'|'assistant',text}];不含阶段一历史
    stageIdx: -1,          // 自动轮阶段进度条当前高亮到第几阶段(0..7),-1=还没开始
  };

  $('outputText').innerHTML = '';
  $('outputCount').textContent = '0 字';
  _stickBottom = true;        // 新一轮从贴底开始
  removeReplyBox();
  removeNextStepPanel();

  await runOrchestration({ statusOnStart: '正在发起请求' });
}

/** 新会话:中止在跑的请求,清空原文 + 译文 + 所有面板,回到初始就绪态。
 *  与"开始改文"的区别:开始改文只重置右栏并保留左栏原文(方便基于同一篇继续改);
 *  新会话则两栏都清空,等于完全开一篇新的。 */
function newSession() {
  if (currentAbort) currentAbort.abort();   // 把在跑的轮断掉
  session = null;
  $('inputText').value = '';
  $('inputCount').textContent = '0 字';
  $('outputText').innerHTML = '';
  $('outputCount').textContent = '0 字';
  _stickBottom = true;        // 新会话从贴底开始
  removeReplyBox();
  removeNextStepPanel();
  $('goBtn').disabled = false;
  $('stopBtn').classList.remove('show');
  setStatus('就绪', '');
  $('inputText').focus();
  toast('已开启新会话');
}


async function continueRewrite(replyText) {
  if (!session) { toast('没有进行中的对话,请先点开始改文', 'error'); return; }
  const reply = normalizeContinueReply(replyText);
  if (!reply) { toast('回复是空的', 'error'); return; }

  // 把用户回复在输出区做一个视觉锚点
  appendUserReplyToOutput(reply);
  const routerReply = expandSlashCommandForRouter(reply);

  // —— 编辑态:带「当前全剧本 + 编辑轮滚动对话」,不带阶段一历史;178 可反问 ——
  if (session.phase === 'edit') {
    if (!session.editLog) session.editLog = [];
    session.editLog.push({ role: 'user', text: routerReply });
    session.routerContent    = buildEditRequest(session.scriptSnapshot, session.editLog);
    session.userConversation = session.routerContent;
    session.capturing = false; session.scriptBuf = '';
    session.stallNudges = 0; session.autoSteps = 0; session.lastAutoOutput = '';
    session.loadedIds = new Set(); session.totalLoads = 0;  // 编辑轮重置加载集合,允许按需重调单库
    removeReplyBox(); removeNextStepPanel();
    await runOrchestration({ statusOnStart: '处理修改…' });
    return;
  }

  // 累积上下文:之前的 routerContent + router 上一轮的输出 + 用户回复
  // 三段之间只用 \n\n 分隔,不带任何前端自写的 [系统提示] / [用户回复] / 「请继续」标签。
  session.routerContent =
    session.routerContent + '\n\n' +
    session.lastRouterOutput + '\n\n' +
    routerReply;

  // 同步把这次的「上一轮终稿 + 用户回复」也并入干净的用户视角对话历史,
  // 让下一轮调用的子模型能看到用户最新的要求,而不是只盯着最初的原文。
  session.userConversation =
    session.userConversation + '\n\n' +
    session.lastRouterOutput + '\n\n' +
    routerReply;
  session.stallNudges = 0;   // 用户手动推进 —— 重置自动催促额度

  removeReplyBox();
  removeNextStepPanel();

  await runOrchestration({ statusOnStart: '继续对话…' });
}

function normalizeContinueReply(replyText) {
  const raw = String(replyText || '').trim();
  const suggested = inferSuggestedSlashCommand();
  if (!suggested) return raw;

  if (!raw) return suggested;
  const confirm = raw.match(/^(继续|确认|确定|可以|好的?|行|没问题|ok|yes|go)(?:[，,\s:：]*(.*))?$/i);
  if (!confirm) return raw;

  const extra = (confirm[2] || '').trim();
  return extra ? `${suggested} ${extra}` : suggested;
}

function inferSuggestedSlashCommand() {
  const recent = String(
    (session && session.lastRouterOutput) ||
    (document.getElementById('outputText') ? document.getElementById('outputText').innerText : '')
  ).slice(-2400);
  if (!recent) return '';

  const candidates = [];
  const patterns = [
    /\/episode\s+(next|\d+(?:\s*-\s*\d+)?)/ig,
    /\/characters\b/ig,
    /\/outline\b/ig,
    /\/plan\b/ig,
    /\/start\b/ig,
    /\/review\s+(all|\d+(?:\s*-\s*\d+)?)/ig,
    /\/compliance\b/ig,
    /\/export\b/ig,
    /\/overseas\b/ig,
  ];

  for (const re of patterns) {
    let m;
    while ((m = re.exec(recent)) !== null) {
      candidates.push({ at: m.index, text: m[0].replace(/\s*-\s*/g, '-') });
    }
  }
  if (!candidates.length) return '';

  candidates.sort((a, b) => a.at - b.at);
  return candidates[0].text.trim();
}

function expandSlashCommandForRouter(reply) {
  const text = String(reply || '').trim();
  const episode = text.match(/^\/episode\s+(\d+)(?:\s+([\s\S]+))?$/i);
  if (episode) {
    const n = parseInt(episode[1], 10);
    const extra = (episode[2] || '').trim();
    return [
      `用户输入了斜杠命令: ${text}`,
      `请严格执行:只生成第 ${n} 集的单集完整剧本,不要生成其他集,不要跳到第 ${n + 8} 集或任何别的集。`,
      extra ? `用户对本集的额外要求:${extra}` : '',
      extra ? '额外要求优先级很高,必须落实到本集正文里;如果额外要求包含字数范围,本集正文必须按该范围控制篇幅。' : '',
      `必须先加载 <load_kb>episode-detail</load_kb> 获取逐集细化规范;如需要连续性校验,可再加载 <load_kb>state-tracking</load_kb>。`,
      `输出标题必须以「# 第${n}集」或「【第${n}集」开头。`,
      outlineReminderLine(),
      '不要回复“流程已结束”“已经交付”“等待新指令”等闲聊话术;本轮必须直接产出用户指定的单集剧本正文。',
    ].filter(Boolean).join('\n');
  }

  const characters = text.match(/^\/characters(?:\s+([\s\S]+))?$/i);
  if (characters) {
    const extra = (characters[1] || '').trim();
    return [
      `用户输入了斜杠命令: ${text}`,
      '请严格执行:进入人物设定/角色档案/道具与秘密台账阶段,不要直接撰写单集正文。',
      extra ? `用户额外要求:${extra}` : '',
      '必须按需加载 <load_kb>villain-design,state-tracking</load_kb>。',
      outlineReminderLine(),
      '输出应包含主要人物档案、关系与冲突、关键道具台账、秘密/信息台账,用于后续逐集写剧本时保持连续性。',
    ].filter(Boolean).join('\n');
  }

  const plan = text.match(/^\/plan(?:\s+([\s\S]+))?$/i);
  if (plan) {
    const extra = (plan[1] || '').trim();
    return [
      `用户输入了斜杠命令: ${text}`,
      '请严格执行:进入故事骨架/分集大纲规划阶段,不要直接撰写单集正文。',
      extra ? `用户额外要求:${extra}` : '',
      '必须按需加载 <load_kb>opening-rules,paywall-design,rhythm-curve,satisfaction-matrix</load_kb>。',
      getOutlineMode() === 'preserve'
        ? '【保留模式】只把三幕/卡点/爽点【映射】到用户原大纲的事件顺序上，不另起一套大纲、不挪动事件先后；想动结构只列「⚠️ 优化建议（未应用）」交用户确认。'
        : '',
    ].filter(Boolean).join('\n');
  }

  const outline = text.match(/^\/outline(?:\s+([\s\S]+))?$/i);
  if (outline) {
    const extra = (outline[1] || '').trim();
    return [
      `用户输入了斜杠命令: ${text}`,
      '请严格执行:进入分集目录阶段,产出逐集一行的分集大纲,不要直接撰写单集正文。',
      extra ? `用户额外要求:${extra}` : '',
      getOutlineMode() === 'preserve'
        ? '【保留模式｜本命令最关键】沿用用户原大纲的分集与先后顺序，逐集一一对应，不重排、不合并、不增删集；只在每集后补 🔥/💰 标记和连续性台账。🔥💰 数量指标降级为"只检查、只提示"，达不到也不准为凑指标改结构。发现结构问题写进「⚠️ 优化建议（未应用）」交用户逐条确认。'
        : '允许按节奏曲线重排/合并分集，优化卡点与爽点分布。',
    ].filter(Boolean).join('\n');
  }

  return text;
}

/** 构造给 router(178)的请求 content。
 *
 *  直接返回累积的 routerContent —— 其中已经在每次子模型加载完后,
 *  把 <load_model>X</load_model> 标签写在子模型输出的**前面**,
 *  这样 178 看到的结构是:
 *
 *     …前文…
 *     <load_model>163</load_model>      ← 标签
 *     {子模型 163 的输出}               ← 紧跟在标签后面 = 已回喂
 *
 *  178 扫到最后一个 <load_model> 标签时,能在其**后面**看到子模型输出,
 *  从而正确判定「前端已回喂」,不会误以为还在等回喂而重复输出同一个 ID。 */
function buildRouterRequestContent() {
  return session.routerContent;
}

/* ============ 两阶段:全剧本快照 + 编辑态 ============ */
const SCRIPT_BEGIN = '===全剧本开始===';
const SCRIPT_END   = '===全剧本结束===';

/** 编辑态请求体:当前全剧本 + 编辑轮滚动对话历史(用户↔你)。
 *  只带这俩,不带阶段一(反问/题材/规划/注入的库正文)那一大堆历史。
 *  对话历史最后一条「用户：」就是 178 这轮要回应的。 */
function buildEditRequest(script, log) {
  const convo = (log || []).map(t =>
    (t.role === 'user' ? '用户：' : '你（上一轮）：') + t.text).join('\n\n');
  return '【当前全剧本】\n' + (script || '') + '\n【当前全剧本·结束】\n\n' +
         '【编辑对话｜最后一条「用户：」是你要回应的；要出新版剧本就用 ===全剧本开始===/===全剧本结束=== 包裹,只是聊/反问就别包】\n' +
         convo;
}

/** 兼容旧历史:有些历史只存了面板文本,没有完整 session。
 *  恢复时仍然要能围绕当前稿继续改,所以把原文/改后稿/上一轮输出拼成编辑态上下文。 */
function buildHistoryResumeRequest(entry, restoredScript, editLog) {
  if (entry && entry.routerContent) return entry.routerContent;

  let req = buildEditRequest(restoredScript, editLog);
  const original = (entry && entry.original || '').trim();
  const revised = (entry && entry.revised || '').trim();
  if (original && !restoredScript) {
    req += '\n\n【旧历史兜底·用户原文】\n' + original;
  }
  if (revised && revised !== restoredScript) {
    req += '\n\n【旧历史兜底·历史输出】\n' + revised;
  }
  req += '\n\n【恢复历史说明】这是从本地历史恢复的旧记录。用户接下来会在输入框继续提出修改要求;请基于上面的当前稿和历史输出继续编辑,不要要求用户重新开始。';
  return req;
}

/** 编辑轮里 178 没出新剧本(在反问/对话):记进 editLog,弹回复框等用户,不动快照。 */
function editAwaitReply(out, routerOutput) {
  session.lastRouterOutput = routerOutput;
  if (!session.editLog) session.editLog = [];
  const said = (routerOutput || '').trim();
  if (said) session.editLog.push({ role: 'assistant', text: said });
  clearRunBanner();
  setStatus('等你回应', 'done');
  showReplyBox();
  maybeScroll();
}

/* ============ 自动轮阶段进度条(短剧 B 路径) ============ */
const STAGE_NAMES = ['题材定位','整剧规划','人物设计','状态追踪','分集设计','剧本细化','全集审校','合规定稿'];
const STAGE_KEY_MAP = {
  'genre-guide':0,
  'opening-rules':1,'paywall-design':1,'rhythm-curve':1,'satisfaction-matrix':1,
  'villain-design':2,'state-tracking':3,'hook-design':4,'episode-detail':5,'compliance-checklist':7,
};
function stageForKeys(keys){ let idx=-1; for(const k of (keys||[])){ const v=STAGE_KEY_MAP[k]; if(v!==undefined) idx=Math.max(idx,v);} return idx; }
function ensureStageBar(){
  let bar=document.getElementById('stageBar');
  if(bar) return bar;
  const out=$('outputText');
  bar=document.createElement('div'); bar.id='stageBar'; bar.className='stage-bar';
  STAGE_NAMES.forEach((nm,i)=>{
    const chip=document.createElement('span'); chip.className='stage-chip'; chip.dataset.i=i; chip.textContent=nm; bar.appendChild(chip);
    if(i<STAGE_NAMES.length-1){ const a=document.createElement('span'); a.className='stage-arrow'; a.textContent='\u2192'; bar.appendChild(a); }
  });
  out.insertBefore(bar, out.firstChild);
  return bar;
}
function setStageActive(idx){
  if(idx<0) return;
  const cur = (session.stageIdx===undefined?-1:session.stageIdx);
  session.stageIdx = Math.max(cur, idx);
  clearRunBanner();
  const bar=ensureStageBar();
  bar.querySelectorAll('.stage-chip').forEach(ch=>{ const i=+ch.dataset.i; ch.classList.toggle('active', i===session.stageIdx); ch.classList.toggle('done', i<session.stageIdx); });
  setStatus('正在准备：'+(STAGE_NAMES[session.stageIdx]||''), 'busy');
  maybeScroll();
}
function finishStageBar(){ const bar=document.getElementById('stageBar'); if(bar) bar.remove(); }
/* 输出区顶部常驻「处理中」横幅:从一开跑就显示,确保对话区里一直有可见反馈 */
function setRunBanner(text){
  const out=$('outputText'); let b=document.getElementById('runBanner');
  if(!b){ b=document.createElement('div'); b.id='runBanner'; b.className='run-banner'; out.insertBefore(b, out.firstChild); }
  b.innerHTML=''; const dot=document.createElement('span'); dot.className='run-dot'; b.appendChild(dot);
  b.appendChild(document.createTextNode(' '+text));
}
function clearRunBanner(){ const b=document.getElementById('runBanner'); if(b) b.remove(); }

/** 捕获被 ===全剧本开始===…===全剧本结束=== 包裹的最终全剧本。
 *  支持分批:178 分多轮吐时跨轮累积到 session.scriptBuf,见到结束标记才算完整。
 *  返回 { started, done, script }。 */
function feedScriptCapture(text) {
  if (!session.capturing) {
    const i = text.indexOf(SCRIPT_BEGIN);
    if (i === -1) return { started: false, done: false };
    session.capturing = true;
    session.scriptBuf = text.slice(i + SCRIPT_BEGIN.length);
  } else {
    session.scriptBuf += text;
  }
  const j = session.scriptBuf.indexOf(SCRIPT_END);
  if (j !== -1) {
    const script = session.scriptBuf.slice(0, j).trim();
    session.capturing = false;
    return { started: true, done: true, script: script };
  }
  return { started: true, done: false };
}

/** 阶段一跑完 / 编辑态改完:落快照 + 弹回复框,进入(或留在)编辑态。 */
function enterEditDone(out, routerOutput) {
  clearRunBanner(); finishStageBar();
  if (!session.editLog) session.editLog = [];
  session.lastRouterOutput = routerOutput;
  session.stallNudges = 0;
  const dur  = ((Date.now() - session.t0) / 1000).toFixed(1);
  const cost = session.totalPointsCost ? ('消耗 ' + session.totalPointsCost + ' 积分 · ') : '';
  if (session.finalBalance !== null) $('metaPoints').textContent = session.finalBalance;
  const len = (session.scriptSnapshot || '').length;
  $('outputCount').textContent = len + ' 字';
  const div = document.createElement('div');
  div.className = 'load-divider done';
  div.textContent = '全剧本已就绪 · ' + len + ' 字 · 下面直接说要怎么改';
  out.appendChild(div);
  setStatus('完成 · 进入修改', 'done', cost + '用时 ' + dur + 's');
  try { _saveCurrentSessionToHistory(); } catch (e) { console.warn('[history] save failed', e); }
  showReplyBox();
  maybeScroll();
}

/** 可重入的编排循环。每次调用都从 session.routerContent 开始跑,
 *  直到 router 不再发 <load_model> 为止;到那一步就保存 lastRouterOutput,弹出回复框。 */
async function runOrchestration({ statusOnStart }) {
  const out = $('outputText');
  setStatus(statusOnStart, 'busy');
  $('goBtn').disabled = true;
  $('stopBtn').classList.add('show');

  currentAbort = new AbortController();

  try {
    for (let round = 1; round <= MAX_ORCH_ROUNDS; round++) {
      // === A. 跑一次 router ===
      setStatus(`编排路由 · 第 ${round} 轮`, 'busy');
      if (!document.getElementById('stageBar')) {
        setRunBanner(round <= 1 ? '正在与写作模型沟通…' :
          (session.totalLoads > 0 ? '处理中…（第 ' + round + ' 轮）'
            : '正在确认需求…（第 ' + round + ' 轮）'));
      }
      // 字数清零,本轮从 0 开始跟着流式涨,避免跨轮跳变
      $('outputCount').textContent = '0 字';

      // 自动轮:router 的内部输出(<load_kb> 标签、阶段自检、(路由) 噪音)默认渲染到
      // 隐藏元素,用户看不到;只在「反问/终稿」时再 reveal。编辑轮正常可见(要看反问/改写)。
      const isEdit = session.phase === 'edit';
      const routerEl = document.createElement('span');
      routerEl.className = isEdit ? 'final-round' : 'auto-internal';
      out.appendChild(routerEl);

      // 首次/解析失败时,临时再用模型标识解析一次真实数字 ID(后端只认数字 ID)
      if (ROUTER_CALL_ID === null) {
        try { await resolveRouterId(); } catch (e) {}
      }
      if (ROUTER_CALL_ID === null) {
        softAbort(out,
          `没在后端模型列表里找到模型标识 ${ROUTER_MODEL_KEY} 对应的模型(可能未启用/标识写错)`,
          '路由模型未解析到', '');
        return;
      }
      const routerOutput = await streamOneCall({
        modelId:  ROUTER_CALL_ID,   // 用解析出的当前环境数字 ID 调用
        content:  buildRouterRequestContent(),
        renderEl: routerEl,
        showCaret: isEdit,
        onDone: (d) => {
          if (d.balance !== undefined)    session.finalBalance = d.balance;
          if (d.pointsCost !== undefined) session.totalPointsCost += Number(d.pointsCost) || 0;
        },
        onCount: isEdit ? (n) => { $('outputCount').textContent = n + ' 字'; } : null,
      });

      // === B. 扫这一轮里的 load_model ===
      const { keys, cleanedText } = extractLoadKb(routerOutput);

      if (keys.length === 0) {
        // —— 先看是不是「带标记的最终全剧本」(支持分批) ——
        const cap = feedScriptCapture(routerOutput);
        if (cap.started) {
          if (!cap.done) {
            session.autoSteps++;
            session.routerContent = session.routerContent + '\n\n' + routerOutput + '\n\n' + AUTO_CONTINUE_MSG;
            if (!isEdit) { routerEl.remove(); setStageActive(7); }
            setStatus('正在生成全剧本…', 'busy');
            maybeScroll();
            continue;
          }
          const wasEdit = session.phase === 'edit';
          session.scriptSnapshot = cap.script;
          session.phase = 'edit';
          finishStageBar();
          if (wasEdit) {
            routerEl.remove();                           // 删掉原始流(含标记),重新逐字显示干净新剧本
            const scriptEl = document.createElement('div');
            scriptEl.className = 'final-round';
            out.appendChild(scriptEl);
            await typeTextIntoElement(scriptEl, cap.script, n => { $('outputCount').textContent = n + ' 字'; });
            if (!session.editLog) session.editLog = [];
            session.editLog.push({ role: 'assistant', text: '(已输出新版全剧本)' });
          } else {
            routerEl.remove();                           // 删掉隐藏的原始流(含标记)
            const scriptEl = document.createElement('div');
            scriptEl.className = 'final-round';
            out.appendChild(scriptEl);
            await typeTextIntoElement(scriptEl, cap.script, n => { $('outputCount').textContent = n + ' 字'; });
          }
          enterEditDone(out, routerOutput);
          return;
        }
        // 编辑态下、没带标记:178 在反问/对话 → 记进 editLog,弹回复框,不动快照
        if (session.phase === 'edit') {
          editAwaitReply(out, routerOutput);
          return;
        }

        // 没有 load_model —— 通常意味着这一轮是终稿或反问。
        // 但有一种例外:router 嘴上说"正在为您准备…请稍候"之类,却忘了发标签。
        // 这种"假终稿"如果直接弹回复框,用户就被晾在那,看着像卡死。
        if (looksLikeStalledRouter(cleanedText) && session.stallNudges < 2) {
          // 自动催一轮:把这一轮 router 自己说的话拼回上下文,
          // 再补一句明确指示,让它要么发标签、要么直接出正文。
          session.stallNudges++;
          // 旧逻辑会把这段 routerEl 降级成 .router-round(12.5px 灰小字),
          // 导致用户之前看着大字读到一半,nudge 一触发整段瞬间变小变淡 —— 没法审阅。
          // 现在保持原样:既然有实质内容(已被 looksLikeStalledRouter 的长度门槛过滤),
          // 就让它继续以 .final-round 显示;nudge 提示和重跑内容都追加在下方。
          // routerEl.className = 'router-round';     // ← 移除,不再视觉降级
          // routerEl.textContent = cleanedText || '(路由)';  // ← 同上,流式渲染好的文本保留

          if (isEdit) {
            const note = document.createElement('div');
            note.className = 'load-divider';
            note.textContent = `路由说要继续但没发加载指令 —— 自动催它第 ${session.stallNudges} 次`;
            out.appendChild(note);
          } else {
            routerEl.remove();   // 自动轮:隐藏内部催促噪音
          }
          maybeScroll();

          session.routerContent =
            session.routerContent + '\n\n' +
            cleanedText + '\n\n' +
            '请直接继续:如需加载知识库就发出 <load_kb> 标签(可逗号分隔多个),不需要就直接输出最终正文。';
          continue;   // 重跑 router
        }

        // === 混合自动模式:这一轮没有 load_model ——
        //   · 流程还没启动(一个知识库都没加载过)→ 这是开头的「反问」,
        //     必须停下、弹回复框,让用户确认改编类型 / 总集数 / 每集秒数。
        //   · 流程已经启动(至少加载过一个知识库)→ 这是一个「阶段产出」
        //     (题材 / 规划 / 人物 / 状态账本 / 分集 / 细化 / 审校报告 / 完整修正版…),
        //     用户开头已经确认过了,从这里开始全自动:自动塞「继续」推进,
        //     一路把整条链跑到合规自检结束,中途不再打扰用户。 ===
        if (!STEP_BY_STEP && session.totalLoads > 0) {
          const flowDone = looksFlowComplete(cleanedText);
          // 卡死检测:连续两轮产出几乎一样 → 路由在原地打转,别再空转烧积分
          const prev = session.lastAutoOutput || '';
          const stuck = prev &&
            cleanedText.trim().slice(0, 240) === prev.trim().slice(0, 240) &&
            Math.abs(cleanedText.length - prev.length) < 40;

          if (!flowDone && !stuck) {
            session.autoSteps++;
            session.lastAutoOutput = cleanedText;
            session.stallNudges = 0;
            session.lastRouterOutput = '';   // 本轮产出已并入 routerContent,不留给手动续跑重复拼

            session.routerContent =
              session.routerContent + '\n\n' + routerOutput + '\n\n' + AUTO_CONTINUE_MSG;
            session.userConversation =
              session.userConversation + '\n\n' + routerOutput + '\n\n' + AUTO_CONTINUE_MSG;

            if (!isEdit) routerEl.remove();   // 删掉隐藏的内部自检产出,用户只看进度条
            // 分集(4)之后那些无加载的「细化/审校」轮,靠这里把进度条推到 5→6
            const _cur = (session.stageIdx || 0);
            if (_cur >= 4 && _cur < 6) setStageActive(_cur + 1);
            maybeScroll();
            continue;   // 直接进入下一轮 router,不打扰用户
          }

          if (stuck) {
            const w = document.createElement('div');
            w.className = 'multi-warn';
            w.textContent = '⚠ 路由连续两轮产出几乎一样 —— 自动推进已停下,可在下面手动给个明确指示继续。';
            out.appendChild(w);
          }
          // flowDone / stuck → 落到下面正常收尾、弹回复框
        }

        // 真·没有 load_model → 这一轮就是终稿或反问 → 让它对用户可见。
        if (!isEdit) { routerEl.classList.remove('auto-internal'); finishStageBar(); }
        clearRunBanner();
        session.stallNudges = 0;   // 正常收尾,清掉催促计数
        const finalLen = routerOutput.length;
        $('outputCount').textContent = finalLen + ' 字';

        // 保存这一轮的原始输出,供"继续对话"时拼回上下文
        session.lastRouterOutput = routerOutput;

        const cost   = session.totalPointsCost ? `消耗 ${session.totalPointsCost} 积分 · ` : '';
        const dur    = ((Date.now() - session.t0) / 1000).toFixed(1);
        const kbN    = session.totalLoads;
        const kbStr  = kbN ? `加载 ${kbN} 次知识库 · ` : '';
        if (session.finalBalance !== null) $('metaPoints').textContent = session.finalBalance;

        // 若是被"催了两次仍不发标签"兜底落到这里,给用户一句解释
        if (looksLikeStalledRouter(cleanedText)) {
          const warn = document.createElement('div');
          warn.className = 'multi-warn';
          warn.textContent = '⚠ 路由连续说"请稍候"却始终没发出加载指令 —— 已停在这。可在下面直接说「继续」或「别加载了直接写正文」来推进。';
          out.appendChild(warn);
        }

        const apStr = session.autoSteps ? `自动推进 ${session.autoSteps} 步 · ` : '';
        setStatus(
          session.autoSteps ? '自动跑完' : '完成',
          'done',
          cost + kbStr + apStr + `用时 ${dur}s · 共 ${finalLen} 字`);

        // 自动留底到本地历史(按 session.t0 upsert,继续对话会覆盖同一条)
        try { _saveCurrentSessionToHistory(); }
        catch (e) { console.warn('[history] save on complete failed', e); }

        // 终稿区下方弹出回复框,用户可继续追问
        showReplyBox();
        return;
      }

      // router 正常发了 load 指令 —— 清掉停顿计数
      session.stallNudges = 0;

      // 路由轮:自动轮 routerEl 是隐藏的,直接删掉(用户只看进度条);编辑轮降级成淡灰小字保留
      if (isEdit) { routerEl.className = 'router-round'; routerEl.textContent = cleanedText || '(参考资料)'; }
      else { routerEl.remove(); }

      // === C. 按 key 解析 + 校验(支持一轮多个 key 同时加载) ===
      const resolved = [], missing = [];
      for (const key of keys) {
        const kb = (window.KB || {})[key];
        if (kb && typeof kb.text === 'string') resolved.push({ key: key, name: kb.name || key, group: kb.group || '', text: kb.text });
        else missing.push(key);
      }
      if (resolved.length === 0) {
        softAbort(out,
          `router 要求加载 [${keys.join(', ')}],但都不在前端知识库 window.KB 里(检查 kb-data.js 是否引入、key 是否写对)`,
          `未知库 ${keys.join(',')}`, cleanedText);
        return;
      }
      if (missing.length) {
        const w = document.createElement('div');
        w.className = 'multi-warn';
        w.textContent = `\u26A0 以下 key 不在知识库里,已跳过:${missing.join(', ')}`;
        out.appendChild(w);
      }

      // === D. 进度提示:自动轮更新阶段进度条(不再露 #key/字数);编辑轮给个轻提示 ===
      const stg = stageForKeys(resolved.map(r => r.key));
      let divider = null;
      if (isEdit) {
        divider = document.createElement('div');
        divider.className = 'load-divider';
        divider.textContent = '正在调取参考资料…';
        out.appendChild(divider);
        setStatus('调取参考资料…', 'busy');
      } else if (stg >= 0) {
        setStageActive(stg);
      } else {
        setStatus('正在准备资料…', 'busy');
      }
      maybeScroll();

      // === E. 本地取正文拼回喂块(静态资料,不再调子模型 LLM,一次注入多个) ===
      let totalChars = 0;
      const feedParts = [];
      for (const r of resolved) {
        totalChars += r.text.length;
        feedParts.push(`[知识库 #${r.key} \u00B7 ${r.name} 开始]\n` + r.text + `\n[知识库 #${r.key} \u00B7 ${r.name} 结束]`);
        session.loadedIds.add(r.key);
        session.totalLoads++;
      }
      const loadedKeys = resolved.map(r => r.key);
      session.lastExecutedId = loadedKeys.join(',');

      // === F. 编辑轮把轻提示标记完成;自动轮无可见分隔条(只有进度条) ===
      if (divider) { divider.className = 'load-divider done'; divider.textContent = '参考资料已就绪'; }

      // === G. 回喂给 router,进入下一轮(for 循环自然续跑)。
      //        cleanedText 在前,紧跟 <load_kb> 标签 + 各库正文,178 扫到末尾标签后有正文 → 判「已回喂」。 ===
      session.routerContent =
        session.routerContent + '\n\n' + cleanedText + '\n\n' +
        '<load_kb>' + loadedKeys.join(',') + '</load_kb>\n' + feedParts.join('\n\n');
    }

    // 编排超轮上限也走软中止:挂警告 + 弹回复框,不抛错
    softAbort(out,
      `编排已跑了 ${MAX_ORCH_ROUNDS} 轮还没收尾,router 可能没收住`,
      `超 ${MAX_ORCH_ROUNDS} 轮`,
      '');
    return;

  } catch (e) {
    if (e.name === 'AbortError') {
      setStatus('已中止', 'error');
    } else {
      setStatus('出错', 'error', e.message || '未知错误');
      toast('改文失败:' + (e.message || '未知错误'), 'error');
    }
  } finally {
    $('goBtn').disabled = false;
    $('stopBtn').classList.remove('show');
    currentAbort = null;
  }
}

/* ---------- 继续对话:回复框 / 用户回复视觉锚点 ---------- */

function showReplyBox(options) {
  const forceVisible = !!(options && options.forceVisible);
  removeReplyBox();
  const out = $('outputText');
  const box = document.createElement('div');
  box.className = 'reply-box';
  box.id = 'replyBox';

  const label = document.createElement('span');
  label.className = 'reply-box-label';
  label.textContent = '继续对话 · CONTINUE';
  box.appendChild(label);

  const row = document.createElement('div');
  row.className = 'reply-box-row';

  const ta = document.createElement('textarea');
  ta.className = 'reply-input';
  ta.id = 'replyInput';
  ta.placeholder = '留空点继续=按上方建议命令执行;也可直接写修改要求或追问…(回车发送,Shift+Enter 换行)';
  row.appendChild(ta);

  const btn = document.createElement('button');
  btn.className = 'reply-send';
  btn.id = 'replySend';
  btn.textContent = '继 续';
  btn.addEventListener('click', () => continueRewrite(ta.value));
  row.appendChild(btn);

  ta.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    // 输入法组词中的回车用于选字/上屏,绝不当发送(中文/日文输入必须避开)
    if (e.isComposing || e.keyCode === 229) return;
    // Shift+Enter 换行,交给默认行为
    if (e.shiftKey) return;
    // 普通回车(以及 Ctrl/Cmd+Enter)→ 发送
    e.preventDefault();
    continueRewrite(ta.value);
  });

  box.appendChild(row);
  out.appendChild(box);

  // 聚焦输入框。普通输出不打断审阅;历史恢复必须把续写框带进视野,
  // 否则长内容时用户会误以为没有对话框,转而点"开始改文"导致重开。
  setTimeout(() => {
    if (forceVisible) {
      forceScrollBottom();
      ta.focus();
    } else {
      ta.focus({ preventScroll: true });
    }
  }, 30);

  // 关键:不再无条件 forceScrollBottom()。
  //   · 用户本来就贴底跟读  → 顺势把回复框带进视野(forceScrollBottom)
  //   · 用户正在上方审阅原文/译文 → 绝不打断,只在右下角亮起「↓」箭头,
  //     用户想看最新内容时点一下即可到底。
  if (forceVisible) forceScrollBottom();
  else if (_stickBottom) forceScrollBottom();
  else updateToBottomFab();
}

function removeReplyBox() {
  const box = document.getElementById('replyBox');
  if (box) box.remove();
}

/** 把用户的回复以"你 · YOU + 内容"的形式压到输出流末尾,做对话锚点。
 *  这只是 UI 显示,不参与发到后端的 content —— content 那边是裸文本拼接。 */
function appendUserReplyToOutput(text) {
  const out = $('outputText');

  node.className = 'user-reply';
  const lbl = document.createElement('span');
  lbl.className = 'user-reply-label';
  lbl.textContent = '你 · YOU';
  node.appendChild(lbl);
  node.appendChild(document.createTextNode(text));
  out.appendChild(node);
  forceScrollBottom();
}

/** 编排出问题(重复加载/未知模型/超轮上限等)时的软中止处理:
 *  - 在输出区压一条橙色警告,告诉用户发生了什么 + 该怎么救
 *  - 保存当前 cleanedText 到 session.lastRouterOutput,供用户回复时拼回上下文
 *  - 把状态栏改成"需要引导"
 *  - 弹出回复框,让用户给 router 一个明确指示
 *
 *  与抛错的区别:session 状态保留,goBtn/stopBtn 通过 finally 复位,
 *  用户可以选择(a) 在回复框输入引导继续,或 (b) 点【开始改文】重开。 */
function softAbort(out, reason, statusTag, lastRouterCleaned) {
  removeNextStepPanel();  // 万一软中止时面板还在,先拿掉

  const warn = document.createElement('div');
  warn.className = 'multi-warn';
  warn.textContent = `⚠ ${reason} — 可在下面回复给个明确指示来引导 router(例如「继续 161」/「换 A2 路径」/「别加载了直接写正文」),或点【开始改文】重开。`;
  out.appendChild(warn);
  forceScrollBottom();

  // 把这一轮 router 自己说的话存下来,等用户回复时拼回上下文
  session.lastRouterOutput = lastRouterCleaned || '';

  clearRunBanner(); finishStageBar();
  setStatus('需要引导', 'error', statusTag);
  showReplyBox();
}

/* ---------- 「下一步」确认面板 ---------- */

/** 在输出区底部弹出"下一步"面板,返回一个 Promise。
 *  Promise 在用户点击 [继续] 按钮时 resolve:
 *    - 输入框为空        → { continue: true }
 *    - 输入框有引导文本  → { continue: false, redirect: '...' }
 *  在 currentAbort 触发时 reject AbortError(走 catch 干净退出)。
 *
 *  调用方需要在两类位置 await 它,把"自动连环执行"切成"一次一停":
 *  - 路由轮发出 <load_model> 之后、调子模型之前
 *  - 子模型加载完之后、下一轮路由之前 */
function waitForUserConfirm(out, plannedActionHTML) {
  return new Promise((resolve, reject) => {
    let abortListener = null;
    const cleanup = () => {
      removeNextStepPanel();
      if (abortListener && currentAbort) {
        currentAbort.signal.removeEventListener('abort', abortListener);
      }
    };

    showNextStepPanel(out, plannedActionHTML, {
      onContinue: () => { cleanup(); resolve({ continue: true }); },
      onRedirect: (text) => { cleanup(); resolve({ continue: false, redirect: text }); },
    });

    // 等待期间允许 stopBtn 中断
    if (currentAbort) {
      abortListener = () => { cleanup(); reject(new DOMException('aborted', 'AbortError')); };
      currentAbort.signal.addEventListener('abort', abortListener);
    }

    // 等待期间在状态栏标明
    setStatus('等待确认 · 点继续或给引导', 'busy');
  });
}

function showNextStepPanel(out, plannedActionHTML, { onContinue, onRedirect }) {
  removeNextStepPanel();
  // 等待面板出现时也把回复框拿掉(两种 UI 不并存)
  removeReplyBox();

  const panel = document.createElement('div');
  panel.className = 'next-step-panel';
  panel.id = 'nextStepPanel';

  const label = document.createElement('div');
  label.className = 'next-step-label';
  label.textContent = '等待确认 · CONFIRM';
  panel.appendChild(label);

  const action = document.createElement('div');
  action.className = 'next-step-action';
  action.innerHTML = plannedActionHTML;  // 调用方负责转义
  panel.appendChild(action);

  const controls = document.createElement('div');
  controls.className = 'next-step-controls';

  const ta = document.createElement('textarea');
  ta.className = 'next-step-input';
  // placeholder 把两种行为讲清楚:空 = 确认 / 有字 = 重新判断
  ta.placeholder = '留空按回车 = 确认执行 · 想换方向或反馈问题就在这里直接写,AI 会重新判断该用哪个知识库修复(Shift+Enter 换行)';
  controls.appendChild(ta);

  const btn = document.createElement('button');
  btn.className = 'next-step-go';
  btn.textContent = '确认执行';
  controls.appendChild(btn);

  panel.appendChild(controls);

  // 实时小提示:告诉用户「现在按下按钮会发生什么」
  const hint = document.createElement('div');
  hint.className = 'next-step-hint';
  hint.innerHTML = '当前为 <b>确认</b> 状态 · 直接按回车或点【确认执行】即可按计划继续';
  panel.appendChild(hint);

  // 输入框内容变化 → 切换按钮态(确认 / 重新判断)
  const refreshState = () => {
    const hasText = ta.value.trim().length > 0;
    if (hasText) {
      btn.classList.add('redirect');
      btn.textContent = '提交修正给 AI';
      label.textContent = '调整方向 · REDIRECT';
      hint.classList.add('redirect');
      hint.innerHTML =
        '当前为 <b>修正</b> 状态 · 按回车提交后,系统会把你写的内容送回 AI,由它重新判断该调用哪个知识库来响应你';
    } else {
      btn.classList.remove('redirect');
      btn.textContent = '确认执行';
      label.textContent = '等待确认 · CONFIRM';
      hint.classList.remove('redirect');
      hint.innerHTML = '当前为 <b>确认</b> 状态 · 直接按回车或点【确认执行】即可按计划继续';
    }
  };
  ta.addEventListener('input', refreshState);

  // 点击行为按当前内容判定:有内容 → 走 redirect 让 178 重新判断;空 → continue
  btn.addEventListener('click', () => {
    const text = ta.value.trim();
    if (text) onRedirect(text);
    else onContinue();
  });

  ta.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    // 输入法组词中的回车用于选字/上屏,不触发确认
    if (e.isComposing || e.keyCode === 229) return;
    // Shift+Enter 换行,交给默认行为
    if (e.shiftKey) return;
    // 普通回车(以及 Ctrl/Cmd+Enter)→ 点按钮:有内容就引导,没内容就继续
    e.preventDefault();
    btn.click();
  });

  out.appendChild(panel);

  setTimeout(() => ta.focus(), 30);
  forceScrollBottom();
}

function removeNextStepPanel() {
  const p = document.getElementById('nextStepPanel');
  if (p) p.remove();
}

/** 把一段 SSE 文本块解析为 { event, data } */
function parseSSEBlock(block) {
  const lines = block.split(/\r?\n/);          // 兼容 \n 与 \r\n
  let event = 'message';
  const dataLines = [];
  for (const line of lines) {
    if (line.startsWith('event:'))      event = line.slice(6).trim();
    else if (line.startsWith('data:'))  dataLines.push(line.slice(5).replace(/^ /, ''));  // 按 SSE 规范只剥一个前导空格,保留正文里的空格
    else if (line.startsWith(':'))      { /* SSE 注释行，忽略 */ }
    /* id: / retry: 等字段直接忽略 */
  }
  if (!dataLines.length) return { event, data: null };
  const rawJoined = dataLines.join('\n');
  const rawTrim   = rawJoined.trim();
  if (rawTrim === '[DONE]') return { event: 'done', data: {} };   // OpenAI 结束哨兵
  let data;
  try { data = JSON.parse(rawTrim); }            // 是 JSON 就解析
  catch { data = { content: rawJoined }; }       // 不是 JSON 就当纯文本(保留原样空格)
  return { event, data };
}

function stopRewrite() {
  if (currentAbort) currentAbort.abort();
}
