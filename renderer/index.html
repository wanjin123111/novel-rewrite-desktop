<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>改文 · 小说去AI味</title>
<style>
  /* ============ 设计变量 ============ */
  :root {
    --paper:        #f4efe4;     /* 暖米色，像旧稿纸 */
    --paper-deep:   #ebe4d2;
    --ink:          #1f1c17;     /* 主文字，深墨 */
    --ink-soft:     #4a463e;
    --ink-faint:    #8b8676;
    --rule:         #d8d0bb;     /* 分隔线 */
    --vermillion:   #9a3434;     /* 朱砂红，操作色 */
    --vermillion-d: #7a2828;
    --shadow:       0 1px 0 rgba(31,28,23,.04), 0 8px 28px rgba(31,28,23,.08);
    --shadow-deep:  0 24px 60px rgba(31,28,23,.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", "宋体", serif;
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* 整页带一点纸的纹理 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(154,52,52,.04), transparent),
      radial-gradient(900px 500px at 100% 110%, rgba(31,28,23,.05), transparent);
  }

  button, input, textarea, select {
    font-family: inherit; font-size: inherit; color: inherit;
  }

  ::selection { background: rgba(154,52,52,.18); }

  /* ============ 登录页 ============ */
  .login-stage {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 380px;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 44px 40px 36px;
    box-shadow: var(--shadow-deep);
    position: relative;
  }
  /* 卡片左上角小红印 */
  .login-card::before {
    content: "改";
    position: absolute; top: -14px; left: 32px;
    width: 30px; height: 30px;
    background: var(--vermillion);
    color: #fbf7eb;
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(122,40,40,.4);
    letter-spacing: 0;
  }
  .login-title {
    margin: 0 0 4px;
    font-size: 22px; font-weight: 600; letter-spacing: 4px;
    color: var(--ink);
  }
  .login-sub {
    margin: 0 0 32px;
    font-size: 12px; letter-spacing: 2px;
    color: var(--ink-faint);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 11px; letter-spacing: 3px;
    color: var(--ink-faint);
    margin-bottom: 6px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    text-transform: uppercase;
  }
  .field input {
    width: 100%;
    padding: 8px 0 9px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    outline: none;
    transition: border-color .2s;
    font-size: 15px;
  }
  .field input:focus {
    border-bottom-color: var(--vermillion);
  }
  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 28px;
    padding: 12px 0;
    background: var(--ink);
    color: var(--paper);
    border: none; border-radius: 1px;
    font-size: 14px; letter-spacing: 8px; padding-left: 8px;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-primary:hover { background: var(--vermillion); }
  .btn-primary:disabled { background: var(--ink-faint); cursor: wait; }

  .login-err {
    margin-top: 14px;
    padding: 8px 12px;
    background: rgba(154,52,52,.08);
    border-left: 2px solid var(--vermillion);
    color: var(--vermillion-d);
    font-size: 13px;
    display: none;
  }
  .login-err.show { display: block; }

  /* ============ 主工作台 ============ */
  .app { position: fixed; inset: 0; display: none; flex-direction: column; }
  .app.active { display: flex; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    height: 52px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    flex-shrink: 0;
    z-index: 2;
  }
  .brand {
    font-size: 16px; letter-spacing: 4px; font-weight: 600;
    color: var(--ink);
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark {
    width: 22px; height: 22px;
    background: var(--vermillion);
    color: var(--paper);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .topbar .spacer { flex: 1; }
  .meta {
    display: flex; align-items: center; gap: 18px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .meta b { color: var(--vermillion-d); font-weight: 600; }
  .icon-btn {
    background: transparent; border: 1px solid transparent;
    width: 28px; height: 28px; cursor: pointer;
    border-radius: 2px;
    color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--paper-deep); color: var(--ink); }

  /* 控制条（模型选择 + 操作） */
  .controls {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    flex-shrink: 0;
  }
  .model-select {
    flex: 1; max-width: 320px;
    padding: 8px 14px;
    border: 1px solid var(--rule);
    background: #fbf7eb;
    border-radius: 1px;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
    font-size: 13px;
  }
  .model-select:focus, .model-select:hover { border-color: var(--ink-faint); }

  /* 路由徽标：固定 178,代替原来的 router 下拉框 */
  .router-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 14px 7px 10px;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--vermillion);
    border-radius: 1px;
    font-size: 13px;
    color: var(--ink);
    max-width: 320px;
  }
  .router-pill-tag {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--vermillion); text-transform: uppercase;
    padding-right: 8px;
    border-right: 1px solid var(--rule);
  }
  .router-pill-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .router-pill.miss {
    border-left-color: var(--ink-faint);
    color: var(--ink-faint);
  }
  .router-pill.miss .router-pill-tag {
    color: var(--ink-faint);
  }

  /* 原大纲保护开关:二段式切换,沿用路由徽标的视觉语言 */
  .outline-pill {
    display: inline-flex; align-items: stretch;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    border-radius: 1px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .outline-pill-tag {
    display: inline-flex; align-items: center;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--ink-faint); text-transform: uppercase;
    padding: 0 9px;
    background: var(--paper-deep);
    border-right: 1px solid var(--rule);
    white-space: nowrap;
  }
  .outline-seg {
    appearance: none; border: none; background: transparent;
    padding: 7px 13px;
    font-size: 13px; color: var(--ink-soft);
    cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s;
    font-family: inherit;
  }
  .outline-seg + .outline-seg { border-left: 1px solid var(--rule); }
  .outline-seg:hover { background: var(--paper-deep); }
  /* 保留=朱砂(守护态);重构=深墨(主动放开),用颜色区分语义 */
  #outlineKeepBtn.active    { background: var(--vermillion); color: #fbf7eb; }
  #outlineKeepBtn.active:hover { background: var(--vermillion-d); }
  #outlineRebuildBtn.active { background: var(--ink-soft);    color: #fbf7eb; }
  #outlineRebuildBtn.active:hover { background: var(--ink); }

  .btn-go {
    padding: 10px 28px;
    background: var(--vermillion);
    color: #fbf7eb;
    border: none; border-radius: 1px;
    font-size: 13px; letter-spacing: 6px; padding-right: 22px;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-go:hover { background: var(--vermillion-d); }
  .btn-go:disabled { background: var(--ink-faint); cursor: not-allowed; }
  .btn-stop {
    padding: 10px 22px;
    background: transparent;
    color: var(--vermillion-d);
    border: 1px solid var(--vermillion);
    border-radius: 1px;
    font-size: 13px; letter-spacing: 4px;
    cursor: pointer;
    display: none;
  }
  .btn-stop.show { display: inline-block; }
  .btn-stop:hover { background: rgba(154,52,52,.08); }

  /* 主区域：左右分栏 */
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    overflow: hidden;
    min-height: 0;
  }
  .divider {
    background: var(--rule);
  }
  .pane {
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
    background: var(--paper);
    position: relative;   /* 作为「跳到底部」浮动箭头的定位锚点 */
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px 8px;
    font-size: 11px; letter-spacing: 4px;
    color: var(--ink-faint);
    text-transform: uppercase;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    flex-shrink: 0;
  }
  .pane-head .count { color: var(--ink-faint); font-size: 11px; }
  .pane-body {
    flex: 1;
    overflow: auto;
    padding: 6px 32px 32px;
    min-height: 0;
  }

  /* 「跳到底部」浮动箭头：固定在输出面板右下角，不随内容滚动，
     只在「下方还有未看到的内容」（未贴底）时浮现，点一下滚到底。 */
  .to-bottom-fab {
    position: absolute; right: 22px; bottom: 22px;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 50%;
    box-shadow: 0 4px 14px rgba(31,28,23,.18);
    cursor: pointer; z-index: 30;
    font-size: 18px; line-height: 1;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .to-bottom-fab.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .to-bottom-fab:hover { background: #fbf7eb; }

  /* 原文输入 */
  #inputText {
    width: 100%; height: 100%;
    border: none; outline: none; resize: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit; font-size: 15.5px; line-height: 1.85;
    padding: 4px 0;
  }
  #inputText::placeholder { color: var(--ink-faint); font-style: italic; }

  /* 输出区 */
  #outputText {
    white-space: pre-wrap; word-break: break-word;
    font-size: 15.5px; line-height: 1.85;
    color: var(--ink);
    min-height: 100%;
  }
  #outputText:empty::before {
    content: "结果会在这里逐字显现……";
    color: var(--ink-faint); font-style: italic;
  }
  /* 闪动光标 */
  .caret {
    display: inline-block; width: 2px; height: 1.15em;
    background: var(--vermillion);
    transform: translateY(3px);
    margin-left: 1px;
    animation: blink 1s steps(2,end) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* think 块 */
  .think {
    margin-bottom: 16px;
    padding: 12px 14px;
    background: rgba(31,28,23,.04);
    border-left: 2px solid var(--ink-faint);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  .think-label {
    display: block;
    font-size: 10px; letter-spacing: 3px; color: var(--ink-faint);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  /* ============ 编排:路由轮 vs 正文轮 ============ */
  /* 中间路由轮（router 只为发 load_model 的那几轮）—— 视觉淡化 */
  .router-round {
    display: block;
    margin: 4px 0;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--ink-faint);
    opacity: 0.65;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  /* 最终正文轮 —— 完整文本样式 */
  .final-round {
    display: block;
    margin-top: 8px;
    white-space: pre-wrap; word-break: break-word;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--ink);
  }
  /* 子模型(知识库)轮 —— 大字衬线，与终稿字号一致，方便阅读 */
  .sub-round {
    display: block;
    margin: 8px 0 14px;
    padding: 12px 18px;
    background: rgba(31, 28, 23, .03);
    border-left: 2px solid var(--rule);
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap; word-break: break-word;
  }

  /* 「下一步」确认面板:每一次模型调用结束后弹出,等用户点继续 */
  .next-step-panel {
    display: block;
    margin-top: 24px;
    padding: 14px 18px;
    background: rgba(154, 52, 52, .045);
    border: 1px solid rgba(154, 52, 52, .25);
    border-left: 3px solid var(--vermillion);
    border-radius: 1px;
  }
  .next-step-label {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--vermillion);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .next-step-action {
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .next-step-action b {
    color: var(--vermillion-d);
    font-weight: 600;
  }
  .next-step-controls {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .next-step-input {
    flex: 1;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    border-radius: 1px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 38px;
    max-height: 120px;
    transition: border-color .15s;
  }
  .next-step-input:focus { border-color: var(--vermillion); }
  .next-step-input::placeholder { color: var(--ink-faint); font-style: italic; font-size: 12.5px; }
  .next-step-go {
    padding: 0 22px;
    background: var(--vermillion);
    color: #fbf7eb;
    border: none;
    border-radius: 1px;
    font-size: 13px;
    letter-spacing: 4px;
    padding-right: 18px;
    cursor: pointer;
    min-height: 38px;
    transition: background .2s;
  }
  .next-step-go:hover { background: var(--vermillion-d); }
  /* 用户在输入框写了引导词 → 按钮变态:不再是「确认继续」,而是「让 AI 重新判断」 */
  .next-step-go.redirect {
    background: #2c3a4a;
    letter-spacing: 2px;
    padding: 0 18px;
  }
  .next-step-go.redirect:hover { background: #1c2734; }
  /* 实时小提示行,告诉用户当前按下按钮会发生什么 */
  .next-step-hint {
    margin-top: 8px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
    letter-spacing: .3px;
  }
  .next-step-hint.redirect {
    color: #4a5868;
  }
  .next-step-hint b {
    color: var(--ink);
    font-weight: 600;
  }
  .next-step-hint.redirect b {
    color: #1c2734;
  }

  /* 加载分隔条:── 加载知识库 #163 · 文风 · 风格 DNA 详解 ── */
  .load-divider {
    display: block;
    margin: 14px 0 6px;
    padding: 2px 0;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--vermillion);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    text-align: center;
  }
  .load-divider.done {
    color: var(--ink-faint);
  }
  .load-divider::before,
  .load-divider::after {
    content: "──";
    margin: 0 8px;
    color: inherit;
    opacity: .55;
  }

  /* 「模型违反一轮一个」的橙色告警条 */
  .multi-warn {
    display: block;
    margin: 8px 0;
    padding: 6px 10px;
    background: rgba(184, 115, 51, .12);
    border-left: 2px solid #b87333;
    font-size: 12px;
    color: #7a4c1f;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }

  /* ============ 继续对话 ============ */
  /* 终稿(包括反问句)一出,右栏底部会冒出这个回复框,
     用户键入回复 → 把回复拼到 routerContent 末尾 → 178 接着跑下一轮。 */
  .reply-box {
    display: block;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px dashed var(--rule);
  }
  .reply-box-label {
    display: block;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .reply-box-row {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .reply-input {
    flex: 1;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    border-radius: 1px;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 44px;
    max-height: 160px;
    transition: border-color .15s;
  }
  .reply-input:focus { border-color: var(--vermillion); }
  .reply-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .reply-send {
    padding: 0 22px;
    background: var(--vermillion);
    color: #fbf7eb;
    border: none; border-radius: 1px;
    font-size: 13px; letter-spacing: 4px; padding-right: 18px;
    cursor: pointer;
    min-height: 44px;
    transition: background .2s;
  }
  .reply-send:hover { background: var(--vermillion-d); }
  .reply-send:disabled { background: var(--ink-faint); cursor: not-allowed; }

  /* 用户回复:在 router 上下一轮的中间,作为视觉锚点 */
  .user-reply {
    display: block;
    margin: 22px 0 8px;
    padding: 9px 14px;
    background: rgba(154, 52, 52, .055);
    border-left: 2px solid var(--vermillion);
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap; word-break: break-word;
  }
  .user-reply-label {
    display: inline-block;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--vermillion);
    text-transform: uppercase;
    margin-right: 10px;
    vertical-align: baseline;
  }

  /* 底部状态条 */
  .statusbar {
    height: 24px;
    padding: 0 24px;
    border-top: 1px solid var(--rule);
    background: var(--paper-deep);
    display: flex; align-items: center;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    letter-spacing: 1px;
  }
  .statusbar .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-faint);
    margin-right: 6px;
  }
  .statusbar.busy .dot { background: var(--vermillion); animation: pulse 1.2s ease-in-out infinite; }
  .statusbar.done .dot { background: #4a7c3a; }
  .statusbar.error .dot { background: var(--vermillion); }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .3; }
  }
  .statusbar .spacer { flex: 1; }

  /* Toast */
  .toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 20px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    font-size: 13px; letter-spacing: 2px;
    box-shadow: var(--shadow-deep);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--vermillion); }

  /* 弹出菜单（设置） */
  .menu-pop {
    position: absolute; right: 16px; top: 48px;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    padding: 6px 0;
    min-width: 180px;
    display: none;
    z-index: 20;
  }
  .menu-pop.show { display: block; }
  .menu-pop button {
    display: block; width: 100%;
    padding: 8px 18px;
    text-align: left;
    background: transparent; border: none;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .menu-pop button:hover { background: var(--paper-deep); color: var(--ink); }
  .menu-pop hr { border: none; border-top: 1px solid var(--rule); margin: 4px 0; }

  /* 移动响应（虽然主打桌面，但小屏也别炸） */
  @media (max-width: 760px) {
    .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 1px 1fr; }
  }

  /* ============ 弹窗 ============ */
  .modal {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(31,28,23,.42);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    backdrop-filter: blur(2px);
  }
  .modal.show { display: flex; }
  .modal-card {
    width: 100%; max-width: 720px; max-height: 80vh;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow-deep);
    display: flex; flex-direction: column;
    border-radius: 2px;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--rule);
    font-size: 14px; letter-spacing: 3px;
    color: var(--ink);
  }
  .modal-body {
    flex: 1; overflow: auto;
    padding: 16px 18px 8px;
    min-height: 200px;
    display: flex; flex-direction: column;
  }
  .modal-hint {
    margin: 0 0 10px;
    font-size: 12px; color: var(--ink-faint);
    line-height: 1.6;
  }
  #promptModalText {
    flex: 1; min-height: 280px;
    width: 100%;
    padding: 12px 14px;
    background: var(--paper);
    border: 1px solid var(--rule);
    outline: none; resize: vertical;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 13px; line-height: 1.7;
    color: var(--ink);
    border-radius: 1px;
  }
  #promptModalText:focus { border-color: var(--ink-faint); }
  .modal-foot {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px 14px;
    border-top: 1px solid var(--rule);
  }
  .modal-count {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; color: var(--ink-faint);
    letter-spacing: 1px;
  }
  .btn-ghost {
    padding: 7px 16px;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    border-radius: 1px;
    cursor: pointer;
    font-size: 13px; letter-spacing: 2px;
  }
  .btn-ghost:hover { background: var(--paper-deep); color: var(--ink); }
  .btn-primary-sm {
    padding: 7px 22px;
    background: var(--ink);
    color: var(--paper);
    border: none; border-radius: 1px;
    cursor: pointer;
    font-size: 13px; letter-spacing: 4px;
  }
  .btn-primary-sm:hover { background: var(--vermillion); }

  /* ============ 导入 / 导出 ============ */
  /* 给 .pane-head 加 position:relative,作为导出菜单的锚点 */
  .pane-head { position: relative; }

  .pane-actions {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .pane-action {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    padding: 3px 10px 3px 9px;
    font-family: inherit;
    font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 1px;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .pane-action:hover {
    color: var(--vermillion);
    border-color: var(--vermillion);
    background: rgba(154,52,52,.05);
  }
  /* 检测到当前有可单独导出的选区时,把导出按钮自动点亮成朱砂红,
   * 让用户一眼看见「可以仅导出选中」这个隐藏的 affordance */
  .pane-action.has-selection {
    color: var(--vermillion);
    border-color: var(--vermillion);
    background: rgba(154,52,52,.05);
  }
  .pane-action.has-selection:hover {
    background: rgba(154,52,52,.12);
  }
  .pane-action:disabled {
    opacity: .45; cursor: not-allowed;
    color: var(--ink-faint); border-color: var(--rule); background: transparent;
  }
  .pane-action svg {
    width: 12px; height: 12px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* 导出格式弹出菜单(挂在右侧 pane-head 下方) */
  .io-menu {
    position: absolute;
    top: calc(100% - 2px); right: 24px;
    background: #fbf7eb;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    padding: 6px 0;
    min-width: 180px;
    display: none;
    z-index: 40;
    letter-spacing: normal;
    text-transform: none;
  }
  .io-menu.show { display: block; }
  .io-menu button {
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
    width: 100%;
    padding: 8px 16px;
    text-align: left;
    background: transparent; border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px; letter-spacing: normal;
    color: var(--ink-soft);
  }
  .io-menu button:hover { background: var(--paper-deep); color: var(--ink); }
  .io-menu .ext {
    color: var(--ink-faint);
    font-size: 11px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  /* 菜单分节标题 (例: 导出范围) */
  .io-menu-section {
    padding: 8px 16px 4px;
    font-size: 10px; letter-spacing: 3px;
    color: var(--ink-faint);
    text-transform: uppercase;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  .io-menu-hr {
    border: none; border-top: 1px solid var(--rule);
    margin: 4px 0;
  }
  /* 范围切换 (radio 风格) */
  .io-menu .io-menu-radio {
    justify-content: flex-start;
    gap: 0;
    padding-left: 14px;
  }
  .io-menu-radio .dot {
    width: 9px; height: 9px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 50%;
    margin-right: 10px;
    flex-shrink: 0;
    background: transparent;
    box-sizing: border-box;
    transition: border-color .15s, background .15s;
  }
  .io-menu-radio .label { flex: 1; text-align: left; }
  .io-menu-radio.active { color: var(--ink); }
  .io-menu-radio.active .dot {
    border-color: var(--vermillion);
    background: var(--vermillion);
    box-shadow: inset 0 0 0 1.5px #fbf7eb;
  }

  /* ============ 历史记录 ============ */
  .history-modal .modal-card {
    max-width: 760px; height: 76vh; max-height: 720px;
  }
  .history-modal .modal-body {
    padding: 0;
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
  }
  .history-list {
    flex: 1; overflow-y: auto;
    padding: 4px 0;
  }
  .history-list-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; min-height: 200px;
    color: var(--ink-faint); font-style: italic;
    letter-spacing: 2px;
    text-align: center; padding: 0 24px;
  }
  .history-item {
    position: relative;
    padding: 14px 88px 14px 22px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    transition: background .15s ease;
  }
  .history-item:hover { background: var(--paper-deep); }
  .history-item:last-child { border-bottom: none; }
  .history-item-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .history-item-title {
    font-size: 14px;
    color: var(--ink);
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-weight: normal;
  }
  .history-item-meta {
    flex-shrink: 0;
    font-size: 11px; color: var(--ink-faint);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    letter-spacing: 1px;
  }
  .history-item-preview {
    font-size: 12px;
    color: var(--ink-faint);
    line-height: 1.7;
    overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    max-height: 2.4em;
  }
  .history-item-actions {
    position: absolute;
    top: 12px; right: 14px;
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .history-item:hover .history-item-actions,
  .history-item:focus-within .history-item-actions { opacity: 1; }
  .history-action-btn {
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    width: 26px; height: 26px;
    border-radius: 1px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .history-action-btn:hover {
    color: var(--vermillion); border-color: var(--vermillion);
    background: rgba(154,52,52,.05);
  }
  .history-action-btn svg {
    width: 13px; height: 13px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .history-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-top: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .history-toolbar .spacer { flex: 1; }
  .history-toolbar button {
    background: transparent;
    border: 1px solid var(--rule);
    padding: 6px 14px;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 2px;
    font-family: inherit;
    border-radius: 1px;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .history-toolbar button:hover {
    color: var(--vermillion); border-color: var(--vermillion);
    background: rgba(154,52,52,.04);
  }
  .history-toolbar button.danger:hover {
    color: #fff; background: var(--vermillion); border-color: var(--vermillion);
  }
  .history-count-pill {
    font-size: 11px; color: var(--ink-faint);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    letter-spacing: 1px;
  }
  /* 自动轮阶段进度条 */
  .stage-bar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:0 0 16px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font-size:12.5px;line-height:1.5;box-shadow:0 10px 16px -12px rgba(31,28,23,.35);}
  .stage-chip{padding:3px 10px;border-radius:999px;color:#a59c90;white-space:nowrap;transition:all .2s;}
  .stage-chip.done{color:#5f7a55;}
  .stage-chip.done::before{content:'\2713 ';}
  .stage-chip.active{background:var(--vermillion);color:#fff;font-weight:600;box-shadow:0 0 0 3px rgba(154,52,52,.15);}
  .stage-chip.active::after{content:'';display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:#fff;animation:runpulse 1s infinite;vertical-align:middle;}
  .stage-chip.done{transition:color .25s;}
  .stage-arrow{color:#d8cfc1;font-size:11px;}
  .auto-internal{display:none;}
  /* 输出区顶部「处理中」横幅(全程可见,别让用户以为卡死) */
  .run-banner{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:9px;margin:0 0 16px;padding:9px 15px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:13px;color:var(--vermillion);box-shadow:0 10px 16px -12px rgba(31,28,23,.35);}
  .run-dot{width:8px;height:8px;border-radius:50%;background:var(--vermillion);animation:runpulse 1s infinite;flex:none;}
  @keyframes runpulse{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="loginStage" class="login-stage">
  <div class="login-card">
    <h1 class="login-title">改 · 文</h1>
    <p class="login-sub">NOVEL  /  REWRITE  /  V0.1</p>

    <div class="field">
      <label>用户名</label>
      <input id="loginUser" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
    </div>

    <div id="loginErr" class="login-err"></div>

    <button id="loginBtn" class="btn-primary">登 录</button>
  </div>
</div>

<!-- ============ 主工作台 ============ -->
<div id="app" class="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand"><span class="brand-mark">改</span><span>改文</span></div>
    <div class="spacer"></div>
    <div class="meta">
      <span>积分 <b id="metaPoints">--</b></span>
      <span id="metaUser">--</span>
    </div>
    <button class="icon-btn" id="menuToggle" title="菜单">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
    <div id="menuPop" class="menu-pop">
      <button id="menuRefresh">刷新模型列表</button>
      <hr/>
      <button id="menuLogout">退出登录</button>
    </div>
  </div>

  <!-- 控制条 -->
  <div class="controls">
    <div id="routerPill" class="router-pill" title="路由模型按模型标识 script-reasoning-step13888 调用,负责反问/编排/按 load_kb 加载知识库">
      <span class="router-pill-tag">路由</span>
      <span id="routerPillName" class="router-pill-name">改文路由</span>
    </div>
    <!-- 原大纲保护开关:决定 router 能否重排用户自带的大纲/分集结构 -->
    <div id="outlinePill" class="outline-pill"
         title="保留原文 = 不动你的大纲与事件/分集顺序,只在原结构上改写润色,想动结构会先列「优化建议」给你确认;系统重构 = 允许按爆款方法论自由重排节奏与结构">
      <span class="outline-pill-tag">大纲</span>
      <button type="button" id="outlineKeepBtn"    class="outline-seg active" data-mode="preserve">保留原文</button>
      <button type="button" id="outlineRebuildBtn" class="outline-seg"        data-mode="restructure">系统重构</button>
    </div>
    <!-- 旧的模型下拉框保留在 DOM 但隐藏,避免引用断裂;路由由 ROUTER_MODEL_KEY 模型标识锁死 -->
    <select id="modelSelect" class="model-select" style="display:none">
      <option value="178">178</option>
    </select>
    <!-- 风格预设下拉 + 提示词编辑钮 也隐藏 — 178 的系统提示词在后端,前端不再拼任何风格壳 -->
    <select id="styleSelect" class="model-select" title="选择改写风格" style="display:none; max-width:220px">
      <option value="">加载风格…</option>
    </select>
    <button id="viewPromptBtn" class="icon-btn" title="查看当前风格的提示词" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </button>
    <div class="spacer" style="flex:1"></div>
    <button id="historyBtn" class="btn-ghost" title="查看之前的对话历史(自动保存在本地浏览器)">历 史</button>
    <button id="videoSnifferBtn" class="btn-ghost" title="打开内置浏览器,嗅探当前网页里的视频/音频资源">视频抓取</button>
    <button id="newSessionBtn" class="btn-ghost" title="清空原文与译文,开始全新的一篇(当前对话会被清掉)">新 会 话</button>
    <button id="stopBtn" class="btn-stop">中 止</button>
    <button id="goBtn" class="btn-go">开 始 改 文</button>
  </div>

  <!-- 双栏工作区 -->
  <div class="workspace">
    <div class="pane">
      <div class="pane-head">
        <span>原文 · ORIGIN</span>
        <div class="pane-actions">
          <span class="count" id="inputCount">0 字</span>
          <button class="pane-action" id="importBtn" type="button"
                  title="从文件导入到原文(支持 .txt / .md / .docx)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v12"/><path d="M6 10l6 6 6-6"/><path d="M4 20h16"/>
            </svg>
            <span>导 入</span>
          </button>
        </div>
      </div>
      <div class="pane-body">
        <textarea id="inputText" placeholder="把你的原文粘到这里……&#10;&#10;支持长文,无字符上限(实际容量取决于后端模型上下文窗口)。"></textarea>
      </div>
    </div>
    <div class="divider"></div>
    <div class="pane">
      <div class="pane-head">
        <span>改后 · REVISED</span>
        <div class="pane-actions">
          <span class="count" id="outputCount">0 字</span>
          <button class="pane-action" id="exportBtn" type="button"
                  title="把改后的内容导出为文件" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20V8"/><path d="M6 14l6-6 6 6"/><path d="M4 4h16"/>
            </svg>
            <span>导 出</span>
          </button>
        </div>
        <div id="exportMenu" class="io-menu" role="menu">
          <div id="exportScopeSection" style="display:none">
            <div class="io-menu-section" id="exportScopeHint">导出范围</div>
            <button type="button" class="io-menu-radio" data-scope="selection" role="menuitemradio">
              <span class="dot"></span>
              <span class="label" id="exportScopeSelLabel">仅导出选中</span>
              <span class="ext" id="exportScopeSelCount">0 字</span>
            </button>
            <button type="button" class="io-menu-radio" data-scope="all" role="menuitemradio">
              <span class="dot"></span>
              <span class="label" id="exportScopeAllLabel">导出全部</span>
              <span class="ext" id="exportScopeAllCount">0 字</span>
            </button>
            <hr class="io-menu-hr"/>
          </div>
          <button type="button" data-fmt="txt"  role="menuitem">纯文本<span class="ext">.txt</span></button>
          <button type="button" data-fmt="md"   role="menuitem">Markdown<span class="ext">.md</span></button>
          <button type="button" data-fmt="docx" role="menuitem">Word 文档<span class="ext">.docx</span></button>
          <button type="button" data-fmt="html" role="menuitem">HTML 网页<span class="ext">.html</span></button>
        </div>
      </div>
      <div class="pane-body">
        <div id="outputText"></div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar" id="statusbar">
    <span class="dot"></span>
    <span id="statusText">就绪</span>
    <span class="spacer"></span>
    <span id="statusExtra"></span>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- 导入用的隐藏 file input -->
<input id="importFileInput" type="file"
       accept=".txt,.md,.markdown,.docx,text/plain,text/markdown,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
       style="display:none" />

<!-- 提示词查看/编辑弹窗 -->
<div id="promptModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <span id="promptModalTitle">提示词</span>
      <button class="icon-btn" id="promptModalClose" title="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p class="modal-hint" id="promptModalHint">此提示词会自动拼到原文前面，一起发送给模型。</p>
      <textarea id="promptModalText" spellcheck="false"></textarea>
    </div>
    <div class="modal-foot">
      <span id="promptModalCount" class="modal-count">0 字</span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn-ghost" id="promptModalReset">恢复默认</button>
      <button class="btn-primary-sm" id="promptModalSave">保 存</button>
    </div>
  </div>
</div>

<!-- 历史记录弹窗(本地浏览器存储) -->
<div id="historyModal" class="modal history-modal">
  <div class="modal-card">
    <div class="modal-head">
      <span>历 史 记 录</span>
      <button class="icon-btn" id="historyModalClose" title="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

let _stickBottom = true;            // 当前是否处于"贴底"状态

function typeTextIntoElement(el, text, onCount) {
  return new Promise(resolve => {
    const full = String(text || '');
    let i = 0;
    el.textContent = '';
    const step = () => {
      if (currentAbort && currentAbort.signal.aborted) {
        el.textContent = full;
        if (onCount) onCount(full.length);
        maybeScroll();
        resolve();
        return;
      }
      if (i >= full.length) { resolve(); return; }
      i += 1;
      el.textContent = full.slice(0, i);
      if (onCount) onCount(i);
      maybeScroll();
      let delay = 18;
      const remain = full.length - i;
      if (remain > 220) delay = 12;
      if (remain > 900) delay = 8;
      setTimeout(step, delay);
    };
    step();
  });
}

  pane._stickWatchBound = true;

  ensureToBottomFab(pane);   // 创建右下角「跳到底部」浮动箭头

  pane.addEventListener('scroll', () => {
    // 用户滚到底部附近 → 恢复贴底;离开底部 → 解除贴底
    _stickBottom = _isAtBottom(pane);
    updateToBottomFab();
  }, { passive: true });
}

/** 确保「跳到底部」箭头存在(挂在滚动容器的父级 .pane 上,固定在右下角) */
function ensureToBottomFab(pane) {
  const host = pane.parentElement;        // .pane(已设 position:relative)
  if (!host || document.getElementById('toBottomFab')) return;
  const fab = document.createElement('button');
  fab.id = 'toBottomFab';
  fab.className = 'to-bottom-fab';
  fab.type = 'button';
  fab.title = '跳到最新内容';
  fab.setAttribute('aria-label', '跳到底部');
  fab.textContent = '↓';
  fab.addEventListener('click', () => { forceScrollBottom(); });
  host.appendChild(fab);
}

/** 根据是否贴底决定箭头显隐:下方还有没看到的内容(未贴底)才显示 */
function updateToBottomFab() {
  const pane = _outputPane();
  const fab = document.getElementById('toBottomFab');
  if (!pane || !fab) return;
  fab.classList.toggle('show', !_isAtBottom(pane));
}

/** 拼接接口完整 URL，去掉服务器地址末尾的斜杠 */
function apiUrl(path) {
  const base = LS.server.replace(/\/+$/, '');
  return base + path;
}

/** 标准 JSON 请求 */
async function apiFetch(path, opts = {}) {
  const headers = Object.assign(
    { 'Content-Type': 'application/json' },
    opts.headers || {}
  );
  if (LS.token) headers['Authorization'] = 'Bearer ' + LS.token;

  const res = await fetch(apiUrl(path), {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });

  let data;
  try { data = await res.json(); } catch { data = null; }

  if (!res.ok) {
    const msg = (data && (data.message || data.msg)) || ('HTTP ' + res.status);
    if (res.status === 401) { logout(); throw new Error('登录已过期，请重新登录'); }
    throw new Error(msg);
  }
  // ThinkPHP 习惯：code 0 = 成功
  if (data && typeof data.code !== 'undefined' && data.code !== 0) {
    throw new Error(data.message || data.msg || '接口错误');
  }
  return data ? (data.data !== undefined ? data.data : data) : null;
}

/* =====================================================
 *  登录 / 登出
 * ===================================================== */
async function doLogin() {
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;

  if (!username) return showLoginErr('请填写用户名');
  if (!password) return showLoginErr('请填写密码');

  $('loginBtn').disabled = true;
  $('loginBtn').textContent = '登 录 中 …';

  try {
    const data = await apiFetch('/api/c/auth/login', {
      method: 'POST',
      body: { username, password },
    });
    if (!data || !data.token) throw new Error('返回数据异常');
    LS.token = data.token;
    LS.user  = data.user;
    LS.username = username;
    showLoginErr('');
    enterApp();
  } catch (e) {
    showLoginErr(e.message || '登录失败');
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = '登 录';
  }
}

function showLoginErr(msg) {
  const el = $('loginErr');
  el.textContent = msg || '';
  el.className = 'login-err' + (msg ? ' show' : '');
}

function logout() {
  LS.token = '';
  LS.user = null;
  $('app').classList.remove('active');
  $('loginStage').style.display = 'flex';
  // 预填上次的信息
  $('loginUser').value   = LS.username;
  $('loginPass').value   = '';
}

/* =====================================================
 *  进入主工作台
 * ===================================================== */
async function enterApp() {
  $('loginStage').style.display = 'none';
  $('app').classList.add('active');

  // 显示用户信息
  const u = LS.user || {};
  $('metaUser').textContent = u.nickname || u.username || '-';
  $('metaPoints').textContent = u.points !== undefined ? u.points : '--';

}

function loadStyles() {

    opt.value = id;
